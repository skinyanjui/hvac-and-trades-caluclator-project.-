const sourceLinks={energy:['ENERGY STAR · Room AC sizing','https://www.energystar.gov/products/room_air_conditioners'],calc:['Calculator.net · BTU reference','https://www.calculator.net/btu-calculator.html'],conversion:['Calculator.net · Conversion reference','https://www.calculator.net/conversion-calculator.html'],manual:['ACCA · Manual J','https://www.acca.org/standards/technical-manuals/manual-j'],ashrae:['ASHRAE · Psychrometrics','https://handbook.ashrae.org/Handbooks/F21/SI/F21_Ch01/F21_Ch01_si.aspx'],nist:['NIST · SI conversion reference','https://www.nist.gov/pml/special-publication-811'],imc:['ICC · 2024 IMC','https://codes.iccsafe.org/content/IMC2024V1.0'],ipc:['ICC · 2024 IPC','https://codes.iccsafe.org/content/IPC2024P1'],ifc:['ICC · 2024 IFC','https://codes.iccsafe.org/content/IFC2024V1.0'],ifgc:['ICC · 2024 IFGC','https://codes.iccsafe.org/content/IFGC2024V1.0'],iecc:['ICC · 2024 IECC','https://codes.iccsafe.org/content/IECC2024V1.0'],ashrae15:['ASHRAE · Standard 15','https://www.ashrae.org/technical-resources/bookstore/standards-15-34'],irc:['ICC · 2024 IRC','https://codes.iccsafe.org/content/IRC2024P1'],ashrae152:['ASHRAE · Standard 15.2','https://www.ashrae.org/technical-resources/bookstore/standards-15-34']};

const calculators=[
{id:'btu',name:'Room cooling',group:'HEATING & COOLING',icon:'snow',desc:'Estimate the cooling a room air conditioner needs.',badge:'Room estimate',sources:['energy','calc','manual'],fields:[field('area','Floor area','ft²',500,100,2500),field('height','Ceiling height','ft',8,1,30),field('people','Regular occupants','people',2,0,1000,1),choice('sun','Sun exposure',[['normal','Typical'],['shade','Heavily shaded'],['sunny','Very sunny']],'normal'),choice('room','Room type',[['room','Living space'],['kitchen','Kitchen']],'room')],calculate:v=>{if(v.height!==8)throw Error('This table is based on an 8 ft ceiling. Use a detailed load calculation for other ceiling heights.');const base=BANDS.find(([end],i)=>v.area<end||i===BANDS.length-1)[1];const sun=base*({normal:0,shade:-.1,sunny:.1}[v.sun]);const people=Math.max(0,v.people-2)*600;const kitchen=v.room==='kitchen'?4000:0;const total=base+sun+people+kitchen;return result(total,'BTU/h',[['Floor-area table',base,'BTU/h'],['Sun exposure',sun,'BTU/h'],['Additional occupants',people,'BTU/h'],['Kitchen adjustment',kitchen,'BTU/h']],`${fmt(base)} ${sun<0?'−':'+'} ${fmt(Math.abs(sun))} + ${fmt(people)} + ${fmt(kitchen)} = ${fmt(total)} BTU/h`,'Room AC screening estimate. Insulation, local climate, glazing, humidity, and duct losses are not modeled. Whole-home equipment selection needs a detailed load calculation.',[[total/12000,'tons cooling'],[total/3412.141633,'kW thermal']]);}},
{id:'heat',name:'Heat transfer',group:'HEATING & COOLING',icon:'heat',desc:'Find steady heat flow through one building assembly.',badge:'Assembly heat flow',sources:['manual'],fields:[field('u','Assembly U-factor','BTU/h·ft²·°F',.06,.000001,1000),field('area','Assembly area','ft²',1000,.001),field('inside','Indoor temperature','°F',70,-459.66,1000),field('outside','Outdoor temperature','°F',20,-459.66,1000)],calculate:v=>{let dt=Math.abs(v.inside-v.outside),q=v.u*v.area*dt;return result(q,'BTU/h',[['Temperature difference',dt,'°F'],['Assembly area',v.area,'ft²']],`Q = U × A × |ΔT| = ${v.u} × ${v.area} × ${fmt(dt)}`,'One assembly only. Use the whole-assembly U-factor, including layers and thermal bridges. Excludes solar gain, internal loads, moisture and air leakage. Heat flows from the warmer side to the cooler side.');}},
{id:'furnace',name:'Furnace efficiency',group:'HEATING & COOLING',icon:'heat',desc:'Compare rated heat output with rated fuel input.',badge:'Nameplate ratio',sources:[],fields:[field('input','Rated input','BTU/h',80000,.001),field('output','Rated output','BTU/h',74000,0)],calculate:v=>{if(v.output>v.input)throw Error('For a fuel-burning furnace, rated output cannot exceed rated input. Check the nameplate values.');return result(v.output/v.input*100,'%', [['Rated fuel input',v.input,'BTU/h'],['Rated heat output',v.output,'BTU/h'],['Input − output',v.input-v.output,'BTU/h']],`Efficiency = output ÷ input × 100 = ${v.output} ÷ ${v.input} × 100`,'This is the nameplate output/input ratio, not a measured seasonal AFUE. Use the manufacturer’s certified AFUE for seasonal comparisons. The difference does not separately identify each type of loss.');}},

function convert(category,value,from,to){let x;if(category==='Temperature'){x=from==='°F'?(value-32)*5/9+273.15:from==='°C'?value+273.15:from==='°R'?value*5/9:value;if(x<-.00000001)throw Error('Temperature cannot be below absolute zero.');return to==='°F'?(x-273.15)*9/5+32:to==='°C'?x-273.15:to==='°R'?x*9/5:x;}return value*units[category][from]/units[category][to];}

// IAPWS saturation relations referenced by ASHRAE Fundamentals (2021), ch. 1, eqs. 5–6.
// Pressure in kPa; liquid water at/above 0 C, ice below 0 C.
function saturationPressure(t) {
  const T=t+273.15;
  if(t<0) { const q=T/273.16; return .611657*Math.exp((-21.2144006*q**.00333333333+27.3203819*q**1.20666667-6.1059813*q**1.70333333)/q); }
  const th=T-.23855557567849/(T-650.17534844798);
  const A=th*th+1167.0521452767*th-724213.16703206;
  const B=-17.073846940092*th*th+12020.82470247*th-3232555.0322333;
  const C=14.91510861353*th*th-4823.2657361591*th+405113.40542057;
  return 1000*(2*C/(-B+Math.sqrt(B*B-4*A*C)))**4;
}
function moistAir(t,rh,p) {
  const pv=saturationPressure(t)*rh/100;
  if(pv>=p) throw Error('Water vapor pressure must be below total pressure. Check temperature, humidity and barometric pressure.');
  const w=.621945*pv/(p-pv), h=1.006*t+w*(2501+1.86*t);
  let lo=-100,hi=t;
  if(pv<saturationPressure(lo))throw Error('Dew/frost point is below this calculator’s supported range.');
  for(let i=0;i<65;i++){const mid=(lo+hi)/2;if(saturationPressure(mid)>pv)hi=mid;else lo=mid;}
  return {pv,w,h,dew:(lo+hi)/2,volume:.287042*(t+273.15)*(1+1.607858*w)/p};
}

calculators.push(
{id:'outdoorair',name:'Outdoor air',group:'CODE & VENTILATION',icon:'air',desc:'Screen breathing-zone and zone outdoor airflow from model ventilation rates.',badge:'Ventilation screen',sources:['imc'],fields:[
choice('occupancy','Occupancy classification',occOptions,'office','Occupiable space (IMC 2024 §202): enclosed space intended for human activities; excludes storage, equipment, or similar rooms occupied only briefly.'),
field('area','Zone floor area Az','ft²',2000,.001,1e9,'any','Net occupiable floor area Az (IMC 2024 §202): floor area defined by the inside surfaces of walls; do not deduct furniture, racks, or other temporary or permanent obstructions. Exclude shafts, column enclosures, and inaccessible unoccupiable areas.'),
choice('population','Zone population Pz',[['density','Default from table density × Az / 1000'],['manual','Enter population manually']],'density','Default Pz uses Table 403.3.1.1 occupant density × Az / 1000 unless an approved alternate density applies.'),
field('people','Zone population Pz','people',10,0,100000),
choice('ez','Air distribution effectiveness Ez',ezOptions,'cool','Breathing zone (IMC 2024 §202): 3–72 in. above the floor and more than 2 ft from walls or fixed air-conditioning equipment. Ez (Table 403.3.1.1.1.2) adjusts outdoor air delivered to that zone.'),
choice('ezMode','Ez source',[['table','Use selected air-distribution configuration'],['override','Override Ez manually']],'table'),
field('ezOverride','Ez override','Ez',1,.1,2)
],calculate:v=>{
  const occ=imcOccupancies[v.occupancy];if(!occ)throw Error('Choose a valid occupancy classification.');
  const ezEntry=imcEz[v.ez];if(!ezEntry)throw Error('Choose a valid air distribution effectiveness.');
  const Ez=v.ezMode==='override'?v.ezOverride:ezEntry[1];
  if(v.ezMode==='override'&&(!Number.isFinite(Ez)||Ez<=0))throw Error('Ez override must be greater than zero.');
  const hasPeople=occ.rp!=null,hasArea=occ.ra!=null;
  if(!hasPeople&&!hasArea)throw Error('This occupancy has no outdoor-air rates in the embedded table subset.');
  let Pz=0;
  if(hasPeople){
    if(occ.density!=null&&v.population==='density')Pz=occ.density*v.area/1000;
    else{
      if(v.people===''||!Number.isFinite(v.people))throw Error('Enter zone population Pz.');
      Pz=v.people;
    }
  }
  const Rp=occ.rp??0,Ra=occ.ra??0,peopleOA=Rp*Pz,areaOA=Ra*v.area,Vbz=peopleOA+areaOA,Voz=Vbz/Ez;
  const notes=occ.notes||[],recircBanned=notes.includes('b')||notes.includes('g');
  const rows=[];
  if(occ.density!=null)rows.push(['Occupant density',occ.density,'#/1000 ft²']);
  if(hasPeople){rows.push(['People outdoor-air rate Rp',Rp,'cfm/person']);rows.push(['Zone population Pz',Pz,'people']);rows.push(['People outdoor air Rp × Pz',peopleOA,'cfm']);}
  if(hasArea){rows.push(['Area outdoor-air rate Ra',Ra,'cfm/ft²']);rows.push(['Area outdoor air Ra × Az',areaOA,'cfm']);}
  rows.push(['Breathing-zone outdoor air Vbz',Vbz,'cfm'],['Air distribution effectiveness Ez',Ez,v.ezMode==='override'?'(override)':'']);
  if(occ.exhaust!=null)rows.push(['Exhaust required (table)',occ.exhaust,'cfm/ft²']);
  if(recircBanned)rows.push(['Recirculation from space banned',1,'yes (Note b/g)']);
  const cite='Citations: 2024 IMC §403.3.1.1 (Table), §403.3.1.1.1.1 Eq. 4-1, §403.3.1.1.1.2 (Ez), §403.3.1.1.1.3 Eq. 4-2. Jurisdiction: IMC §101.1 — confirm your adopted edition and amendments; these are model 2024 IMC values for screening only.';
  return result(Voz,'cfm',rows,
    `Vbz = Rp×Pz + Ra×Az = ${Rp}×${fmt(Pz,4)} + ${Ra}×${fmt(v.area)} = ${fmt(Vbz,4)} cfm; Voz = Vbz/Ez = ${fmt(Vbz,4)}/${Ez} = ${fmt(Voz,4)} cfm`,
    `${cite} Air distribution: ${ezEntry[0]}. Outdoor air (IMC 2024 §202): air from outdoors, not previously circulated through the system. Rates assume no smoking except smoking lounges. Missing Rp or Ra treated as 0. Not a compliance certificate.${occ.exhaustNote?` ${occ.exhaustNote}.`:''}${recircBanned?' Recirculation from this occupancy is restricted by Table notes b/g.':''}`,
    [[Vbz,'cfm Vbz'],[peopleOA,'cfm people OA'],[areaOA,'cfm area OA']]);
}},
{id:'exhaust',name:'Local exhaust',group:'CODE & VENTILATION',icon:'air',desc:'Estimate local exhaust for toilets, kitchens, garages, and similar spaces.',badge:'Exhaust screen',sources:['imc'],fields:[
choice('occupancy','Exhaust occupancy',exhaustOptions,'publictoilet'),
choice('mode','Exhaust operation',[['continuous','Continuous while occupied (lower rate)'],['intermittent','Intermittent (higher rate)']],'continuous'),
field('area','Floor area','ft²',400,.001),
field('fixtures','Water closets / urinals','fixtures',3,1,500,1),
field('rooms','Number of rooms','rooms',1,1,500,1)
],calculate:v=>{
  const row=imcExhaust[v.occupancy];if(!row)throw Error('Choose a valid exhaust occupancy.');
  let rate,qty,unit,label,total;
  if(row.kind==='area'){
    rate=row.rate;qty=v.area;unit='cfm/ft²';label='Floor area';total=rate*qty;
  }else{
    rate=v.mode==='intermittent'?row.high:row.low;
    qty=row.kind==='fixture'?v.fixtures:v.rooms;
    unit=row.kind==='fixture'?'cfm/fixture':'cfm/room';
    label=row.kind==='fixture'?'Fixtures':'Rooms';
    total=rate*qty;
  }
  const notes=row.notes||[],recircBanned=notes.includes('b')||notes.includes('g');
  const rows=[
    ['Exhaust rate used',rate,unit],

  ];
  if(recircBanned)rows.push(['Recirculation from space banned',1,'yes (Note b/g)']);
  return result(total,'cfm',rows,
  `Exhaust = ${rate} ${unit} × ${fmt(qty)} = ${fmt(total)} cfm`,
  `Model-code screening from 2024 IMC Table 403.3.1.1 exhaust column (IMC §101.1 — verify your adopted edition). ${row.note||'Verify table notes and amendments.'} Makeup / transfer air and outdoor-air requirements are separate (see Outdoor air calculator). Appendices are not applied unless your AHJ adopts them. Fuel-gas appliances and venting are IFGC scope (IMC §101.2), not this tool. This does not certify code compliance.`);
}}
);

function freeAreaFraction(v){
  if(v.louver==='metal')return .75;
  if(v.louver==='wood')return .25;
  return v.freeAreaPct/100;
}
function outdoorNetEach(method,total,sumConn){
  if(method==='outdoor_two_vertical')return {netEach:total/4000,netTotal:null,openings:2,location:'One opening within 12 in of the top and one within 12 in of the bottom of the enclosure',minDim:3,cite:'IFGC §304.6.1'};
  if(method==='outdoor_two_horizontal')return {netEach:total/2000,netTotal:null,openings:2,location:'One opening within 12 in of the top and one within 12 in of the bottom of the enclosure',minDim:3,cite:'IFGC §304.6.1'};
  if(method==='outdoor_one')return {netEach:null,netTotal:Math.max(total/3000,sumConn),openings:1,location:'Opening within 12 in of the top of the enclosure; communicate directly outdoors or through vertical / horizontal ducts',minDim:3,cite:'IFGC §304.6.2'};
  return null;
}
calculators.push(
{id:'combustionair',name:'Combustion air',group:'CODE & FUEL GAS',icon:'heat',desc:'Size combustion-air openings and indoor volume for fuel-burning appliances.',badge:'Combustion air',sources:['ifgc'],fields:[
field('inputOther','Draft-hood / other appliance input','Btuh',100000,0),
field('inputFan','Fan-assisted appliance input','Btuh',0,0),
field('sumConnectors','Sum of vent connector areas','in²',0,0,'any','Sum all appliance vent-connector free areas when using the one-opening outdoor method (§304.6.2).'),
choice('method','Combustion-air method',combustionMethods,'outdoor_two_vertical'),
choice('directVent','Direct-vent or manufacturer combustion-air path',[['no','No — apply §304 opening / volume methods'],['yes','Yes — manufacturer instructions (IFGC 304.1)']],'no','If yes, opening tables are not applied (IFGC §304.1).'),
field('volume','Enclosure volume','ft³',5000,.001),
field('ach','Measured ACH','ACH',.35,.001,10,'any','Clamped to ≤0.60 for KAIR (§304.5.2).'),
field('availableVolume','Available indoor volume','ft³',3000,0,'any','For combination method: indoor volume that can be counted toward the required volume.'),
choice('outdoorSub','Outdoor openings for combination',outdoorSubMethods,'outdoor_two_vertical'),
choice('louver','Louver / grille free area',[['metal','Metal louvers · 75% free'],['wood','Wood louvers · 25% free'],['custom','Custom free-area percent']],'metal'),
field('freeAreaPct','Custom free-area','%',75,.1,100)
],calculate:v=>{
  const ahj='Model 2024 IFGC (confirm your adopted edition and amendments). Screening tool only — not a compliance certificate.';
  if(v.directVent==='yes'){
    return result(0,'—',[
      ['Use manufacturer instructions (IFGC 304.1)',1,'yes'],
      ['Opening tables applied',0,'no']
    ],'Direct-vent appliances or manufacturer-specified combustion-air path → do not run §304.5 / §304.6 opening tables.',
    `Use manufacturer instructions (IFGC 304.1). ${ahj}`,[],['IFGC §304.1']);
  }
  const Iother=v.inputOther,Ifan=v.inputFan,total=Iother+Ifan;
  if(total<=0)throw Error('Enter at least one appliance input (Btuh).');
  const sumConn=v.sumConnectors,frac=freeAreaFraction(v);
  if(!(frac>0&&frac<=1))throw Error('Free-area fraction must be greater than 0 and at most 100%.');
  const rows=[['Total appliance input',total,'Btuh'],['Draft-hood / other input',Iother,'Btuh'],['Fan-assisted input',Ifan,'Btuh']];
  let hero=0,unit='in²',formula='',extra=[],requiredV=null,volumeOk=null,net=null,netEach=null,openings=null,location='',minDim=null,cfm=null,gross=null,cites=[];

  if(v.method==='indoor_volume_standard'){
    requiredV=total/1000*50;volumeOk=v.volume>=requiredV?1:0;
    hero=requiredV;unit='ft³ required';
    rows.push(['Required volume V',requiredV,'ft³'],['Enclosure volume',v.volume,'ft³'],['Volume OK',volumeOk,volumeOk?'yes':'no — provide openings or more volume']);
    formula=`V = (I/1000)×50 = (${fmt(total)}/1000)×50 = ${fmt(requiredV)} ft³`;
    cites=['IFGC §304.5.1'];
  }else if(v.method==='indoor_volume_kair'){
    const ACH=Math.min(v.ach,.6);
    const Vother=(21/ACH)*(Iother/1000),Vfan=(15/ACH)*(Ifan/1000);
    requiredV=Vother+Vfan;volumeOk=v.volume>=requiredV?1:0;
    hero=requiredV;unit='ft³ required';
    rows.push(['ACH used (clamped ≤0.60)',ACH,'ACH'],['Required volume · other',Vother,'ft³'],['Required volume · fan-assisted',Vfan,'ft³'],['Required volume V',requiredV,'ft³'],['Enclosure volume',v.volume,'ft³'],['Volume OK',volumeOk,volumeOk?'yes':'no — provide openings or more volume']);
    formula=`ACH=min(${v.ach},0.60)=${fmt(ACH,4)}; Vother=(21/ACH)×(Iother/1000); Vfan=(15/ACH)×(Ifan/1000); V=${fmt(requiredV)} ft³`;
    cites=['IFGC §304.5.2'];
  }else if(v.method==='mechanical'){
    cfm=.35*(total/1000);hero=cfm;unit='cfm';
    rows.push(['Mechanical combustion air',cfm,'cfm']);
    formula=`cfm = 0.35 × (I/1000) = 0.35 × (${fmt(total)}/1000) = ${fmt(cfm)} cfm`;
    cites=['IFGC §304.9'];
  }else if(v.method==='indoor_openings_same_story'){
    netEach=Math.max(total/1000,100);net=netEach;openings=2;minDim=3;
    location='Two permanent openings to an adjacent interior space on the same story; one within 12 in of the top and one within 12 in of the bottom';
    hero=netEach;unit='in² each';gross=netEach/frac;
    rows.push(['Net free area each',netEach,'in²'],['Openings',openings,''],['Min dimension',minDim,'in'],['Free-area fraction',frac,''],['Gross opening each',gross,'in²']);
    formula=`net_each = max(I/1000, 100) = max(${fmt(total/1000)}, 100) = ${fmt(netEach)} in²; gross = net / free_area`;
    cites=['IFGC §304.5.3.1'];
  }else if(v.method==='indoor_openings_diff_story'){
    net=total/1000*2;openings=1;minDim=3;
    location='Openings communicating with the outdoors through vertical ducts or to spaces on another story; see IFGC for path details';
    hero=net;unit='in² total';gross=net/frac;
    rows.push(['Net free area total',net,'in²'],['Openings (paths)',openings,''],['Min dimension',minDim,'in'],['Free-area fraction',frac,''],['Gross opening',gross,'in²']);
    formula=`net_total = (I/1000)×2 = (${fmt(total)}/1000)×2 = ${fmt(net)} in²; gross = net / free_area`;
    cites=['IFGC §304.5.3.2'];
  }else if(v.method==='combination'){
    requiredV=total/1000*50;
    const avail=v.availableVolume;
    const factor=Math.min(1,Math.max(0,1-avail/requiredV));
    const full=outdoorNetEach(v.outdoorSub,total,sumConn);if(!full)throw Error('Choose a valid outdoor sub-method.');
    volumeOk=avail>=requiredV?1:0;
    location=full.location;minDim=full.minDim;openings=full.openings;cites=['IFGC §304.7',full.cite];
    rows.push(['Required indoor volume',requiredV,'ft³'],['Available indoor volume',avail,'ft³'],['Outdoor fraction',factor,''],['Volume fully satisfied indoors',volumeOk,volumeOk?'yes':'no']);
    if(full.netEach!=null){
      netEach=full.netEach*factor;net=netEach;hero=netEach;unit='in² each outdoor';gross=factor>0?netEach/frac:0;
      rows.push(['Full outdoor net each',full.netEach,'in²'],['Outdoor net each × factor',netEach,'in²']);
      formula=`Vreq=(I/1000)×50; factor=clamp(1−avail/Vreq,0,1)=${fmt(factor,4)}; outdoor_net_each=full_304_6_net×factor=${fmt(full.netEach)}×${fmt(factor,4)}=${fmt(netEach)} in²`;
    }else{
      net=full.netTotal*factor;hero=net;unit='in² outdoor';gross=factor>0?net/frac:0;
      rows.push(['Full outdoor net',full.netTotal,'in²'],['Outdoor net × factor',net,'in²']);
      formula=`Vreq=(I/1000)×50; factor=clamp(1−avail/Vreq,0,1)=${fmt(factor,4)}; outdoor_net=full_304_6_net×factor=${fmt(full.netTotal)}×${fmt(factor,4)}=${fmt(net)} in²`;
    }
    if(factor>0){rows.push(['Openings',openings,''],['Min dimension',minDim,'in'],['Free-area fraction',frac,''],['Gross opening',gross,'in²']);}
  }else{
    const full=outdoorNetEach(v.method,total,sumConn);if(!full)throw Error('Choose a valid combustion-air method.');
    location=full.location;minDim=full.minDim;openings=full.openings;cites=[full.cite];
    if(full.netEach!=null){
      netEach=full.netEach;net=netEach;hero=netEach;unit='in² each';gross=netEach/frac;
      rows.push(['Net free area each',netEach,'in²']);
      formula=`net_each = I / ${v.method==='outdoor_two_vertical'?4000:2000} = ${fmt(total)} / ${v.method==='outdoor_two_vertical'?4000:2000} = ${fmt(netEach)} in²; gross = net / free_area`;
    }else{
      net=full.netTotal;hero=net;unit='in²';gross=net/frac;
      rows.push(['Vent connector sum',sumConn,'in²'],['I/3000',total/3000,'in²'],['Net free area',net,'in²']);
      formula=`net = max(I/3000, Σconnectors) = max(${fmt(total/3000)}, ${fmt(sumConn)}) = ${fmt(net)} in²; gross = net / free_area`;
    }
    rows.push(['Openings',openings,''],['Min dimension',minDim,'in'],['Free-area fraction',frac,''],['Gross opening',gross,'in²']);
  }

  if(cfm!=null)extra.push([cfm,'cfm mechanical']);
  if(requiredV!=null)extra.push([requiredV,'ft³ required']);
  if(netEach!=null&&v.method!=='combination')extra.push([netEach,'in² net each']);

  const citeChips=['IFGC §304.1',...cites].filter((x,i,a)=>a.indexOf(x)===i);
  return result(hero,unit,rows,formula,`${location?location+'. ':''}${minDim!=null?`Minimum dimension ${minDim} in where applicable. `:''}${ahj} Louvers/grilles: use manufacturer free area or 75% metal / 25% wood.`,extra,citeChips);
}},
{id:'condensate',name:'Condensate drain',group:'CODE & VENTILATION',icon:'water',desc:'Choose a minimum condensate drain diameter from cooling capacity.',badge:'Drain size',sources:['imc','ipc'],fields:[

calculators.push(
{id:'venting',name:'Venting category',group:'CODE & FUEL GAS',icon:'heat',desc:'Route appliance venting by category and prepare Category I inputs — without inventing table cells.',badge:'Vent routing',sources:['ifgc'],fields:[

choice('connectorIntoPos','Cat I connector into positive-pressure mech-draft vent?',[['no','No'],['yes','Yes — connector enters positive-pressure mechanical-draft vent']],'no','IFGC §503.10.4 not allowed when Category I connector serves into a positive-pressure mechanical-draft vent system.'),

  {id:'4',label:'4. 3½-in masonry wall with ventilated airspace',masonry:true,above:[null,null,null,null,null],sides:[12,6,6,6,6]},
  {id:'5',label:'5. 0.024-in (24 ga) sheet metal with ventilated airspace',masonry:false,above:[18,9,6,5,3],sides:[12,6,4,3,2]},

function ifgc308Interp(vals, required){
  if(!(required>0)||!Number.isFinite(required))throw Error('Enter a positive required clearance (inches).');
  if(required<6)throw Error('Hard stop: IFGC §308.2 — reduced clearances shall not be derived by extrapolation below the range of Table 308.2 (columns start at 6 in).');
  if(required>36)throw Error('Outside this tool’s range: required clearance > 36 in is outside the digitized Table 308.2 column set (36/18/12/9/6). Verify with the adopted table; this tool does not invent values above 36 in.');
  const cols=IFGC308_COLS;
  for(let i=0;i<cols.length;i++){
    if(Math.abs(required-cols[i])<1e-9){
      const cell=vals[i];
      if(cell==null)throw Error('Hard stop: Table 308.2 marks this masonry/orientation cell N/A (Above Col. 1). Choose Sides and rear, another protection method, or UL 1618 listing path.');
      return {reduced:cell,exact:true,loCol:cols[i],hiCol:cols[i],loVal:cell,hiVal:cell};
    }
  }
  for(let i=0;i<cols.length-1;i++){

      const reduced=vHi+(vLo-vHi)*((hi-required)/(hi-lo));
      return {reduced,exact:false,loCol:lo,hiCol:hi,loVal:vLo,hiVal:vHi};
    }
  }
  throw Error('Internal Table 308.2 column error.');
}

// Machinery-room ventilation — machinery-room ventilation screening (scholar-aligned).
// Paths:
//   non_2L_sqrtG     → A1/A2/A3/B1/B2/B3 only; Q = 100*sqrt(G) per IMC §1105.6.3.2 Eq 11-2
//                      (same relationship as ASHRAE 15 Addendum q). Do NOT put B2L on √G.
//   a2l_level1_level2 → A2L and B2L; NEVER √G; Level 1 continuous + Level 2 from Addendum q
//                      (P=DP+14.70; Q*=646×P^0.62; G*=21200×P^-0.72; Eq 8-1/8-2/8-3; Q≥Q1;
//                      round up 2 sig figs; multi-refrig → max Q). Cite IMC §1106.4 / §1106.4.3.
// codeFamily default IMC (national US). UMC → verify_manual (different B2L/√G lineage).
// Continuous: IMC §1105.6.3.1 max(0.5×ft², 20×persons) unverified example pending 15-2024 confirm
//             + optional 18°F rise screening note.
const MRVENT_NON_2L=new Set(['A1','A2','A3','B1','B2','B3']);
const MRVENT_A2L_B2L=new Set(['A2L','B2L']);
function mrventPath(safetyGroup){
  if(MRVENT_NON_2L.has(safetyGroup))return 'non_2L_sqrtG';
  if(MRVENT_A2L_B2L.has(safetyGroup))return 'a2l_level1_level2';
  throw Error(`Unsupported refrigerant safety group "${safetyGroup}" for Machinery-room ventilation.`);
}
function mrventRoundUp2Sig(x){
  if(!(x>0)||!Number.isFinite(x))return x;
  const exp=Math.floor(Math.log10(x));
  const factor=Math.pow(10,exp-1);
  return Math.ceil(x/factor-1e-12)*factor;
}
function mrventLevel2({G,DP,Q1}){
  const P=DP+14.70;
  const Qstar=646*Math.pow(P,0.62);
  const Gstar=21200*Math.pow(P,-0.72);
  let Qeq,eqId;
  if(G<0.1*Gstar){Qeq=Qstar*0.102;eqId='8-1';}
  else if(G<=Gstar){Qeq=Qstar*(1+0.39*Math.log(G/Gstar));eqId='8-2';}
  else {Qeq=Qstar;eqId='8-3';}
  const beforeRound=Math.max(Qeq,Q1);
  const Q=mrventRoundUp2Sig(beforeRound);
  return {P,Qstar,Gstar,Qeq,eqId,beforeRound,Q};
}

// Refrigeration path gate — path selection only. NO numeric charge / RCL / mmax.
function ashrae152PathGate(v){
  const reasons=[];
  const citations=[];
  const single=v.serves_single_dwelling_or_sleeping_unit==='yes';
  const listed=v.system_listed==='yes';
  const listedUnknown=v.system_listed==='unknown';
  const multi=v.system_serves_common_or_multiple_units==='yes';
  const bt=v.building_type;
  const residentialFamily=['one_two_family','townhouse'].includes(bt);
  const multifamily=bt==='multifamily';
  const commercial=bt==='commercial';

  let path='blocked_need_ahj';

  // 1) multi-unit OR not single dwelling/sleeping → std15_imc_ch11
  if(multi||!single){
    path='std15_imc_ch11';
    reasons.push(multi?'system_serves_common_or_multiple_units':'not_single_dwelling_or_sleeping_unit');
    citations.push('ASHRAE 15','IMC Ch 11');
  }
  // 2) commercial → std15_imc_ch11 (15.2 residential path is for dwellings / sleeping units, not commercial buildings)
  else if(commercial){
    path='std15_imc_ch11';
    reasons.push(single&&!multi?'commercial_building_not_15_2_residential':'commercial_without_single_unit_system');
    citations.push('ASHRAE 15','IMC Ch 11');
  }
  // 3) not listed → std15_imc_ch11 (or blocked_need_ahj if unknown)
  else if(listedUnknown){
    path='blocked_need_ahj';
    reasons.push('listing_unknown_need_ahj');
    citations.push('AHJ confirm listing');
  }
  else if(!listed){
    path='std15_imc_ch11';
    reasons.push('system_not_listed');
    citations.push('ASHRAE 15','IMC Ch 11');
  }
  // 4) one/two family or townhouse OR multifamily+single-unit + listed → 15_2_residential
  else if((residentialFamily||(multifamily&&single&&!multi))&&listed&&single){
    path='15_2_residential';
    reasons.push(residentialFamily?'one_two_family_or_townhouse_listed_single':'multifamily_single_unit_listed');
    citations.push('ASHRAE 15.2');
    if(v.code_family==='irc'||residentialFamily)citations.push('IRC install path');
  }
  else{
    path='blocked_need_ahj';
    reasons.push('insufficient_path_inputs');
    citations.push('AHJ confirm');
  }

  const flag_irc_install=path==='15_2_residential'&&(v.code_family==='irc'||residentialFamily);
  const flag_ashrae_152_charge=path==='15_2_residential';
  const flag_ashrae_15_charge=path==='std15_imc_ch11';
  const flag_imc_machinery_room=path==='std15_imc_ch11'&&(commercial||multi||v.machinery_room_context==='yes');

  return {path,reasons,citations,flags:{flag_irc_install,flag_ashrae_152_charge,flag_ashrae_15_charge,flag_imc_machinery_room},verified:false};
}

{id:'multizoneoa',name:'Multizone outdoor air (IMC 403)',group:'CODE & VENTILATION',icon:'air',desc:'Calculate uncorrected and system outdoor-air intake from aggregate multizone inputs and a source-verified system ventilation efficiency.',badge:'IMC §403 · multizone',sources:['imc'],fields:[

field('sumZonePopulation','Sum of zone populations ΣPz','people',100,0.001,1e6),
field('sumPeopleOA','Sum of people outdoor air Σ(Rp×Pz)','cfm',120,0,1e8),
field('sumAreaOA','Sum of area outdoor air Σ(Ra×Az)','cfm',80,0,1e8),
field('ev','System ventilation efficiency Ev','0–1',0.9,0.01,1,'any','Enter a value verified from the adopted IMC table or an approved ASHRAE 62.1 procedure. No Ev table cells are embedded.'),

],calculate:v=>{

  const D=Math.min(1,v.systemPopulation/v.sumZonePopulation);

{id:'condensateoverflow',name:'Condensate overflow protection',group:'CODE & VENTILATION',icon:'water',desc:'Route IMC §307.2.3 auxiliary condensate protection when primary-drain overflow could damage building components.',badge:'IMC §307.2.3 · path gate',sources:['imc'],fields:[
choice('damageRisk','Could primary-drain overflow damage building components?',[['unknown','Unknown — inspect / verify'],['yes','Yes'],['no','No']],'unknown','This is the trigger question for the §307.2.3 auxiliary-protection path. Primary condensate disposal remains required separately.'),
choice('method','Selected auxiliary-protection method',[

['primary_shutoff','Listed water-level shutoff at primary / overflow / equipment pan'],
['internal_monitor','Internal primary-pan monitoring device where external pan / secondary drain is impracticable'],

],calculate:v=>{

  if(v.damageRisk==='unknown')throw Error('Determine whether a primary-drain overflow could damage building components before selecting a §307.2.3 path.');
  if(v.damageRisk==='no'){
    return result(0,'auxiliary path not triggered',[

      ['Primary condensate disposal',1,'still required'],

    ],'damageRisk = no → §307.2.3 auxiliary-protection trigger not established by this screen',
    `This result does not waive primary drainage, manufacturer instructions, or another adopted-code trigger. ${ahj}`,
    [],['IMC §307.2.3','Primary drain separate','AHJ verify']);
  }

  const drainMethod=v.method==='secondary_pan_drain'||v.method==='overflow_line';

  [[issues.length,'open checks']],['IMC §307.2.3','Auxiliary protection','AHJ + listing verify']);

{id:'frictionrate',name:'Duct friction rate',group:'AIR & DUCTS',icon:'duct',desc:'Calculate preliminary available-static-pressure friction rate from total effective length.',badge:'Manual D prep · engineering',sources:['manuald'],fields:[

{id:'makeupbalance',name:'Exhaust / makeup-air balance',group:'CODE & VENTILATION',icon:'air',desc:'Quantify replacement-air deficit for a kitchen or process exhaust system; the AHJ decides what is approximately equal.',badge:'IMC §508 · balance',sources:['imc'],fields:[
field('exhaust','Total mechanical exhaust','cfm',2000,0,1e7),
field('dedicated','Dedicated makeup air delivered','cfm',1600,0,1e7),
field('transfer','Approved transfer air available','cfm',200,0,1e7),
field('hvacCredit','Outdoor / supply air credit approved for replacement','cfm',0,0,1e7,'any','Use only air that is available during exhaust operation and approved by the designer / AHJ.'),
field('netExfiltration','Design net exfiltration','cfm',0,0,1e7,'any','Enter the project-design net exfiltration quantity. This calculator does not select it or an allowable pressure target.')
],calculate:v=>{
  const replacement=v.dedicated+v.transfer+v.hvacCredit;

    ['Replacement air credited',replacement,'cfm'],
    ['Design net exfiltration',v.netExfiltration,'cfm'],
    ['Replacement target used',requiredReplacement,'cfm'],
    ['Unfilled replacement-air deficit',deficit,'cfm'],
    ['Replacement surplus',surplus,'cfm'],
    ['Replacement / exhaust ratio',coverage,'%']
  ],`required replacement = total exhaust + net exfiltration = ${fmt(requiredReplacement)} cfm; provided replacement = dedicated + transfer + approved HVAC credit = ${fmt(replacement)} cfm; deficit = max(0, required − provided) = ${fmt(deficit)} cfm`,

{id:'equivduct',name:'Equivalent round duct',group:'AIR & DUCTS',icon:'duct',desc:'Convert a rectangular duct’s inside size to an equivalent round diameter for friction comparison.',badge:'Duct geometry',sources:['manuald','ashrae'],fields:[
field('width','Inside width','in',12,.001,1000),
field('height','Inside height','in',8,.001,1000)
],calculate:v=>{
  if(!(v.width>0&&v.height>0))throw Error('Duct width and height must be greater than zero.');
  const a=Math.max(v.width,v.height),b=Math.min(v.width,v.height);
  const area=v.width*v.height/144;
  const de=1.30*Math.pow(v.width*v.height,0.625)/Math.pow(v.width+v.height,0.25);
  const aspect=a/b;
  return result(de,'in equivalent',[
    ['Rectangular area',area,'ft²'],
    ['Aspect ratio (long ÷ short)',aspect,''],
    ['Equivalent round diameter',de,'in']
  ],`De = 1.30 × (a×b)^0.625 / (a+b)^0.25 = ${fmt(de,4)} in`,
  'Uses the common ASHRAE / Manual D equivalent-diameter relationship for equal friction. This is not a product size, fitting catalog selection, or a complete duct design. Extreme aspect ratios increase friction and noise beyond what diameter alone conveys.',
  [[area,'ft² area'],[aspect,'aspect']],['ASHRAE duct geometry','ACCA Manual D']);
}},

{id:'pumplaws',name:'Pump affinity laws',group:'HYDRONICS',icon:'water',desc:'See how a change in pump speed affects flow, head, and power.',badge:'Affinity laws',sources:[],fields:[

  ],`r = N₂/N₁; Q₂ = Q₁r; H₂ = H₁r²; P₂ = P₁r³`,
  'Same pump geometry, fluid density, and similar operating conditions. Check the pump curve, NPSH, motor capacity, and maximum safe speed. Shaft power is not electrical input.');
}},
{id:'pipevelocity',name:'Pipe velocity',group:'HYDRONICS',icon:'water',desc:'Find liquid speed from flow rate and the pipe’s inside diameter.',badge:'Pipe flow check',sources:[],fields:[
field('flow','Liquid flow','US gpm',20,0),
field('diameter','Inside diameter','in',1.049,.001,100)
],calculate:v=>{
  if(!(v.diameter>0))throw Error('Inside diameter must be greater than zero.');
  const area=Math.PI*Math.pow(v.diameter/12,2)/4;
  const cfs=v.flow/(7.48051948*60);
  const fps=cfs/area;
  const fpm=fps*60;
  return result(fps,'ft/s',[
    ['Internal area',area,'ft²'],
    ['Volumetric flow',cfs,'ft³/s'],
    ['Velocity',fps,'ft/s'],
    ['Velocity',fpm,'ft/min']
  ],`V = (GPM ÷ 7.4805 ÷ 60) ÷ (π(d/12)²/4) ≈ 0.4085 × GPM / d²`,
  'Uses clear internal diameter, not nominal pipe size. Velocity alone does not size a hydronic circuit; friction loss, fittings, pump head, and noise limits also matter.',
  [[fpm,'ft/min']]);
}},
{id:'gascost',name:'Fuel-gas operating cost',group:'ENERGY & MATH',icon:'cost',desc:'Estimate natural-gas use and cost from rated input and a run schedule.',badge:'Gas energy cost',sources:[],fields:[
field('input','Rated fuel input','BTU/h',80000,0),
field('hours','Hours per day','h',8,0,24),
field('days','Number of days','days',30,1,3660,1),
field('rate','Gas rate','$/therm',1.2,0,100),
field('heatContent','Heat content','BTU/ft³',1000,1,5000,'any','Local utility heating value. Used only to report approximate cubic feet.')
],calculate:v=>{
  if(!(v.heatContent>0))throw Error('Gas heat content must be greater than zero.');
  const btus=v.input*v.hours*v.days;
  const therms=btus/100000;
  const cuft=btus/v.heatContent;
  const cost=therms*v.rate;
  return result(cost,'USD',[
    ['Energy delivered as fuel',therms,'therms'],
    ['Approximate volume',cuft,'ft³'],
    ['Operating time',v.hours*v.days,'h'],
    ['Fuel cost',cost,'USD']
  ],`therms = BTU/h × hours × days ÷ 100,000; cost = therms × $/therm`,
  'Assumes constant rated input during the entered hours. Not a billed-therm forecast: excludes part-load modulation, AFUE/UEF, demand charges, fixed fees, and taxes. Confirm the utility’s therm definition and heating value.');
}},
{id:'sheave',name:'Sheave / belt RPM',group:'ENERGY & MATH',icon:'bolt',desc:'Find driven speed from driver speed and sheave diameters.',badge:'Belt drive',sources:[],fields:[
field('rpmDriver','Driver speed','rpm',1750,.001,100000),
field('driverDia','Driver pitch diameter','in',4,.001,1000),
field('drivenDia','Driven pitch diameter','in',6,.001,1000)
],calculate:v=>{
  if(!(v.drivenDia>0))throw Error('Driven sheave diameter must be greater than zero.');
  const rpm=v.rpmDriver*v.driverDia/v.drivenDia;
  const beltFpm=Math.PI*v.driverDia*v.rpmDriver/12;
  return result(rpm,'rpm driven',[
    ['Speed ratio',v.driverDia/v.drivenDia,'×'],
    ['Driven speed',rpm,'rpm'],
    ['Approximate belt speed',beltFpm,'ft/min']
  ],`Nriven = Ndriver × Ddriver ÷ Ddriven = ${v.rpmDriver} × ${v.driverDia} ÷ ${v.drivenDia}`,
  'Uses pitch diameters and neglects belt slip and stretch. Confirm manufacturer maximum sheave RPM, belt rating, shaft load, and guard clearance. Electrical input and airflow still follow the connected equipment curves.');
}},

{id:'intakesep',name:'Outdoor-air intake separation',group:'CODE & VENTILATION',icon:'air',desc:'Screen IMC §401.4 outdoor-air intake clearances to lot lines and contaminant sources.',badge:'IMC §401.4 · location',sources:['imc'],fields:[

],calculate:v=>{

    ['Open checks',open,'ea']
  ],`IMC §401.4 model screen: lot≥10; contaminant horiz≥10 or street vertical≥25; below≥3 when horiz<10; flood elevation where applicable`,
  'Model 2024 IMC §401.4 screening only. Confirm adopted edition, amendments, measurement points, and any AHJ-approved combination terminations. This does not approve intake design, bird screens, or flood compliance.',
  [[fails,'hard fails']],['IMC §401.4','AHJ measurement verify']);
}},
{id:'exhaustterm',name:'Exhaust outlet location',group:'CODE & VENTILATION',icon:'air',desc:'Screen IMC §501.3.1 outdoor exhaust termination clearances by outlet class.',badge:'IMC §501.3.1 · termination',sources:['imc'],fields:[
choice('class','Exhaust outlet class',[
['environmental','Environmental air (toilets, baths, general ventilation)'],
['product','Other product-conveying outlet'],
['explosive','Explosive / flammable vapors, fumes, or dusts']
],'environmental'),
field('property','Distance to property line','ft',10,0,1000),
field('operable','Distance to operable openings into buildings','ft',10,0,1000),
field('intake','Distance to mechanical air intakes','ft',12,0,1000),
field('wallRoof','Distance to exterior walls and roofs','ft',6,0,1000),
field('grade','Height above adjoining grade','ft',10,0,500),
field('combustWall','Distance to combustible walls / openings in discharge direction','ft',30,0,1000)
],calculate:v=>{
  const lim={
    environmental:{property:3,operable:3,intake:10,wallRoof:0,grade:0,combustWall:0},
    product:{property:10,operable:10,intake:0,wallRoof:3,grade:10,combustWall:0},
    explosive:{property:30,operable:10,intake:0,wallRoof:6,grade:10,combustWall:30}
  }[v.class];
  const checks=[
    ['Property line',v.property,lim.property],
    ['Operable openings',v.operable,lim.operable],
    ['Mechanical air intakes',v.intake,lim.intake],
    ['Exterior walls / roofs',v.wallRoof,lim.wallRoof],
    ['Above adjoining grade',v.grade,lim.grade],
    ['Combustible walls / openings downwind',v.combustWall,lim.combustWall]
  ];
  let fails=0;
  const rows=[['Outlet class',1,v.class]];
  for(const [label,val,min] of checks){

  rows.push(['Open clearance fails',fails,'ea']);
  return result(fails,fails?'clearance fails':'clearances met in screen',rows,

  [[fails,'fails']],['IMC §501.3.1','AHJ + exhaust designer']);
}},
{id:'greasevel',name:'Grease duct velocity',group:'CODE & VENTILATION',icon:'duct',desc:'Check Type I grease-duct airflow against the IMC §506.3.4 minimum 500 fpm velocity.',badge:'IMC §506.3.4 · 500 fpm',sources:['imc'],fields:[
field('flow','Grease duct airflow','cfm',2000,.001,1e7),
choice('shape','Duct cross-section',[['round','Round'],['rect','Rectangular']],'rect'),
field('diameter','Inside diameter','in',14,.001,1000),
field('width','Inside width','in',18,.001,1000),
field('height','Inside height','in',10,.001,1000),
choice('transitionOnly','Is this only a ≤3 ft hood/fan transition exception path?',[['no','No — main grease duct'],['yes','Yes — listed short transition']],'no')
],calculate:v=>{
  const area=v.shape==='round'?Math.PI*Math.pow(v.diameter/12,2)/4:v.width*v.height/144;

  ],`V = CFM ÷ area = ${fmt(v.flow)} ÷ ${fmt(area,4)} = ${fmt(vel)} ft/min; minimum = 500 ft/min`,
  `${exempt?'Short transition exception claimed — verify ≤3 ft length and grease-trapping geometry. ':''}${ok?'Velocity screen met for this cross-section.':'Velocity is below 500 fpm — enlarge airflow or reduce duct area, or use an adopted exception.'} Model 2024 IMC §506.3.4. Confirm construction, slope, cleanouts, clearances, and listing. Not a grease-duct design approval.`,

{id:'greaseslope',name:'Grease duct slope',group:'CODE & VENTILATION',icon:'duct',desc:'Screen IMC §506.3.7 horizontal grease-duct slope toward the hood or grease reservoir.',badge:'IMC §506.3.7 · slope',sources:['imc'],fields:[
field('run','Horizontal duct run length','ft',40,.001,1000),
field('drop','Vertical drop toward hood / reservoir along that run','in',10,0,1000),
choice('factoryBuilt','Factory-built grease duct installed per listing slope?',[['no','No / field-fabricated'],['yes','Yes — follow listing'],['unk','Unknown']],'no')
],calculate:v=>{
  if(v.factoryBuilt!=='yes'&&!(v.run>0))throw Error('Horizontal run length must be greater than zero.');
  if(v.factoryBuilt==='yes'){
    return result(1,'follow listing slope',[
      ['Factory-built path',1,'yes'],
      ['Embedded generic slope enforced',0,'no']
    ],'factory-built grease duct → slope per listing / manufacturer instructions (IMC §506.3.7 Exception)',
    'Model 2024 IMC §506.3.7 Exception path. Do not apply the 1/4:12 or 1:12 geometric screen to a listed factory-built assembly without checking its listing. Confirm reservoir, cleanouts, and AHJ acceptance.',
    [],['IMC §506.3.7 Exception','Listing + AHJ']);
  }
  const slope=v.drop/(12*v.run); // rise/run as vertical/horizontal
  const long=v.run>75;
  const need=long?1/12:1/48; // 1:12 or 1/4:12

  const needInPerFt=need*12;
  const haveInPerFt=v.drop/v.run;

    ['Provided slope',haveInPerFt,'in/ft'],
    ['Required slope',needInPerFt,'in/ft'],
    ['Run exceeds 75 ft',long?1:0,long?'use 1:12':'use 1/4:12'],
    ['Meets geometric screen',ok?1:0,ok?'yes':'no'],
    ['Listing path unresolved',v.factoryBuilt==='unk'?1:0,v.factoryBuilt]
  ],`slope = drop ÷ run = ${fmt(v.drop)} in ÷ ${fmt(v.run)} ft = ${fmt(haveInPerFt,4)} in/ft; required = ${fmt(needInPerFt,4)} in/ft (${long?'1:12':'1/4:12'})`,
  `${ok?'Geometric slope screen met.':'Geometric slope is short of the model minimum — increase drop or shorten the horizontal run.'} Model 2024 IMC §506.3.7. Slope must drain to the hood or an approved grease reservoir. Confirm cleanouts, welds, clearances, and AHJ amendments. Not a grease-duct design approval.`,
  [[needInPerFt,'in/ft required']],['IMC §506.3.7','Type I grease duct','AHJ + kitchen exhaust designer']);
}},

{id:'ventterm',name:'Vent terminal clearances',group:'CODE & FUEL GAS',icon:'heat',desc:'Screen key IFGC §503.8 through-the-wall vent terminal clearances for direct-vent and nondirect-vent appliances.',badge:'IFGC §503.8 · termination',sources:['ifgc'],fields:[
choice('ventType','Terminal type',[['direct','Direct-vent'],['nondirect','Nondirect-vent']],'direct'),
field('input','Appliance input rating','BTU/h',80000,0,1e7),
field('grade','Clearance above finished grade / deck','in',12,0,1000),
choice('windowRel','Relationship to nearest openable window / door',[
['na','N/A — no openable opening nearby'],
['side_below','Beside or below the opening'],
['above','Above the opening'],
['other','Other / verify']
],'side_below'),
field('windowDist','Clearance to that openable window / door','in',12,0,1000),
field('mechHoriz','Horizontal distance to mechanical air intake','ft',12,0,1000),
field('mechAbove','Height of terminal above mechanical air intake','ft',0,0,1000),
choice('publicWalk','Located above a public sidewalk / driveway?',[['no','No'],['yes','Yes'],['unk','Unknown']],'no')
],calculate:v=>{
  const gradeOk=v.grade>=12;
  let winNeed=0,winOk=true,winNote='n/a';
  if(v.windowRel!=='na'){
    if(v.ventType==='direct'){
      if(v.input>150000){winNeed=48;winNote='>150 kBTU/h → not less than nondirect Row B (use 4 ft beside/below as screen floor)';}
      else if(v.input>50000){winNeed=12;winNote='direct-vent 50–150 kBTU/h → 12 in';}
      else if(v.input>10000){winNeed=9;winNote='direct-vent 10–50 kBTU/h → 9 in';}
      else {winNeed=6;winNote='direct-vent ≤10 kBTU/h → 6 in';}
      winOk=v.windowDist+1e-9>=winNeed;
      if(v.input>150000&&v.windowRel==='above'){winNeed=12;winOk=v.windowDist>=12;winNote='>150 kBTU/h above opening → ≥1 ft screen (confirm nondirect Row B)';}
    }else{
      if(v.windowRel==='above'){winNeed=12;winOk=v.windowDist>=12;winNote='nondirect above opening → ≥1 ft';}

{id:'kwton',name:'Chiller kW per ton',group:'ENERGY & MATH',icon:'bolt',desc:'Express cooling efficiency as electrical input per ton of refrigeration.',badge:'Efficiency ratio',sources:[],fields:[

],calculate:v=>{

{id:'tower',name:'Cooling tower approach',group:'HYDRONICS',icon:'water',desc:'Find cooling-tower range and approach from water and ambient wet-bulb temperatures.',badge:'Tower temperatures',sources:[],fields:[
field('hot','Hot water temperature','°F',95,32,212),
field('cold','Cold water temperature','°F',85,32,212),
field('wetbulb','Entering air wet-bulb temperature','°F',78,-40,120)
],calculate:v=>{
  if(v.hot<=v.cold)throw Error('Hot water temperature must be greater than cold water temperature.');

  const range=v.hot-v.cold,approach=v.cold-v.wetbulb;
  return result(approach,'°F approach',[

{id:'compratio',name:'Compression ratio',group:'REFRIGERATION',icon:'snow',desc:'Calculate compressor compression ratio from absolute suction and discharge pressures.',badge:'Compressor ratio',sources:['copeland'],fields:[
field('suction','Suction pressure','psia',70,0.1,10000),
field('discharge','Discharge pressure','psia',250,0.1,10000)
],calculate:v=>{
  if(!(v.suction>0))throw Error('Suction pressure must be greater than zero (use absolute pressure).');if(v.discharge<=v.suction)throw Error('Discharge pressure must be greater than suction pressure.');
  const ratio=v.discharge/v.suction;
  return result(ratio,'compression ratio',[
    ['Suction pressure',v.suction,'psia'],
    ['Discharge pressure',v.discharge,'psia'],
    ['Compression ratio',ratio,'']
  ],`CR = Pdischarge ÷ Psuction = ${fmt(v.discharge)} ÷ ${fmt(v.suction)}`,

}},
{id:'pumphead',name:'Pump head from pressure',group:'HYDRONICS',icon:'water',desc:'Convert a differential pressure reading into feet of fluid head.',badge:'Head convert',sources:[],fields:[
field('dp','Differential pressure','psi',12,0,10000),
field('sg','Fluid specific gravity','—',1,.1,3)
],calculate:v=>{
  if(!(v.sg>0))throw Error('Specific gravity must be greater than zero.');
  const head=v.dp*2.3106/v.sg;
  return result(head,'ft head',[
    ['Differential pressure',v.dp,'psi'],
    ['Specific gravity',v.sg,''],
    ['Fluid head',head,'ft']
  ],`head ≈ 2.3106 × ΔP(psi) ÷ SG = 2.3106 × ${fmt(v.dp)} ÷ ${fmt(v.sg)}`,
  'Uses the common water-column conversion (≈2.31 ft/psi at SG 1). Confirm gauge locations and fluid density at operating temperature. Does not size the pump.');
}},
{id:'airdensity',name:'Air density altitude',group:'AIR & DUCTS',icon:'air',desc:'Estimate air density and a simple airflow density correction from site elevation.',badge:'Altitude density',sources:['ashrae'],fields:[
field('elevation','Site elevation','ft',0,-1000,15000),
field('seaLevelCfm','Sea-level or standard-density airflow','cfm',1000,0)
],calculate:v=>{
  // Standard atmosphere approximation: P/P0 ≈ (1 - 6.87535e-6 * Z)^5.2559
  const z=v.elevation;
  const pr=Math.pow(Math.max(1-6.87535e-6*z,0.1),5.2559);
  const density=.075*pr; // lb/ft³ relative to standard 0.075
  const actualCfm=v.seaLevelCfm/pr; // more cfm needed at altitude for same mass
  return result(density,'lb/ft³',[
    ['Pressure ratio P/P₀',pr,''],
    ['Estimated density',density,'lb/ft³'],
    ['Density vs sea level',pr*100,'%'],
    ['Approx CFM for same mass flow',actualCfm,'cfm']
  ],`P/P₀ ≈ (1 − 6.87535×10⁻⁶ Z)^5.2559; ρ ≈ 0.075 × P/P₀; CFM_actual ≈ CFM_std ÷ (P/P₀)`,
  'Standard-atmosphere approximation at roughly 59 °F. Does not replace manufacturer altitude tables, psychrometric density, or fan selection software. Heating capacity and motor cooling also change with altitude.',
  [[actualCfm,'cfm same mass'],[pr,'pressure ratio']]);
}},
{id:'beltlength',name:'Belt length',group:'ENERGY & MATH',icon:'bolt',desc:'Estimate open-belt length from two sheave diameters and center distance.',badge:'Belt geometry',sources:[],fields:[
field('d1','Sheave 1 pitch diameter','in',4,.001,1000),
field('d2','Sheave 2 pitch diameter','in',6,.001,1000),
field('centers','Center distance','in',20,.001,1000)
],calculate:v=>{
  if(!(v.centers>0))throw Error('Center distance must be greater than zero.');
  const sum=v.d1+v.d2,diff=Math.abs(v.d1-v.d2);
  const len=2*v.centers+1.57*sum+(diff*diff)/(4*v.centers);
  return result(len,'in belt',[
    ['Sum of diameters',sum,'in'],
    ['Difference of diameters',diff,'in'],
    ['Center distance',v.centers,'in'],
    ['Approximate belt length',len,'in']
  ],`L ≈ 2C + 1.57(D₁+D₂) + (D₁−D₂)² / (4C)`,
  'Common open-belt approximation using pitch diameters. Confirm exact belt section, tensioner allowance, and manufacturer length charts before ordering.');
}},

{id:'velpress',name:'Velocity pressure',group:'AIR & DUCTS',icon:'air',desc:'Estimate air velocity pressure from duct velocity using the conventional I-P relationship.',badge:'Air pressure',sources:['ashrae'],fields:[
field('velocity','Air velocity','fpm',800,0,20000)
],calculate:v=>{
  const vp=Math.pow(v.velocity/4005,2);
  return result(vp,'in. w.c.',[
    ['Air velocity',v.velocity,'fpm'],
    ['Velocity pressure',vp,'in. w.c.']
  ],`VP ≈ (V / 4005)² = (${fmt(v.velocity)} / 4005)²`,
  'Standard-density I-P approximation (≈0.075 lb/ft³). At other densities, adjust the constant or use measured density. This is not a duct static-pressure design.');
}},
{id:'stackeffect',name:'Stack-effect pressure',group:'AIR & DUCTS',icon:'air',desc:'Estimate buoyancy-driven stack pressure from height and indoor/outdoor absolute temperatures.',badge:'Building pressure',sources:['ashrae'],fields:[
field('height','Height between openings','ft',30,0.1,2000),
field('indoor','Indoor air temperature','°F',70,-40,140),
field('outdoor','Outdoor air temperature','°F',20,-60,140)
],calculate:v=>{
  const tin=v.indoor+460,tout=v.outdoor+460;
  if(tin<=0||tout<=0)throw Error('Absolute temperatures must be greater than zero Rankine.');
  // Density-based I-P estimate: ΔP(in. w.c.) ≈ 7.65 × H × (1/To − 1/Ti), T in °R
  const dp=7.65*v.height*(1/tout-1/tin);
  return result(dp,'in. w.c.',[
    ['Height',v.height,'ft'],
    ['Indoor absolute temperature',tin,'°R'],
    ['Outdoor absolute temperature',tout,'°R'],
    ['Stack pressure (indoor warmer → + at top)',dp,'in. w.c.']
  ],`ΔP ≈ 7.65 × H × (1/To − 1/Ti) with T in °R`,
  'Common I-P stack-effect approximation at roughly sea-level density. Positive when indoor air is warmer than outdoor (upward buoyancy at the top). Does not include wind, mechanical imbalance, or leakage-network effects.');
}},
{id:'pipevolume',name:'Pipe volume & fill',group:'HYDRONICS',icon:'water',desc:'Find internal pipe volume and an approximate fill time from flow rate.',badge:'Pipe volume',sources:[],fields:[
field('id','Inside diameter','in',1.049,.001,100),
field('length','Pipe length','ft',100,.001,1e6),
field('flow','Fill / flush flow rate','gpm',10,0,1e5)
],calculate:v=>{
  const area=Math.PI*Math.pow(v.id/24,2); // ft² using radius in ft
  const volFt3=area*v.length;
  const gal=volFt3*7.48051948;
  const minutes=v.flow>0?gal/v.flow:null;
  return result(gal,'gal',[
    ['Internal area',area,'ft²'],
    ['Internal volume',volFt3,'ft³'],
    ['Internal volume',gal,'gal'],
    ...(minutes==null?[]:[['Approx fill time',minutes,'min']])
  ],`V = π(d/24)² × L; gallons = V × 7.4805; t ≈ gallons ÷ gpm`,
  'Uses clear inside diameter, not nominal size. Ignores fittings volume and trapped air. Confirm fluid density if converting mass.');
}},
{id:'lmtd',name:'LMTD',group:'HYDRONICS',icon:'water',desc:'Calculate log-mean temperature difference for a counterflow or parallel-flow heat exchanger.',badge:'Heat exchanger',sources:[],fields:[
choice('flow','Flow arrangement',[['counter','Counterflow'],['parallel','Parallel flow']],'counter'),
field('thIn','Hot-fluid inlet temperature','°F',180,0,1000),
field('thOut','Hot-fluid outlet temperature','°F',120,0,1000),
field('tcIn','Cold-fluid inlet temperature','°F',60,-40,500),
field('tcOut','Cold-fluid outlet temperature','°F',100,-40,500)
],calculate:v=>{
  let dt1,dt2;
  if(v.flow==='counter'){dt1=v.thIn-v.tcOut;dt2=v.thOut-v.tcIn;}
  else{dt1=v.thIn-v.tcIn;dt2=v.thOut-v.tcOut;}
  if(dt1<=0||dt2<=0)throw Error('Both end temperature differences must be positive for the selected arrangement.');
  const lmtd=(dt1===dt2)?dt1:(dt1-dt2)/Math.log(dt1/dt2);
  return result(lmtd,'°F LMTD',[
    ['ΔT₁',dt1,'°F'],
    ['ΔT₂',dt2,'°F'],
    ['LMTD',lmtd,'°F']
  ],`LMTD = (ΔT₁ − ΔT₂) / ln(ΔT₁/ΔT₂)`,
  'Ideal single-pass LMTD. Crossflow/multipass exchangers need a correction factor F. Does not size UA or select a heat exchanger.');
}},
{id:'evaptd',name:'Evaporator TD',group:'REFRIGERATION',icon:'snow',desc:'Find evaporator temperature difference from box or return-air temperature and saturated suction temperature.',badge:'Coil TD',sources:[],fields:[
field('box','Box / entering-air temperature','°F',35,-50,100),
field('sst','Saturated suction temperature','°F',25,-60,80)
],calculate:v=>{

  'Definitional coil TD only. Target TD depends on application and manufacturer data. Does not set superheat or select a TXV.');
}},
{id:'condtd',name:'Condenser TD',group:'REFRIGERATION',icon:'snow',desc:'Find condenser temperature difference from saturated condensing temperature and entering air or water temperature.',badge:'Condenser TD',sources:[],fields:[

}},
{id:'oilpd',name:'Oil pressure net',group:'REFRIGERATION',icon:'snow',desc:'Calculate net oil pressure from oil-pump discharge and crankcase / suction pressure.',badge:'Oil safety',sources:[],fields:[

}},
{id:'roofaccess',name:'Roof appliance access',group:'CODE & VENTILATION',icon:'duct',desc:'Screen IMC §306.5 roof-appliance access and permanent-ladder documentation without inventing unlisted dimensions.',badge:'IMC §306.5 · roof access',sources:['imc'],fields:[

{id:'dryerterm',name:'Dryer exhaust termination',group:'CODE & VENTILATION',icon:'air',desc:'Screen key IMC §504.9 dryer-exhaust termination clearances to openings and intake openings.',badge:'IMC §504.9 · termination',sources:['imc'],fields:[

{id:'aspect',name:'Duct aspect ratio',group:'AIR & DUCTS',icon:'duct',desc:'Find the aspect ratio of a rectangular duct from inside width and height.',badge:'Duct geometry',sources:[],fields:[
field('width','Inside width','in',24,.001,1000),
field('height','Inside height','in',8,.001,1000)
],calculate:v=>{
  if(!(v.width>0&&v.height>0))throw Error('Duct sides must be greater than zero.');
  const long=Math.max(v.width,v.height),short=Math.min(v.width,v.height);
  const ar=long/short;
  return result(ar,'aspect ratio',[
    ['Long side',long,'in'],
    ['Short side',short,'in'],
    ['Aspect ratio (long ÷ short)',ar,'']
  ],`AR = long ÷ short = ${fmt(long)} ÷ ${fmt(short)}`,
  'Geometric aspect ratio only. Equal-friction design often prefers AR ≤ 4:1 as a practice guideline — that preference is not applied as a code limit here.');
}},
{id:'fanbhp',name:'Fan brake horsepower',group:'AIR & DUCTS',icon:'air',desc:'Estimate fan shaft brake horsepower from airflow, static pressure, and fan efficiency.',badge:'Fan power',sources:[],fields:[
field('cfm','Airflow','cfm',2000,0),
field('sp','Fan static pressure','in. w.c.',1.5,0,50),
field('eff','Fan static efficiency','%',65,1,100)
],calculate:v=>{
  const eta=v.eff/100;
  if(eta<=0)throw Error('Fan efficiency must be greater than zero.');
  const bhp=v.cfm*v.sp/(6356*eta);
  return result(bhp,'bhp',[
    ['Airflow',v.cfm,'cfm'],
    ['Static pressure',v.sp,'in. w.c.'],
    ['Fan static efficiency',v.eff,'%'],
    ['Brake horsepower',bhp,'bhp'],
    ['Approx shaft watts',bhp*745.7,'W']
  ],`BHP = CFM × SP / (6356 × η) = ${fmt(v.cfm)} × ${fmt(v.sp)} / (6356 × ${fmt(eta)})`,
  'Uses the common I-P fan static-efficiency form. Enter fan (not motor) efficiency. Does not size the motor, account for drive losses, or replace the fan curve.');
}},
{id:'coilsens',name:'Coil sensible capacity',group:'HEATING & COOLING',icon:'snow',desc:'Estimate sensible coil capacity from airflow and air-side temperature change.',badge:'Sensible capacity',sources:['ashrae'],fields:[
field('cfm','Airflow','cfm',1200,0),
field('dt','Air temperature change across coil','°F',20,.001,100),
field('factor','Air sensible factor','BTU/(h·cfm·°F)',1.08,.5,1.5)
],calculate:v=>{
  const q=v.factor*v.cfm*v.dt;
  return result(q,'BTU/h',[
    ['Airflow',v.cfm,'cfm'],
    ['Temperature change',v.dt,'°F'],
    ['Sensible factor',v.factor,'BTU/(h·cfm·°F)'],
    ['Sensible capacity',q,'BTU/h'],
    ['Sensible tons',q/12000,'tons']
  ],`Qs = factor × CFM × ΔT = ${fmt(v.factor)} × ${fmt(v.cfm)} × ${fmt(v.dt)}`,
  'Sensible heat only. The default 1.08 factor is for standard-density air; adjust for altitude and mixed-air conditions. Does not include latent capacity.');
}},
{id:'heatrej',name:'Condenser heat rejection',group:'REFRIGERATION',icon:'snow',desc:'Estimate condenser / heat-rejection load from cooling capacity plus compressor electrical input.',badge:'Heat rejection',sources:[],fields:[
field('cooling','Net cooling capacity','BTU/h',36000,0),
field('power','Compressor / unit electrical input','kW',3.5,0)
],calculate:v=>{
  const heatIn=v.power*3412.141633;
  const reject=v.cooling+heatIn;
  return result(reject,'BTU/h',[
    ['Cooling capacity',v.cooling,'BTU/h'],
    ['Electrical input',v.power,'kW'],
    ['Electrical heat equivalent',heatIn,'BTU/h'],
    ['Heat rejection',reject,'BTU/h'],
    ['Heat rejection',reject/12000,'tons']
  ],`Qreject ≈ Qcool + 3412.14 × kW = ${fmt(v.cooling)} + 3412.14 × ${fmt(v.power)}`,
  'Steady-state energy balance for the refrigeration loop. Enter electrical input at the same operating condition as capacity. Does not size a condenser or cooling tower by itself.');
}},
{id:'wbdep',name:'Wet-bulb depression',group:'AIR & DUCTS',icon:'air',desc:'Find wet-bulb depression from dry-bulb and wet-bulb temperatures.',badge:'Psychrometric delta',sources:[],fields:[
field('db','Dry-bulb temperature','°F',80,-40,140),
field('wb','Wet-bulb temperature','°F',67,-40,140)
],calculate:v=>{
  if(v.wb>v.db+1e-9)throw Error('Wet-bulb temperature cannot exceed dry-bulb temperature.');
  const dep=v.db-v.wb;
  return result(dep,'°F',[
    ['Dry-bulb',v.db,'°F'],
    ['Wet-bulb',v.wb,'°F'],
    ['Wet-bulb depression',dep,'°F']
  ],`Depression = Tdb − Twb = ${fmt(v.db)} − ${fmt(v.wb)}`,
  'Definitional psychrometric difference. Useful for evaporative cooling and cooling-tower discussions. Does not compute relative humidity by itself.');
}},
{id:'reynolds',name:'Reynolds number (pipe)',group:'HYDRONICS',icon:'water',desc:'Estimate pipe-flow Reynolds number from velocity, inside diameter, and kinematic viscosity.',badge:'Flow regime',sources:[],fields:[
field('velocity','Mean velocity','ft/s',4,0,100),
field('id','Inside diameter','in',1.049,.001,100),
field('nu','Kinematic viscosity','ft²/s',0.0000121,1e-8,1e-3)
],calculate:v=>{
  if(!(v.nu>0))throw Error('Kinematic viscosity must be greater than zero.');if(!(v.id>0))throw Error('Inside diameter must be greater than zero.');
  const dFt=v.id/12;
  const re=v.velocity*dFt/v.nu;
  const regime=re<2300?'laminar':re>4000?'turbulent':'transitional';
  return result(re,'Reynolds',[
    ['Velocity',v.velocity,'ft/s'],
    ['Inside diameter',dFt,'ft'],
    ['Kinematic viscosity',v.nu,'ft²/s'],
    ['Reynolds number',re,''],
    ['Approximate regime',regime==='turbulent'?1:regime==='laminar'?0:-1,regime]
  ],`Re = V × D / ν = ${fmt(v.velocity)} × ${fmt(dFt)} / ${v.nu}`,
  'Default viscosity approximates 60 °F water (~1.21×10⁻⁵ ft²/s). Adjust ν for temperature and glycol mixes. Regime bands are approximate engineering guides, not code limits.');
}},
{id:'valvecv',name:'Valve Cv flow',group:'HYDRONICS',icon:'water',desc:'Estimate liquid flow from valve flow coefficient, pressure drop, and specific gravity.',badge:'Valve sizing helper',sources:[],fields:[
field('cv','Valve flow coefficient Cv','—',10,.001,1e6),
field('dp','Pressure drop across valve','psi',5,0,10000),
field('sg','Fluid specific gravity','—',1,.1,3)
],calculate:v=>{
  if(v.dp<0)throw Error('Pressure drop cannot be negative.');if(!(v.sg>0))throw Error('Specific gravity must be greater than zero.');
  const gpm=v.cv*Math.sqrt(v.dp/v.sg);
  return result(gpm,'gpm',[
    ['Cv',v.cv,''],
    ['Pressure drop',v.dp,'psi'],
    ['Specific gravity',v.sg,''],
    ['Estimated flow',gpm,'gpm']
  ],`Q = Cv × √(ΔP / SG) = ${fmt(v.cv)} × √(${fmt(v.dp)} / ${fmt(v.sg)})`,
  'Liquid Cv definition at the stated conditions. Does not include flashing, cavitation, or compressible-flow corrections. Confirm manufacturer Cv charts.');
}},
{id:'expansank',name:'Expansion tank volume',group:'HYDRONICS',icon:'water',desc:'Estimate closed-system expansion-tank acceptance volume from system volume and fluid expansion.',badge:'Expansion tank',sources:[],fields:[
field('system','System fluid volume','gal',200,.001),
field('expandPct','Net fluid expansion (fill to hot)','%',3,0,20),
field('acceptance','Tank acceptance factor','—',0.5,.05,0.95)
],calculate:v=>{
  const expand=v.system*(v.expandPct/100);
  if(v.acceptance<=0||v.acceptance>=1)throw Error('Tank acceptance factor must be between 0 and 1.');
  const tank=expand/v.acceptance;
  return result(tank,'gal tank',[
    ['System volume',v.system,'gal'],
    ['Expansion volume',expand,'gal'],
    ['Acceptance factor',v.acceptance,''],
    ['Approximate tank volume',tank,'gal']
  ],`Vtank ≈ Vsystem × (% expansion) / acceptance = ${fmt(v.system)} × ${fmt(v.expandPct)}% / ${fmt(v.acceptance)}`,
  'Preliminary closed-loop estimate. Acceptance factor depends on fill pressure, relief setting, and precharge — enter the manufacturer’s value when available. Does not replace ASME/manufacturer sizing methods.');
}},
{id:'latcond',name:'Condensate from latent',group:'HEATING & COOLING',icon:'water',desc:'Estimate condensate generation from latent cooling load and water latent heat.',badge:'Condensate rate',sources:[],fields:[
field('latent','Latent cooling load','BTU/h',6000,0),
field('hfg','Latent heat of vaporization','BTU/lb',1061,900,1200)

    ['Condensate mass rate',lbh,'lb/h'],
    ['Condensate volume rate',gph,'gal/h'],
    ['Condensate volume rate',gph*24,'gal/day']
  ],`ṁ = Qlatent / hfg; gal/h ≈ ṁ / 8.33`,
  'Assumes condensate is liquid water near the coil temperature. Does not size the drain, trap, or pump. Confirm hfg for the actual condensate temperature.');
}},

{id:'oafrac',name:'Outdoor-air fraction',group:'AIR & DUCTS',icon:'air',desc:'Find the outdoor-air fraction of mixed airflow from outdoor and supply (or mixed) airflow.',badge:'OA fraction',sources:[],fields:[
field('oa','Outdoor-airflow','cfm',300,0),
field('supply','Supply / total mixed airflow','cfm',1200,.001)
],calculate:v=>{
  if(v.supply<=0)throw Error('Supply airflow must be greater than zero.');
  if(v.oa<0)throw Error('Outdoor airflow cannot be negative.');
  if(v.oa>v.supply+1e-9)throw Error('Outdoor airflow cannot exceed supply airflow.');
  const frac=v.oa/v.supply;
  return result(frac,'OA fraction',[
    ['Outdoor airflow',v.oa,'cfm'],
    ['Supply airflow',v.supply,'cfm'],
    ['Outdoor-air fraction',frac,''],
    ['Outdoor-air percentage',frac*100,'%'],
    ['Return / recirculated share',1-frac,'']
  ],`xOA = OAcfm / Supplycfm = ${fmt(v.oa)} / ${fmt(v.supply)}`,
  'Volumetric outdoor-air fraction at the stated airstreams. Equal-density assumption. Does not set IMC ventilation compliance by itself.');
}},
{id:'bypassfac',name:'Coil bypass factor',group:'HEATING & COOLING',icon:'snow',desc:'Estimate coil bypass factor from entering, leaving, and apparatus-dew-point temperatures.',badge:'Bypass factor',sources:[],fields:[
field('eat','Entering air temperature','°F',80,-40,140),
field('lat','Leaving air temperature','°F',55,-40,140),
field('adp','Apparatus dew-point temperature','°F',50,-40,140)
],calculate:v=>{
  const denom=v.eat-v.adp;
  if(Math.abs(denom)<1e-9)throw Error('Entering air and apparatus dew point cannot be equal.');
  const bf=(v.lat-v.adp)/denom;
  return result(bf,'bypass factor',[
    ['Entering air',v.eat,'°F'],
    ['Leaving air',v.lat,'°F'],
    ['Apparatus dew point',v.adp,'°F'],
    ['Bypass factor',bf,''],
    ['Contact factor (1 − BF)',1-bf,'']
  ],`BF = (Tlat − Tadp) / (Teat − Tadp) = (${fmt(v.lat)} − ${fmt(v.adp)}) / (${fmt(v.eat)} − ${fmt(v.adp)})`,
  'Classic coil contact/bypass definition using the same temperature basis (usually dry-bulb or enthalpy-consistent ADP). Does not replace manufacturer coil data.');
}},
{id:'airhp',name:'Air horsepower',group:'AIR & DUCTS',icon:'air',desc:'Estimate ideal air horsepower from airflow and fan static pressure (100% efficient).',badge:'Air power',sources:[],fields:[

}},
{id:'hxeff',name:'Heat-exchanger effectiveness',group:'ENERGY & MATH',icon:'heat',desc:'Find heat-exchanger effectiveness from actual heat transfer and the thermodynamic maximum.',badge:'Effectiveness',sources:[],fields:[

{id:'darcyhead',name:'Darcy friction head',group:'HYDRONICS',icon:'water',desc:'Estimate pipe friction head loss from the Darcy–Weisbach equation with a user-supplied friction factor.',badge:'Friction head',sources:[],fields:[
field('f','Darcy friction factor f','—',0.02,.0001,1),
field('length','Pipe length','ft',100,0),
field('id','Inside diameter','in',1.049,.001,100),
field('velocity','Mean velocity','ft/s',4,0,100)
],calculate:v=>{
  const d=v.id/12;
  if(d<=0)throw Error('Inside diameter must be greater than zero.');
  const head=v.f*(v.length/d)*(v.velocity*v.velocity)/(2*32.174);
  return result(head,'ft head',[
    ['Friction factor f',v.f,''],
    ['Length',v.length,'ft'],
    ['Inside diameter',d,'ft'],
    ['Velocity',v.velocity,'ft/s'],
    ['Friction head loss',head,'ft']
  ],`hf = f × (L/D) × V² / (2g) = ${fmt(v.f)} × (${fmt(v.length)} / ${fmt(d)}) × ${fmt(v.velocity)}² / (2 × 32.174)`,
  'Uses g = 32.174 ft/s². Enter a Moody/Colebrook friction factor for the Reynolds number and roughness — this tool does not invent f. Minor losses are excluded.');
}},

{id:'refrigmass',name:'Refrigerant mass flow',group:'REFRIGERATION',icon:'snow',desc:'Estimate refrigerant mass flow from capacity and evaporator enthalpy change.',badge:'Mass flow',sources:[],fields:[

,{id:'carnotcop',name:'Carnot COP',group:'REFRIGERATION',icon:'snow',desc:'Compute the ideal Carnot cooling COP from cold and hot absolute temperatures.',badge:'Carnot COP',sources:[],fields:[
field('tcold','Cold-side temperature','°F',40,-40,100),
field('thot','Hot-side temperature','°F',105,0,200)
],calculate:v=>{
  const Tc=v.tcold+459.67, Th=v.thot+459.67;
  if(Th<=Tc)throw Error('Hot-side temperature must exceed cold-side temperature.');
  const cop=Tc/(Th-Tc);
  return result(cop,'Carnot COP',[
    ['Cold absolute temperature',Tc,'°R'],
    ['Hot absolute temperature',Th,'°R'],
    ['Carnot COP (cooling)',cop,''],
    ['Carnot heating COP',Th/(Th-Tc),'']
  ],`COPc = Tc / (Th − Tc) with T in °R = ${fmt(Tc)} / (${fmt(Th)} − ${fmt(Tc)})`,
  'Ideal reversible limit only. Real vapor-compression COP is lower. Use saturation temperatures that match the cycle you are screening.');
}}
,{id:'psigpsia',name:'Gauge to absolute',group:'REFRIGERATION',icon:'bolt',desc:'Convert gauge pressure to absolute pressure with a user-entered atmospheric pressure.',badge:'psig → psia',sources:[],fields:[

,{id:'flashgas',name:'Flash-gas quality',group:'REFRIGERATION',icon:'snow',desc:'Estimate flash-gas mass quality after an isenthalpic expansion from liquid and vapor enthalpies.',badge:'Flash gas',sources:[],fields:[
field('h1','Enthalpy entering expansion','BTU/lb',40,-50,150),
field('hf','Saturated liquid enthalpy at leaving pressure','BTU/lb',25,-50,150),
field('hg','Saturated vapor enthalpy at leaving pressure','BTU/lb',80,-50,200)
],calculate:v=>{
  const denom=v.hg-v.hf;

  ],`x = (h1 − hf) / (hg − hf) = (${fmt(v.h1)} − ${fmt(v.hf)}) / (${fmt(v.hg)} − ${fmt(v.hf)})`,
  'Isenthalpic-expansion quality at the evaporator pressure. Enter enthalpies from a P-h chart or property software — this tool does not look up refrigerant properties. x outside 0–1 means check inputs.');
}}

,{id:'linevel',name:'Refrigerant line velocity',group:'REFRIGERATION',icon:'snow',desc:'Estimate mean refrigerant velocity from mass flow, density, and tubing inside diameter.',badge:'Line velocity',sources:[],fields:[
field('lbh','Refrigerant mass flow','lb/h',500,0),
field('density','Density at line condition','lb/ft³',0.5,.0001,100),
field('id','Tube inside diameter','in',0.545,.01,6)
],calculate:v=>{
  if(v.density<=0)throw Error('Density must be greater than zero.');
  const area=Math.PI*Math.pow(v.id/24,2);
  if(area<=0)throw Error('Inside diameter must be greater than zero.');
  const lbs=v.lbh/3600;
  const fps=lbs/(v.density*area);
  return result(fps,'ft/s',[
    ['Mass flow',v.lbh,'lb/h'],
    ['Density',v.density,'lb/ft³'],
    ['Inside area',area,'ft²'],
    ['Mean velocity',fps,'ft/s'],
    ['Mean velocity',fps*60,'ft/min']
  ],`V = ṁ / (ρA) with ṁ in lb/s and A = π(d/24)² = ${fmt(lbs,4)} / (${fmt(v.density)} × ${fmt(area,6)})`,
  'Mean velocity only. Enter density at the actual line pressure/temperature. Does not size lines for oil return, pressure drop, or noise — compare with manufacturer piping guides.');
}}
,{id:'balancept',name:'Heat-pump balance point',group:'HEATING & COOLING',icon:'heat',desc:'Estimate the outdoor balance-point temperature where linear heat-pump capacity equals building heat loss.',badge:'Balance point',sources:[],fields:[
field('designLoad','Design heating load','BTU/h',40000,0),
field('designOAT','Design outdoor air temperature','°F',10,-40,60),
field('indoor','Indoor design temperature','°F',70,50,80),
field('capAt17','Heat-pump capacity at 17°F','BTU/h',28000,0),
field('capAt47','Heat-pump capacity at 47°F','BTU/h',36000,0)
],calculate:v=>{
  const dTload=v.indoor-v.designOAT;
  if(dTload<=0)throw Error('Indoor temperature must exceed design outdoor temperature.');
  const UA=v.designLoad/dTload;
  const dTcap=47-17;
  if(Math.abs(dTcap)<1e-9)throw Error('Capacity rating temperatures cannot be equal.');
  const slope=(v.capAt47-v.capAt17)/dTcap;
  const intercept=v.capAt17-slope*17;
  // UA*(Tin - Toat) = slope*Toat + intercept
  // UA*Tin - intercept = Toat*(UA + slope)
  const denom=UA+slope;
  if(Math.abs(denom)<1e-9)throw Error('Balance point is undefined for these inputs (UA + capacity slope ≈ 0).');
  const tBal=(UA*v.indoor-intercept)/denom;
  const loadAtBal=UA*(v.indoor-tBal);
  return result(tBal,'°F balance',[
    ['Implied building UA',UA,'BTU/h·°F'],
    ['Capacity slope',slope,'BTU/h·°F'],
    ['Balance-point outdoor temperature',tBal,'°F'],
    ['Load / capacity at balance',loadAtBal,'BTU/h']
  ],`UA = Qdes/(Tin − Toat,des); set UA(Tin − T) = Cap17 + (Cap47−Cap17)/(47−17)·(T−17) and solve for T`,
  'Linear capacity and UA model between the two rating points. Real heat-pump curves and building loads are nonlinear; use manufacturer expanded data and Manual J loads for design.');
}}

,{id:'eerfromcap',name:'EER from capacity',group:'ENERGY & MATH',icon:'bolt',desc:'Compute Energy Efficiency Ratio from total cooling capacity and electrical input power.',badge:'EER',sources:[],fields:[
field('capacity','Total cooling capacity','BTU/h',36000,0),
field('watts','Electrical input power','W',3000,.001)
],calculate:v=>{
  if(v.watts<=0)throw Error('Electrical input must be greater than zero.');
  const eer=v.capacity/v.watts;
  const cop=eer/3.412;
  return result(eer,'EER',[
    ['Capacity',v.capacity,'BTU/h'],
    ['Input power',v.watts,'W'],
    ['EER',eer,'BTU/Wh'],
    ['COP',cop,'']
  ],`EER = Capacity / Watts = ${fmt(v.capacity)} / ${fmt(v.watts)}`,
  'Same-condition EER only. Not SEER2, IEER, or IPLV. Enter total cooling capacity and coincident electrical input.');
}}
,{id:'cophp',name:'Heating COP',group:'ENERGY & MATH',icon:'heat',desc:'Find heating coefficient of performance from heating capacity and electrical input.',badge:'Heating COP',sources:[],fields:[
field('capacity','Heating capacity','BTU/h',36000,0),
field('watts','Electrical input power','W',3000,.001)
],calculate:v=>{
  if(v.watts<=0)throw Error('Electrical input must be greater than zero.');
  const kwOut=v.capacity/3412.141633;
  const kwIn=v.watts/1000;
  const cop=kwOut/kwIn;
  return result(cop,'COP',[
    ['Heating capacity',v.capacity,'BTU/h'],
    ['Input power',v.watts,'W'],
    ['Thermal output',kwOut,'kW'],
    ['Electrical input',kwIn,'kW'],
    ['Heating COP',cop,'']
  ],`COP = (Capacity / 3412.141633) / (Watts / 1000)`,
  'Heating COP at one operating condition. Not HSPF2. Enter capacity and power at the same outdoor/indoor condition.');
}}

,{id:'ductarea',name:'Duct area from velocity',group:'AIR & DUCTS',icon:'duct',desc:'Find required free duct area from airflow and design velocity.',badge:'Duct area',sources:[],fields:[

,{id:'flashsteam',name:'Flash steam fraction',group:'HYDRONICS',icon:'heat',desc:'Estimate flash-steam mass fraction from condensate enthalpy and flash-tank saturated liquid/vapor enthalpies.',badge:'Flash steam',sources:[],fields:[
field('h1','Condensate enthalpy before flash','BTU/lb',298,0,1200),
field('hf','Saturated liquid enthalpy after flash','BTU/lb',180,0,1200),
field('hg','Saturated vapor enthalpy after flash','BTU/lb',1150,100,1500)
],calculate:v=>{
  const denom=v.hg-v.hf;
  if(Math.abs(denom)<1e-9)throw Error('hg and hf cannot be equal.');
  const x=(v.h1-v.hf)/denom;
  return result(x,'flash fraction',[
    ['Condensate enthalpy h1',v.h1,'BTU/lb'],
    ['Flash liquid hf',v.hf,'BTU/lb'],
    ['Flash vapor hg',v.hg,'BTU/lb'],
    ['Flash-steam quality',x,''],
    ['Flash-steam percent',x*100,'%']
  ],`x = (h1 − hf) / (hg − hf)`,
  'Enter steam-table enthalpies at the condensate and flash pressures. Does not size flash tanks. x outside 0–1 means check inputs.');
}}
,{id:'presscfm',name:'Pressurization airflow',group:'AIR & DUCTS',icon:'air',desc:'Find net pressurization airflow as supply minus return and exhaust.',badge:'Pressurization',sources:[],fields:[
field('supply','Supply airflow','cfm',2000,0),

],calculate:v=>{

    ['Return',v.return,'cfm'],
    ['Exhaust / relief',v.exhaust,'cfm'],
    ['Net pressurization airflow',net,'cfm']
  ],`Qnet = Qsa − Qra − Qex = ${fmt(v.supply)} − ${fmt(v.return)} − ${fmt(v.exhaust)}`,
  'Volumetric balance only. Positive means net outward (typically positive pressure). Does not set a room pressure target or account for envelope leakage curves.');
}}
,{id:'sgflow',name:'SG-corrected flow',group:'HYDRONICS',icon:'water',desc:'Correct a water-calibrated flow reading for fluid specific gravity (volume flow unchanged; mass/pressure effects noted).',badge:'SG correction',sources:[],fields:[
field('gpm','Indicated volume flow','gpm',100,0),

    ['Indicated volume flow',v.gpm,'gpm'],
    ['Specific gravity',v.sg,''],
    ['Relative mass-flow index',massRel,'gpm·SG'],
    ['Head/pressure scale vs water',headFactor,'×']
  ],`Mass-flow index ≈ GPM × SG; volume flow remains ${fmt(v.gpm)} gpm`,
  'Volume flow (gpm) is independent of SG; mass flow and pump head scale with SG. For differential-pressure meters calibrated on water, follow the meter manufacturer’s SG correction — this tool does not invent meter equations.');
}}
,{id:'infilcfm',name:'Infiltration from ACH',group:'AIR & DUCTS',icon:'air',desc:'Convert infiltration or ventilation air changes per hour into airflow.',badge:'Infiltration CFM',sources:[],fields:[

}}
,{id:'manifoldkpa',name:'Manifold pressure convert',group:'CODE & FUEL GAS',icon:'heat',desc:'Convert gas manifold / draft pressures among inches water column, psi, and pascals.',badge:'Pressure convert',sources:[],fields:[

  ],`1 in. w.c. ≈ 249.089 Pa ≈ 1/27.707 psi`,
  'Unit conversion for manifold, draft, and differential pressures. Confirm instrument units before adjusting gas valves.');
}}
,{id:'cfmfromq',name:'CFM from sensible load',group:'HEATING & COOLING',icon:'air',desc:'Solve airflow from a sensible load using the public 1.08 × CFM × ΔT field formula.',badge:'Airflow solve',sources:[],fields:[
field('load','Sensible load','BTU/h',25920,0),

field('factor','Air sensible factor','BTU/h·cfm·°F',1.08,.5,1.5)
],calculate:v=>{
  if(v.dt<=0)throw Error('Temperature difference must be greater than zero.');

  return result(cfm,'cfm',[
    ['Sensible load',v.load,'BTU/h'],
    ['ΔT',v.dt,'°F'],
    ['Air factor',v.factor,'BTU/h·cfm·°F'],
    ['Required airflow',cfm,'cfm']
  ],`CFM = Q ÷ (factor × ΔT) = ${fmt(v.load)} ÷ (${fmt(v.factor)} × ${fmt(v.dt)})`,
  'Public field rearrange of Q ≈ 1.08 × CFM × ΔT (standard-density air). Adjust the factor for altitude or nonstandard density. Sensible heat only.');
}}
,{id:'dtairfromq',name:'Air ΔT from load',group:'HEATING & COOLING',icon:'heat',desc:'Solve air temperature change from sensible load and airflow using the 1.08 field constant.',badge:'ΔT solve',sources:[],fields:[

],calculate:v=>{
  if(v.cfm<=0)throw Error('Airflow must be greater than zero.');

  const dt=v.load/(v.factor*v.cfm);
  return result(dt,'°F',[
    ['Sensible load',v.load,'BTU/h'],
    ['Airflow',v.cfm,'cfm'],
    ['Air factor',v.factor,'BTU/h·cfm·°F'],
    ['Air ΔT',dt,'°F']
  ],`ΔT = Q ÷ (factor × CFM) = ${fmt(v.load)} ÷ (${fmt(v.factor)} × ${fmt(v.cfm)})`,
  'Public field rearrange of Q ≈ 1.08 × CFM × ΔT. Compare furnace rise with the nameplate range. Latent heat is excluded.');
}}
,{id:'latent069',name:'Latent from grains',group:'HEATING & COOLING',icon:'water',desc:'Estimate latent coil capacity from airflow and humidity-ratio change in grains (0.69 × CFM × ΔW).',badge:'Latent field',sources:[],fields:[
field('cfm','Airflow','cfm',1200,0),

    ['Moisture rate',lbhr,'lb/h'],

  ],`Q ≈ factor × CFM × Δgrains = ${fmt(v.factor)} × ${fmt(v.cfm)} × ${fmt(v.dgrains)}`,
  'Published technician field formula (often 0.69 at standard density). Uses grains of moisture per pound of dry air. Not a substitute for a psychrometric chart with measured specific volume.');
}}
,{id:'total45',name:'Total from enthalpy',group:'HEATING & COOLING',icon:'snow',desc:'Estimate total air-side capacity from airflow and enthalpy change using the 4.5 × CFM × Δh field formula.',badge:'Total field',sources:[],fields:[
field('cfm','Airflow','cfm',1400,0),

  ],`Q ≈ factor × CFM × Δh = ${fmt(v.factor)} × ${fmt(v.cfm)} × ${fmt(v.dh)}`,

}}
,{id:'gpmfromq',name:'GPM from load',group:'HYDRONICS',icon:'water',desc:'Solve water flow from load and ΔT using the public 500 × GPM × ΔT hydronic formula.',badge:'Flow solve',sources:[],fields:[

],calculate:v=>{

  'Public rearrange of Q ≈ 500 × GPM × ΔT for liquid water. Lower the factor for glycol mixtures. Pump head is not included.');
}}
,{id:'airfromvp',name:'Velocity from VP',group:'AIR & DUCTS',icon:'air',desc:'Convert pitot velocity pressure to air speed with the public V = 4005 √VP relationship.',badge:'Pitot velocity',sources:[],fields:[

],calculate:v=>{
