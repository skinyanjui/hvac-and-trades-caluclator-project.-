</style></head><body><div id="app"></div><noscript>Enable JavaScript to use the HVAC calculators.</noscript><script>const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const BANDS=[[150,5000],[250,6000],[300,7000],[350,8000],[400,9000],[450,10000],[550,12000],[700,14000],[1000,18000],[1200,21000],[1400,23000],[1500,24000],[2000,30000],[2500,34000]];
const sourceLinks={energy:['ENERGY STAR · Room AC sizing','https://www.energystar.gov/products/room_air_conditioners'],calc:['Calculator.net · BTU reference','https://www.calculator.net/btu-calculator.html'],conversion:['Calculator.net · Conversion reference','https://www.calculator.net/conversion-calculator.html'],manual:['ACCA · Manual J','https://www.acca.org/standards/technical-manuals/manual-j'],ashrae:['ASHRAE · Psychrometrics','https://handbook.ashrae.org/Handbooks/F21/SI/F21_Ch01/F21_Ch01_si.aspx'],nist:['NIST · SI conversion reference','https://www.nist.gov/pml/special-publication-811'],imc:['ICC · 2024 IMC','https://codes.iccsafe.org/content/IMC2024V1.0'],ipc:['ICC · 2024 IPC','https://codes.iccsafe.org/content/IPC2024P1'],ifc:['ICC · 2024 IFC','https://codes.iccsafe.org/content/IFC2024V1.0'],ifgc:['ICC · 2024 IFGC','https://codes.iccsafe.org/content/IFGC2024V1.0'],iecc:['ICC · 2024 IECC','https://codes.iccsafe.org/content/IECC2024V1.0'],ashrae15:['ASHRAE · Standard 15','https://www.ashrae.org/technical-resources/bookstore/standards-15-34']};
const field=(key,label,unit,value,min=0,max=1e9,step='any',hint='')=>({key,label,unit,value,min,max,step,hint});
const choice=(key,label,options,value,hint='')=>({key,label,options,value,hint});
const result=(value,unit,rows,formula,note,extra=[],cites=[])=>({value,unit,rows,formula,note,extra,cites});
const calculators=[
{id:'btu',name:'Room cooling',group:'HEATING & COOLING',icon:'snow',desc:'Estimate room air conditioner capacity.',badge:'Room AC estimate',sources:['energy','calc','manual'],fields:[field('area','Floor area','ft²',500,100,2500),field('height','Ceiling height','ft',8,1,30),field('people','Regular occupants','people',2,0,1000,1),choice('sun','Sun exposure',[['normal','Typical'],['shade','Heavily shaded'],['sunny','Very sunny']],'normal'),choice('room','Room type',[['room','Living space'],['kitchen','Kitchen']],'room')],calculate:v=>{if(v.height!==8)throw Error('This table is based on an 8 ft ceiling. Use a detailed load calculation for other ceiling heights.');const base=BANDS.find(([end],i)=>v.area<end||i===BANDS.length-1)[1];const sun=base*({normal:0,shade:-.1,sunny:.1}[v.sun]);const people=Math.max(0,v.people-2)*600;const kitchen=v.room==='kitchen'?4000:0;const total=base+sun+people+kitchen;return result(total,'BTU/h',[['Floor-area table',base,'BTU/h'],['Sun exposure',sun,'BTU/h'],['Additional occupants',people,'BTU/h'],['Kitchen adjustment',kitchen,'BTU/h']],`${fmt(base)} ${sun<0?'−':'+'} ${fmt(Math.abs(sun))} + ${fmt(people)} + ${fmt(kitchen)} = ${fmt(total)} BTU/h`,'Room AC screening estimate. Insulation, local climate, glazing, humidity, and duct losses are not modeled. Whole-home equipment selection needs a detailed load calculation.',[[total/12000,'tons cooling'],[total/3412.141633,'kW thermal']]);}},
{id:'heat',name:'Heat transfer',group:'HEATING & COOLING',icon:'heat',desc:'Calculate steady-state heat flow through a building assembly.',badge:'Engineering formula',sources:['manual'],fields:[field('u','Assembly U-factor','BTU/(h·ft²·°F)',.06,.000001,1000),field('area','Assembly area','ft²',1000,.001),field('inside','Indoor temperature','°F',70,-459.66,1000),field('outside','Outdoor temperature','°F',20,-459.66,1000)],calculate:v=>{let dt=Math.abs(v.inside-v.outside),q=v.u*v.area*dt;return result(q,'BTU/h',[['Temperature difference',dt,'°F'],['Assembly area',v.area,'ft²']],`Q = U × A × |ΔT| = ${v.u} × ${v.area} × ${fmt(dt)}`,'One assembly only. Use the whole-assembly U-factor, including layers and thermal bridges. Excludes solar gain, internal loads, moisture and air leakage. Heat flows from the warmer side to the cooler side.');}},
{id:'furnace',name:'Furnace efficiency',group:'HEATING & COOLING',icon:'heat',desc:'Compare rated heat output with rated fuel input.',badge:'Nameplate ratio',sources:[],fields:[field('input','Rated input','BTU/h',80000,.001),field('output','Rated output','BTU/h',74000,0)],calculate:v=>{if(v.output>v.input)throw Error('For a fuel-burning furnace, rated output cannot exceed rated input. Check the nameplate values.');return result(v.output/v.input*100,'%', [['Rated fuel input',v.input,'BTU/h'],['Rated heat output',v.output,'BTU/h'],['Input − output',v.input-v.output,'BTU/h']],`Efficiency = output ÷ input × 100 = ${v.output} ÷ ${v.input} × 100`,'This is the nameplate output/input ratio, not a measured seasonal AFUE. Use the manufacturer’s certified AFUE for seasonal comparisons. The difference does not separately identify each type of loss.');}},
{id:'airflow',name:'Sensible airflow',group:'AIR & DUCTS',icon:'air',desc:'Find airflow needed to carry a sensible heating or cooling load.',badge:'Standard-air estimate',sources:['ashrae'],fields:[field('load','Sensible load','BTU/h',24000,.001),field('dt','Air temperature difference','°F',20,.001,300),field('density','Air density','lb/ft³',.075,.001,1),field('cp','Air specific heat','BTU/(lb·°F)',.24,.001,10)],calculate:v=>{let c=60*v.density*v.cp,q=v.load/(c*v.dt);return result(q,'CFM',[['Air coefficient',c,''],['Sensible load',v.load,'BTU/h']],`CFM = Q ÷ (60 × ρ × cₚ × ΔT) = ${v.load} ÷ (${fmt(c,4)} × ${v.dt})`,'Sensible heat only. The default density and specific heat give the familiar 1.08 coefficient. Adjust properties for altitude and air conditions. This does not calculate latent load or outdoor-air code requirements.');}},
{id:'ach',name:'Air changes',group:'AIR & DUCTS',icon:'air',desc:'Convert measured airflow and room volume into air changes per hour.',badge:'Geometric calculation',sources:[],fields:[field('flow','Airflow','CFM',200,0),field('length','Room length','ft',20,.001),field('width','Room width','ft',15,.001),field('height','Ceiling height','ft',8,.001)],calculate:v=>{let vol=v.length*v.width*v.height;return result(v.flow*60/vol,'ACH',[['Room volume',vol,'ft³'],['Airflow',v.flow,'CFM']],`ACH = CFM × 60 ÷ volume = ${v.flow} × 60 ÷ ${fmt(vol)}`,'Counts theoretical volume exchanges. Recirculated airflow is not outdoor ventilation. This calculator does not select a required ACH or certify ventilation compliance.');}},
{id:'duct',name:'Duct velocity',group:'AIR & DUCTS',icon:'duct',desc:'Find velocity from airflow and a duct’s internal dimensions.',badge:'Continuity equation',sources:[],fields:[choice('shape','Duct shape',[['round','Round'],['rect','Rectangular']],'round'),field('flow','Airflow','CFM',400,0),field('diameter','Inside diameter','in',10,.001,1000),field('width','Inside width','in',12,.001,1000),field('height','Inside height','in',8,.001,1000)],calculate:v=>{let area=v.shape==='round'?Math.PI*(v.diameter/12)**2/4:v.width*v.height/144;return result(v.flow/area,'ft/min',[['Cross-sectional area',area,'ft²'],['Airflow',v.flow,'CFM']],`Velocity = CFM ÷ area = ${v.flow} ÷ ${fmt(area,4)}`,'Uses clear internal dimensions. Velocity alone does not size a duct system; pressure loss, fittings, available static pressure, leakage and sound limits must also be evaluated.');}},
{id:'water',name:'Hydronic heat',group:'HEATING & COOLING',icon:'water',desc:'Estimate heat transported by flowing water.',badge:'Water-only estimate',sources:[],fields:[field('flow','Water flow','US gpm',4,0),field('dt','Water temperature difference','°F',20,0,300)],calculate:v=>result(500*v.flow*v.dt,'BTU/h',[['Water flow',v.flow,'US gpm'],['Temperature difference',v.dt,'°F']],`Q ≈ 500 × GPM × ΔT = 500 × ${v.flow} × ${v.dt}`,'Uses approximately 8.33 lb/US gal and 1 BTU/(lb·°F), with 60 min/h. For liquid water only; glycol mixes and other temperatures need corrected density and specific heat.')},

function convert(category,value,from,to){let x;if(category==='Temperature'){x=from==='°F'?(value-32)*5/9+273.15:from==='°C'?value+273.15:value;if(x<-.00000001)throw Error('Temperature cannot be below absolute zero.');return to==='°F'?(x-273.15)*9/5+32:to==='°C'?x-273.15:x;}return value*units[category][from]/units[category][to];}

// IAPWS saturation relations referenced by ASHRAE Fundamentals (2021), ch. 1, eqs. 5–6.
// Pressure in kPa; liquid water at/above 0 C, ice below 0 C.
function saturationPressure(t) {
  const T=t+273.15;
  if(t<0) { const q=T/273.16; return .611657*Math.exp((-21.2144006*q**.00333333333+27.3203819*q**1.20666667-6.1059813*q**1.70333333)/q); }
  const th=T-.23855557567849/(T-650.17534844798);
  const A=th*th+1167.0521452767*th-724213.16703206;
  const B=-17.073846940092*th*th+12020.82470247*th-3232555.0322333;
  const C=14.91510861353*th*th-4823.2657361591*th+405113.40542057;
  return 1000*(2*C/(-B+Math.sqrt(B*B-4*A*C)))**4;
}
function moistAir(t,rh,p) {
  const pv=saturationPressure(t)*rh/100;
  if(pv>=p) throw Error('Water vapor pressure must be below total pressure. Check temperature, humidity and barometric pressure.');
  const w=.621945*pv/(p-pv), h=1.006*t+w*(2501+1.86*t);
  let lo=-100,hi=t;
  if(pv<saturationPressure(lo))throw Error('Dew/frost point is below this calculator’s supported range.');
  for(let i=0;i<65;i++){const mid=(lo+hi)/2;if(saturationPressure(mid)>pv)hi=mid;else lo=mid;}
  return {pv,w,h,dew:(lo+hi)/2,volume:.287042*(t+273.15)*(1+1.607858*w)/p};
}

  return result(Voz,'cfm',rows,

{id:'combustionair',name:'Combustion air (IFGC 304)',group:'CODE & FUEL GAS',icon:'heat',desc:'Size combustion-air openings and indoor volume from 2024 IFGC §304 methods.',badge:'IFGC §304',sources:['ifgc'],fields:[

    formula=`ACH=min(${v.ach},0.60)=${fmt(ACH,4)}; Vother=(21/ACH)×(Iother/1000); Vfan=(15/ACH)×(Ifan/1000); V=${fmt(requiredV)} ft³`;

{id:'condensate',name:'Condensate drain size',group:'CODE & VENTILATION',icon:'water',desc:'Select minimum condensate drain diameter from IMC 307.2.2 / IPC 314.2.2 by cooling capacity.',badge:'IMC 307.2.2 ≡ IPC 314.2.2',sources:['imc','ipc'],fields:[

{id:'dryerduct',name:'Dryer duct length (IMC)',group:'CODE & VENTILATION',icon:'duct',desc:'Screen clothes-dryer exhaust duct equivalent length against the IMC Method 1 35 ft allowance.',badge:'IMC 504.9.4.1',sources:['imc'],fields:[

function inactiveField(id,key,v){

  if(id==='electric')return key==='pf'&&v.phase==='dc';

    if(key==='ez')return v.ezMode==='override';
    if(key==='ezOverride')return v.ezMode!=='override';
    return false;
  }
  if(id==='exhaust'){
    const row=imcExhaust[v.occupancy];
    if(!row)return false;
    if(key==='mode')return row.kind==='area';
    if(key==='area')return row.kind!=='area';
    if(key==='fixtures')return row.kind!=='fixture';
    if(key==='rooms')return row.kind!=='room';
    return false;
  }
  if(id==='combustionair'){

    const m=v.method,needsOpenings=['outdoor_two_vertical','outdoor_two_horizontal','outdoor_one','indoor_openings_same_story','indoor_openings_diff_story','combination'].includes(m);
    if(key==='volume')return m!=='indoor_volume_standard'&&m!=='indoor_volume_kair';
    if(key==='ach')return m!=='indoor_volume_kair';
    if(key==='availableVolume'||key==='outdoorSub')return m!=='combination';
    if(key==='sumConnectors')return m!=='outdoor_one'&&!(m==='combination'&&v.outdoorSub==='outdoor_one');
    if(key==='louver')return !needsOpenings;
    if(key==='freeAreaPct')return !needsOpenings||v.louver!=='custom';
    return false;
  }
  if(id==='venting'){
    const catI=v.category==='I';
    if(['draft','height','lateral','diameter','connectorDia','connectorIntoPos'].includes(key))return !catI;
    if(key==='mfrPath')return catI;
    return false;
  }
  if(id==='gaspipesize'){
    if(key==='loadBtuh')return v.loadUnit!=='btuh';
    if(key==='loadCfh')return v.loadUnit!=='cfh';
    if(key==='heatContent')return v.loadUnit!=='btuh';

function readForm(c){for(const f of c.fields){const el=document.getElementById(f.key);values[active][f.key]=f.options?el.value:el.value===''?'':Number(el.value);}}
function conditionalFields(c){for(const f of c.fields){const disabled=inactiveField(active,f.key,values[active]);document.querySelector(`[data-field="${f.key}"]`).hidden=disabled;document.getElementById(f.key).disabled=disabled;}}
function run(c){const previous=document.querySelector('#method')?.open||false;try{const r=evaluateCalculator(c,values[active]);currentResult=r;document.querySelector('#print').disabled=false;document.querySelector('#error').textContent='';document.querySelector('#result').innerHTML=`<div class="result-hero"><div class="result-label">${({btu:'Estimated cooling capacity',humidity:'Dew / frost point',outdoorair:'Zone outdoor airflow Voz',exhaust:'Required local exhaust',combustionair:values.combustionair?.directVent==='yes'?'Manufacturer path':values.combustionair?.method==='mechanical'?'Mechanical combustion air':String(values.combustionair?.method||'').startsWith('indoor_volume')?'Required enclosure volume':'Net free area',condensate:'Minimum drain diameter',venting:values.venting?.category==='I'?(values.venting?.connectorIntoPos==='yes'?'Hard block':'Category I · §504 prep'):'Manufacturer vent path',dryerduct:String(r.unit).includes('exceeds')?'Exceeds 35 ft · label path':'Method 1 remaining allowance',hoodcfm:'Required net exhaust',gaspipesize:'Required section capacity',mrvent:values.mrvent?.mode==='emergency'?'Emergency purge airflow':'Continuous machinery-room airflow',tpdischarge:'Checklist items marked OK'}[c.id]||'Result')}</div><div class="result-number" role="status" aria-live="polite">${pretty(r.value)}<small>${esc(r.unit)}</small></div>${r.extra.length?`<div class="equivalents">${r.extra.map(([n,u])=>`<span><b>${pretty(n)}</b> ${esc(u)}</span>`).join('')}</div>`:''}</div><div class="result-rows">${r.rows.map(([l,n,u])=>`<div class="result-row"><span>${esc(l)}</span><span>${pretty(n,4)} <small>${esc(u)}</small></span></div>`).join('')}</div>${['superheat','subcooling'].includes(active)&&r.value<0?'<p class="negative-note">Negative difference. Verify the readings; no positive '+(active==='superheat'?'superheat':'subcooling')+' is indicated.</p>':''}<details id="method" class="method" ${previous?'open':''}><summary>Formula & assumptions</summary><div class="method-body"><div class="formula">${esc(r.formula)}</div><p class="method-note">${esc(r.note)}</p>${(r.cites&&r.cites.length)?`<div class="equivalents" style="padding:0;margin:10px 0 0">${r.cites.map(t=>`<span><b>${esc(t)}</b></span>`).join('')}</div>`:''}${links(c.sources)}</div></details>`;}catch(e){currentResult=null;document.querySelector('#print').disabled=true;document.querySelector('#result').innerHTML='<div class="empty-result"><span>Result</span><strong>—</strong><p>Complete the inputs to calculate.</p></div>';document.querySelector('#error').textContent=e.message;}}
function unitOptions(selected){return Object.keys(units[conv.category]).map(k=>`<option ${k===selected?'selected':''}>${esc(k)}</option>`).join('');}
function converter(){return heading('Unit converter','Convert HVAC measurements without losing the units.','16 measurement groups')+`<div class="workspace"><section class="panel input-panel"><div class="fields"><div class="field full"><label for="category">Measurement</label><select id="category">${Object.keys(units).map(k=>`<option ${conv.category===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div><div class="field full"><label for="convert-value">Value</label><div class="input-wrap"><input type="number" id="convert-value" step="any" inputmode="decimal" value="${conv.value}" required></div></div><div class="field"><label for="from-unit">From</label><select id="from-unit">${unitOptions(conv.from)}</select></div><div class="field"><label for="to-unit">To</label><select id="to-unit">${unitOptions(conv.to)}</select></div></div><div class="converter-foot"><button id="swap" class="text-button">Swap units ⇄</button><span>Updates as you type</span></div><div id="conversion-error" role="alert"></div></section><section class="panel result-panel"><div class="result-hero"><div class="result-label">Converted value</div><div class="result-number" id="conversion-result" role="status" aria-live="polite"></div></div><div class="conversion-equation" id="conversion-formula"></div><p class="method-note converter-note" id="conversion-note"></p><details class="method"><summary>References</summary><div class="method-body">${links(['conversion','nist'])}</div></details></section></div>`;}
function bindConverter(){document.querySelector('#category').onchange=e=>{conv.category=e.target.value;[conv.from,conv.to]=Object.keys(units[conv.category]);render();};document.querySelector('#convert-value').oninput=e=>{conv.value=e.target.value;updateConversion();};document.querySelector('#from-unit').onchange=e=>{conv.from=e.target.value;updateConversion();};document.querySelector('#to-unit').onchange=e=>{conv.to=e.target.value;updateConversion();};document.querySelector('#swap').onclick=()=>{[conv.from,conv.to]=[conv.to,conv.from];document.querySelector('#from-unit').value=conv.from;document.querySelector('#to-unit').value=conv.to;updateConversion();};updateConversion();}
function updateConversion(){try{if(String(conv.value).trim()===''||!Number.isFinite(Number(conv.value)))throw Error('Enter a numeric value.');const v=Number(conv.value),n=convert(conv.category,v,conv.from,conv.to);if(!Number.isFinite(n))throw Error('Value exceeds the supported range.');document.querySelector('#print').disabled=false;document.querySelector('#conversion-result').innerHTML=`${pretty(n,7)}<small>${esc(conv.to)}</small>`;document.querySelector('#conversion-formula').textContent=`${pretty(v,7)} ${conv.from} = ${pretty(n,7)} ${conv.to}`;const notes={Temperature:'For a temperature rise or drop, select Temperature difference; absolute temperatures include a scale offset.','Temperature difference':'A change of 1 °C equals a change of 1.8 °F. No 32-degree offset is applied.','Power / capacity':'Thermal kW and electrical input kW describe different quantities, even though they use the same unit.',Pressure:'Conventional inches of water. Gauge-to-absolute pressure needs a reference pressure and is not performed here.','Specific enthalpy':'Unit conversion only. Enthalpy reference datums are not changed; values from different charts may use different zero points.','Humidity ratio':'Moisture mass per dry-air mass, not relative humidity.','Thermal resistance':'Converts area-normalized R-value, not total resistance in K/W.'};document.querySelector('#conversion-note').textContent=notes[conv.category]||'US liquid gallons and US therm; International Table BTU. Full precision is retained until display.';document.querySelector('#conversion-error').textContent='';}catch(e){document.querySelector('#print').disabled=true;document.querySelector('#conversion-result').textContent='—';document.querySelector('#conversion-formula').textContent='';document.querySelector('#conversion-note').textContent='';document.querySelector('#conversion-error').textContent=e.message;}}
function references(){const entries=[
['Code tools','ICC compliance calculators','Official code-specific tools. This page was access-restricted during research; its rules have not been reproduced.','https://codes.iccsafe.org/compliance-calculators/'],
['Fire safety','2024 IFC','Fire-code reference. The IFC does not supply every HVAC engineering formula.',sourceLinks.ifc[1]],
['Mechanical','2024 IMC','Check the adopted edition, occupancy, exceptions and local amendments for ventilation and mechanical systems.',sourceLinks.imc[1]],
['Ventilation','2024 IMC · §403 / Table 403.3.1.1','Outdoor-air and local-exhaust screening tools use model-code rates (Equations 4-1 and 4-2). Confirm AHJ edition and amendments; not a compliance certificate.',sourceLinks.imc[1]],
['Fuel gas','2024 IFGC','Combustion-air (§304), Chapter 5 venting-category routing, and §402 gas-pipe method helper. Table 504 / 402.4 capacity cells are not digitized. Confirm AHJ edition and amendments; not a compliance certificate.',sourceLinks.ifgc[1]],
['Kitchen hoods','2024 IMC · §507','Type I / Type II hood capacity screening (cfm per linear foot × length). Embedded rates are AHJ-verify defaults. Makeup air is separate (§508).',sourceLinks.imc[1]],
['Gas piping','2024 IFGC · §402 / §310','Gas-pipe sizing method helper (longest / branch / hybrid) plus CSST bonding checklist (§310.2 / §310.3). Select diameters from AHJ Table 402.4(x).',sourceLinks.ifgc[1]],
['Condensate','2024 IMC / IPC','Condensate drain diameter lookup from IMC §307.2.2 ≡ IPC §314.2.2 by cooling capacity, with slope and non-decreasing size notes.',sourceLinks.imc[1]],
['Dryer exhaust','2024 IMC · §504.9.4.1','Clothes-dryer duct equivalent-length Method 1 (35 ft) screening. Fitting EL values are helpers — verify Table 504.9.4.1 with the AHJ.',sourceLinks.imc[1]],
['Machinery rooms','ASHRAE Standard 15','Phase 1 machinery-room ventilation screen (continuous EXAMPLE_UNVERIFIED; non-A2L emergency 100√G; A2L hard-stop). No invented ppm tables. Confirm AHJ-adopted edition.',sourceLinks.ashrae15[1]],
['T&P discharge','2024 IPC · §§504.4–504.6','Temperature-and-pressure relief valve and discharge-piping screening checklist. Typical §504.6 items; verify AHJ edition.',sourceLinks.ipc[1]],
['Energy','2024 IECC','Energy-code reference; this app does not certify building energy compliance.',sourceLinks.iecc[1]],
['Room cooling','ENERGY STAR','Floor-area table plus sun, occupancy and kitchen adjustments. 100–2,500 ft², 8 ft ceiling basis; shared boundaries use the higher band.',sourceLinks.energy[1]],
['Detailed loads','ACCA Manual J','Residential load-design reference. Room estimates and single-assembly heat transfer do not implement Manual J.',sourceLinks.manual[1]],
['Duct design','ACCA Manual D','Duct design includes friction, fittings, available static pressure, sound and balancing. Our geometry tools do not implement Manual D.',sourceLinks.manuald[1]],
['Moist air','ASHRAE Fundamentals 2021 · Ch. 1','Humidity ratio, moist-air enthalpy and IAPWS saturation relations. Dew/frost point is obtained by numerical inversion. Ideal moist-air estimates.',sourceLinks.ashrae[1]],
['Refrigeration','Copeland · Refrigerants with glide','Dew-point saturation for superheat and bubble-point saturation for subcooling. Use the correct refrigerant chart and manufacturer targets.',sourceLinks.copeland[1]],
['Units','NIST SP 811','SI unit definitions and conversion conventions. Conversion does not reconcile different enthalpy reference datums.',sourceLinks.nist[1]],
['Product reference','Calculator.net · BTU calculator','Reference for the room-calculation input flow. Our estimate uses the published ENERGY STAR method.',sourceLinks.calc[1]],
['Product reference','Calculator.net · Conversion calculator','Reference for the familiar value/from/to conversion flow.',sourceLinks.conversion[1]]];
return heading('Codes & sources','Open the source behind a calculation.','Reference editions')+`<div class="edition-note"><strong>Code editions note.</strong> This workbench provides <em>national US model-code / model-standard screening</em> using selectable <em>model packs</em> (currently: ${esc(codeEditionLabel())}). Model packs are not the law. <strong>The AHJ-adopted edition, local amendments, and PE judgment always govern.</strong> ${LEGAL_DISCLAIMER}</div><p class="reference-intro">Linked IMC / IFGC / IPC / IECC / ASHRAE 15 materials are reference editions. Confirm your jurisdiction’s adopted codes and amendments. Calculators are estimates or engineering relationships, not compliance decisions. Code tools (outdoor air, exhaust, condensate, dryer duct, hood capacity, combustion air, venting, gas pipe, machinery-room ventilation, T&amp;P discharge) use published model values or EXAMPLE_UNVERIFIED screens for screening only. Appendices apply only if adopted by the AHJ. ASHRAE standards are referenced to the extent cited; where they conflict with IMC text, the IMC governs (§102.8). Fuel-gas piping, appliances and venting are IFGC scope (IMC §101.2).</p><div class="reference-list">${entries.map(([topic,title,description,url])=>`<article class="reference-row"><div class="ref-topic">${esc(topic)}</div><div><a href="${url}" target="_blank" rel="noopener noreferrer">${esc(title)} ↗</a><p>${esc(description)}</p></div></article>`).join('')}</div><p class="smallprint">Reviewed September 11, 2026. No full code text or proprietary calculator algorithms are reproduced. Fan laws use the standard same-geometry affinity relationships; measurement and geometry tools show their mathematical derivations.</p>`;
}

  const items=[
    ['2026-09-11','AHJ setting, Changelog, ASHRAE 15 MRVENT, IPC T&P checklist','<ul><li>Global app-wide code/model-edition picker with persistent selection and a strong legal disclaimer banner (not a substitute for adopted code, AHJ, or PE).</li><li>Public Changelog page plus Code Editions note: national US screening, model packs, AHJ always.</li><li><strong>SPEC-ASHRAE15-MRVENT Phase 1</strong> — continuous Q = max(0.5×ft², 20×persons) tagged EXAMPLE_UNVERIFIED; emergency Q = 100√G for non-A2L; hard-stop A2L (and B2L) from the √G path; no invented ppm tables.</li><li>IPC §§504.4–504.6 T&amp;P relief / discharge piping screening checklist.</li><li>Calculator count: <strong>34</strong>.</li></ul>'],

  ];
  return heading('Changelog','What changed in this workbench.','Public notes')+`<div class="edition-note"><strong>Code editions note.</strong> Tools are built for <em>national US screening</em> against selectable <em>model packs</em> (active: ${esc(codeEditionLabel())}). Model packs organize defaults and citations; they do not replace the law. <strong>Always verify the AHJ-adopted edition and amendments.</strong> ${LEGAL_DISCLAIMER}</div><div class="changelog-list">${items.map(([when,title,html])=>`<article class="changelog-item"><h3>${esc(title)}</h3><p class="when">${esc(when)}</p>${html}</article>`).join('')}</div><p class="smallprint">Changelog summarizes product changes only. It is not a code adoption history for any jurisdiction.</p>`;
}
shell();const initial=location.hash.slice(1);if(routeValid(initial))active=initial;render();window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==active&&routeValid(id)){active=id;render();}});
</script></body></html>
