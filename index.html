    ['Air velocity',vel,'fpm']
  ],`V ≈ 4005 × √VP = 4005 × √${fmt(v.vp)}`,
  'Standard-density I-P pitot formula used widely in TAB field guides. Average several traverse points. Pair with duct area to get CFM.');
}}
,{id:'ductcfmva',name:'CFM from area × velocity',group:'AIR & DUCTS',icon:'duct',desc:'Compute airflow from free area and measured or design velocity (CFM = A × V).',badge:'Continuity',sources:[],fields:[
field('area','Free area','ft²',1.5,.0001),
field('velocity','Air velocity','fpm',800,0)
],calculate:v=>{
  const cfm=v.area*v.velocity;

    ['Velocity',v.velocity,'fpm'],
    ['Airflow',cfm,'cfm'],
    ['Equivalent round diameter',eqd,'in']
  ],`CFM = area × velocity = ${fmt(v.area)} × ${fmt(v.velocity)}`,
  'Public continuity relationship from TAB / duct math references. Use clear free area, not nominal OD. Not a complete duct design.');
}}
,{id:'gascfh',name:'Gas CFH from input',group:'CODE & FUEL GAS',icon:'heat',desc:'Convert appliance gas input to cubic feet per hour using heating value.',badge:'Gas volume',sources:[],fields:[

    ['Heating value',v.hv,'BTU/ft³'],
    ['Volume flow',cfh,'cfh']

  'Public unit relationship used before IFGC pipe tables. Enter the utility heating value for the site. This does not select pipe diameter.');
}}
,{id:'therms',name:'BTU ↔ therms',group:'ENERGY & MATH',icon:'cost',desc:'Convert between BTU and therms (1 therm = 100,000 BTU).',badge:'Fuel units',sources:[],fields:[
field('btu','Energy','BTU',100000,0)
],calculate:v=>{

    ['Therms',therms,'therms'],
    ['Approx kWh thermal',kwh,'kWh']
  ],`therms = BTU ÷ 100,000 = ${fmt(v.btu)} ÷ 100,000`,
  'Definitional US utility conversion. Natural-gas bills often use therms or CCF with a billed heat factor.');
}}
,{id:'chillgpm24',name:'Chiller GPM from tons',group:'HYDRONICS',icon:'water',desc:'Estimate chilled-water flow from tons and range using the public tons × 24 / ΔT rule.',badge:'CHW flow',sources:[],fields:[

    ['Range',v.dt,'°F'],
    ['Load',load,'BTU/h'],
    ['Water flow',gpm,'gpm']
  ],`GPM ≈ tons × 24 / ΔT = ${fmt(v.tons)} × 24 / ${fmt(v.dt)}`,
  'Public rule of thumb from Q = 500 × GPM × ΔT with 12,000 BTU/h per ton (24 = 12000/500). Confirm fluid factor for glycol.');
}}
,{id:'tonfrom400',name:'Tons from 400 CFM/ton',group:'AIR & DUCTS',icon:'snow',desc:'Back-calculate cooling tons from supply airflow using the common 400 CFM/ton rule of thumb.',badge:'Rule of thumb',sources:[],fields:[

    ['CFM per ton',v.ratio,'cfm/ton'],

  ],`tons ≈ CFM ÷ (CFM/ton) = ${fmt(v.cfm)} ÷ ${fmt(v.ratio)}`,

}}
,{id:'moistlbhr',name:'Moisture removal rate',group:'HEATING & COOLING',icon:'water',desc:'Convert airflow and grains difference into pounds of water removed (or added) per hour.',badge:'lb/h moisture',sources:[],fields:[
field('cfm','Airflow','cfm',1200,0),
field('dgrains','Moisture change','grains/lb',20,-200,200)

    ['Δ grains',v.dgrains,'grains/lb'],
    ['Moisture rate',lbhr,'lb/h'],
    ['Approx gallons/h',galhr,'gal/h']
  ],`lb/h = CFM × Δgrains × 60 / 7000 = ${fmt(v.cfm)} × ${fmt(v.dgrains)} × 60 / 7000`,
  'Public mass-balance from 7000 grains per pound. Positive means moisture removed from the air stream. Assumes standard dry-air mass from CFM without specific-volume correction.');
}}
,{id:'eir',name:'EIR from COP',group:'ENERGY & MATH',icon:'bolt',desc:'Convert coefficient of performance into energy input ratio (EIR = 1 / COP).',badge:'Efficiency',sources:[],fields:[
field('cop','Coefficient of performance','COP',3.5,.001,20)
],calculate:v=>{
  if(v.cop<=0)throw Error('COP must be greater than zero.');

  return result(eir,'EIR',[
    ['COP',v.cop,'COP'],
    ['EIR',eir,'kW/kW'],
    ['Approx EER',eer,'BTU/Wh']
  ],`EIR = 1 / COP = 1 / ${fmt(v.cop)}`,
  'Definitional reciprocal used in many public energy models. Same operating condition as the COP. Not SEER2 or HSPF2.');
}}
,{id:'grillecfm',name:'Grille CFM from free area',group:'AIR & DUCTS',icon:'air',desc:'Estimate grille or register airflow from net free area and face velocity.',badge:'Grille flow',sources:[],fields:[
field('nfa','Net free area','in²',48,.001),

    ['Free area',areaFt,'ft²'],
    ['Face velocity',v.velocity,'fpm'],
    ['Airflow',cfm,'cfm']
  ],`CFM = (NFA ÷ 144) × V = (${fmt(v.nfa)} ÷ 144) × ${fmt(v.velocity)}`,
  'Public continuity check for grilles/registers. Use manufacturer net free area, not duct collar size. Throw and noise limits are separate.');
}}
,{id:'altfactor',name:'Altitude density factor',group:'AIR & DUCTS',icon:'air',desc:'Estimate the standard-atmosphere density ratio and scaled 1.08 / 4.5 / 0.69 air factors for elevation.',badge:'Altitude factor',sources:[],fields:[
field('elev','Elevation','ft',5000,0,15000)
],calculate:v=>{

    ['Elevation',v.elev,'ft'],
    ['Density ratio vs sea level',pr,''],
    ['Scaled 1.08 factor',1.08*pr,'BTU/h·cfm·°F'],
    ['Scaled 4.5 factor',4.5*pr,'BTU/h·cfm·(BTU/lb)'],
    ['Scaled 0.69 factor',0.69*pr,'BTU/h·cfm·grain']
  ],`DF ≈ (1 − 6.87535×10⁻⁶ × z)⁵·²⁵⁵⁹`,
  'US standard-atmosphere pressure ratio used as a public density correction for sea-level air constants. Local temperature and humidity still matter. Not a weather file.');
}}
,{id:'oilgph',name:'Oil GPH from load',group:'HEATING & COOLING',icon:'heat',desc:'Estimate fuel-oil gallons per hour from heating load, heating value, and efficiency.',badge:'Oil firing',sources:[],fields:[
field('load','Heat output','BTU/h',140000,0),
field('hv','Oil heating value','BTU/gal',140000,50000,200000),

],calculate:v=>{
  if(v.hv<=0)throw Error('Heating value must be greater than zero.');
  if(v.eff<=0||v.eff>100)throw Error('Efficiency must be between 0 and 100%.');
  const input=v.load/(v.eff/100);
  const gph=input/v.hv;
  return result(gph,'gph',[
    ['Heat output',v.load,'BTU/h'],
    ['Efficiency',v.eff,'%'],
    ['Required input',input,'BTU/h'],
    ['Oil rate',gph,'gph']
  ],`GPH = (output ÷ η) ÷ (BTU/gal)`,
  'Public fuel arithmetic for nozzle/firing checks. Enter the oil heating value and steady-state efficiency from the appliance data. Not a combustion-analysis certificate.');
}}
,{id:'motorfla',name:'Motor FLA estimate',group:'ENERGY & MATH',icon:'bolt',desc:'Estimate full-load amps from horsepower, voltage, efficiency, and power factor.',badge:'Motor amps',sources:[],fields:[
choice('phase','Power system',[['single','Single-phase'],['three','Three-phase']],'three'),
field('hp','Shaft power','hp',5,.001),
field('volts','Line voltage','V',460,1),
field('eff','Efficiency','%',92,1,100),
field('pf','Power factor','—',.86,.1,1)
],calculate:v=>{
  if(v.volts<=0)throw Error('Voltage must be greater than zero.');
  if(v.eff<=0||v.eff>100)throw Error('Efficiency must be between 0 and 100%.');
  if(v.pf<=0||v.pf>1)throw Error('Power factor must be between 0 and 1.');
  const watts=v.hp*746;
  const denom=v.volts*(v.eff/100)*v.pf*(v.phase==='three'?Math.sqrt(3):1);
  const amps=watts/denom;
  return result(amps,'A',[
    ['Shaft power',v.hp,'hp'],
    ['Line voltage',v.volts,'V'],
    ['Efficiency',v.eff,'%'],
    ['Power factor',v.pf,''],
    ['Estimated FLA',amps,'A']
  ],`I ≈ (HP × 746) ÷ (V × η × PF${v.phase==='three'?' × √3':''})`,
  'Public electrical estimate for planning. Use the motor nameplate FLA for conductors, overloads, and disconnects.');
}}
,{id:'mixgrains',name:'Mixed-air grains',group:'AIR & DUCTS',icon:'water',desc:'Mix two airstream moisture contents by mass share (outdoor fraction × grains).',badge:'Humidity mix',sources:[],fields:[
field('oa','Outdoor moisture','grains/lb',90,0,300),
field('ra','Return moisture','grains/lb',65,0,300),
field('fraction','Outdoor air mass share','%',25,0,100)
],calculate:v=>{

    ['Outdoor grains',v.oa,'grains/lb'],
    ['Return grains',v.ra,'grains/lb'],
    ['Outdoor mass share',v.fraction,'%'],
    ['Mixed grains',mix,'grains/lb']
  ],`Wmix ≈ f × Woa + (1 − f) × Wra`,
  'Public linear mixing of humidity ratio. Assumes complete mixing and equal dry-air specific heats. Condensation in the mix chamber is not modeled.');
}}
,{id:'staticregain',name:'Static regain',group:'AIR & DUCTS',icon:'duct',desc:'Estimate available static-pressure regain from a duct velocity reduction (ΔVP).',badge:'Regain',sources:[],fields:[
field('v1','Upstream velocity','fpm',1500,0),
field('v2','Downstream velocity','fpm',900,0),
field('eff','Regain effectiveness','%',75,1,100)
],calculate:v=>{
  if(v.eff<=0||v.eff>100)throw Error('Effectiveness must be between 0 and 100%.');
  const vp1=Math.pow(v.v1/4005,2);
  const vp2=Math.pow(v.v2/4005,2);
  const ideal=vp1-vp2;
  const regain=ideal*(v.eff/100);
  return result(regain,'in. w.c.',[
    ['Upstream VP',vp1,'in. w.c.'],
    ['Downstream VP',vp2,'in. w.c.'],
    ['Ideal ΔVP',ideal,'in. w.c.'],
    ['Effective regain',regain,'in. w.c.']
  ],`ΔPs ≈ η × (VP₁ − VP₂) with VP = (V/4005)²`,
  'Public static-regain concept used in duct design texts. Effectiveness depends on fitting geometry. This is not a full duct-pressure simulation.');
}}
,{id:'fluidq',name:'Fluid heat from SG·cp',group:'HYDRONICS',icon:'water',desc:'Estimate hydronic heat transfer from GPM, ΔT, specific gravity, and specific heat (public 8.33×60×SG×cp form).',badge:'Fluid Q',sources:[],fields:[
field('gpm','Volume flow','gpm',40,0),

],calculate:v=>{

,{id:'waterdt',name:'Water ΔT from load',group:'HYDRONICS',icon:'water',desc:'Solve water temperature difference from load and flow using the public Q = factor × GPM × ΔT relationship.',badge:'Water ΔT',sources:[],fields:[

,{id:'pumpbhp',name:'Pump brake horsepower',group:'HYDRONICS',icon:'water',desc:'Estimate pump shaft power from flow, head, specific gravity, and efficiency.',badge:'Pump BHP',sources:[],fields:[

,{id:'wetbulbstull',name:'Wet-bulb (Stull)',group:'AIR & DUCTS',icon:'water',desc:'Approximate wet-bulb temperature from dry-bulb and RH using the publicly published Stull (2011) formula.',badge:'Wet-bulb approx',sources:[],fields:[
field('db','Dry-bulb','°F',80,32,122),
field('rh','Relative humidity','%',50,.1,100)
],calculate:v=>{
  const t=(v.db-32)*5/9;
  const rh=v.rh;
  const tw=t*Math.atan(0.151977*Math.sqrt(rh+8.313659))+Math.atan(t+rh)-Math.atan(rh-1.676331)+0.00391838*Math.pow(rh,1.5)*Math.atan(0.023101*rh)-4.686035;
  const twf=tw*9/5+32;
  const dep=v.db-twf;
  return result(twf,'°F',[
    ['Dry-bulb',v.db,'°F'],
    ['RH',v.rh,'%'],
    ['Wet-bulb (approx)',twf,'°F'],
    ['Wet-bulb depression',dep,'Δ°F']
  ],`Stull (2011) wet-bulb approximation (°C inputs)`,
  'Open literature approximation for 0.5–99% RH and typical comfort temperatures. Not a substitute for a calibrated psychrometer or full ASHRAE psychrometrics.');
}}

function evaluateCalculator(c,v){

    const n=v[f.key];if(n===''||!Number.isFinite(n))throw Error(`Enter ${f.label.toLowerCase()}.`);
    if(n<f.min||n>f.max)throw Error(`${f.label}: enter ${fmt(f.min,6)} to ${fmt(f.max)} ${f.unit}.`);
    if(f.step===1&&!Number.isInteger(n))throw Error(`${f.label}: use a whole number.`);
  }
  const r=c.calculate(v);if(!Number.isFinite(r.value)||r.rows.some(x=>!Number.isFinite(x[1]))||r.extra.some(x=>!Number.isFinite(x[0])))throw Error('These inputs exceed the supported calculation range.');return r;
}

  };

function render(){renderNav();document.querySelector('#mobile-calc').value=active;const main=document.querySelector('main');if(active==='references'){main.innerHTML=references();currentResult=null;document.querySelector('#print').disabled=false;return;}if(active==='changelog'){main.innerHTML=changelog();currentResult=null;document.querySelector('#print').disabled=false;return;}if(active==='convert'){main.innerHTML=converter();bindConverter();return;}const c=calculators.find(x=>x.id===active),adv=advancedFields[active]||[],normal=c.fields.filter(f=>!adv.includes(f.key)),vals=values[active];
  const advOpen=adv.some(k=>vals[k]!==c.fields.find(f=>f.key===k).value);
  const advFields=c.fields.filter(f=>adv.includes(f.key));
  const inputBody=panelHead('Inputs','<button id="reset" type="button" class="text-button">Reset</button>')+`<form id="calc-form" novalidate>${fieldsGrid(normal,vals)}${adv.length?advancedSection(advancedTitleFor(active),advFields,vals,advOpen):''}${calculatorDisclaimers(active)}${formStatus()}</form>`;
  main.innerHTML=heading(active==='btu'?'BTU calculator':c.name,c.desc,c.badge)+workspace(inputBody,'',essentials[active]);
  const form=document.querySelector('#calc-form');form.onsubmit=e=>{e.preventDefault();clearTimeout(timer);readForm(c);run(c);};
  form.oninput=()=>{readForm(c);conditionalFields(c);clearTimeout(timer);run(c);};
  form.onchange=()=>{readForm(c);conditionalFields(c);clearTimeout(timer);run(c);};
  document.querySelector('#reset').onclick=()=>{values[active]=Object.fromEntries(c.fields.map(f=>[f.key,f.value]));render();};conditionalFields(c);run(c);
}
function readForm(c){for(const f of c.fields){const el=document.getElementById(f.key);values[active][f.key]=f.options?el.value:el.value===''?'':Number(el.value);}}
function conditionalFields(c){for(const f of c.fields){const disabled=inactiveField(active,f.key,values[active]);document.querySelector(`[data-field="${f.key}"]`).hidden=disabled;document.getElementById(f.key).disabled=disabled;}}
function run(c){const previous=document.querySelector('#method')?.open||false;try{const r=evaluateCalculator(c,values[active]);currentResult=r;document.querySelector('#print').disabled=false;document.querySelector('#error').textContent='';
  const negative=['superheat','subcooling'].includes(active)&&r.value<0?`<p class="negative-note">Negative difference. Verify the readings; no positive ${active==='superheat'?'superheat':'subcooling'} is indicated.</p>`:'';
  document.querySelector('#result').innerHTML=resultHero(resultLabelFor(c,r),`${pretty(r.value)}<small>${esc(r.unit)}</small>`,resultExtras(r.extra))+resultRows(r.rows)+negative+chipsBlock(r.chips)+methodDetails(r.formula,r.note,r.cites,c.sources,previous);
}catch(e){currentResult=null;document.querySelector('#print').disabled=true;document.querySelector('#result').innerHTML=emptyResult();document.querySelector('#error').textContent=e.message;}}
function unitOptions(selected){return Object.keys(units[conv.category]).map(k=>`<option ${k===selected?'selected':''}>${esc(k)}</option>`).join('');}
function converter(){
  const inputBody=panelHead('Inputs')+`<div class="fields"><div class="field full"><label for="category">Measurement</label><select id="category">${Object.keys(units).map(k=>`<option ${conv.category===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div><div class="field full"><label for="convert-value">Value</label><div class="input-wrap"><input type="number" id="convert-value" step="any" inputmode="decimal" value="${conv.value}" required></div></div><div class="field"><label for="from-unit">From</label><select id="from-unit">${unitOptions(conv.from)}</select></div><div class="field"><label for="to-unit">To</label><select id="to-unit">${unitOptions(conv.to)}</select></div></div><div class="converter-foot"><button id="swap" class="text-button">Swap units ⇄</button><span>Updates as you type</span></div><div id="conversion-error" role="alert"></div>`;
  const resultBody=`<div class="result-hero"><div class="result-label">Converted value</div><div class="result-number" id="conversion-result" role="status" aria-live="polite"></div></div><div class="conversion-equation" id="conversion-formula"></div><p class="method-note converter-note" id="conversion-note"></p><details class="method"><summary>References</summary><div class="method-body">${links(['conversion','nist'])}</div></details>`;
  return heading('Unit converter','Convert HVAC measurements without losing the units.',Object.keys(units).length+' measurement groups')+workspace(inputBody,resultBody);
}function bindConverter(){document.querySelector('#category').onchange=e=>{conv.category=e.target.value;[conv.from,conv.to]=Object.keys(units[conv.category]);render();};document.querySelector('#convert-value').oninput=e=>{conv.value=e.target.value;updateConversion();};document.querySelector('#from-unit').onchange=e=>{conv.from=e.target.value;updateConversion();};document.querySelector('#to-unit').onchange=e=>{conv.to=e.target.value;updateConversion();};document.querySelector('#swap').onclick=()=>{[conv.from,conv.to]=[conv.to,conv.from];document.querySelector('#from-unit').value=conv.from;document.querySelector('#to-unit').value=conv.to;updateConversion();};updateConversion();}
function updateConversion(){try{if(String(conv.value).trim()===''||!Number.isFinite(Number(conv.value)))throw Error('Enter a numeric value.');const v=Number(conv.value),n=convert(conv.category,v,conv.from,conv.to);if(!Number.isFinite(n))throw Error('Value exceeds the supported range.');document.querySelector('#print').disabled=false;document.querySelector('#conversion-result').innerHTML=`${pretty(n,7)}<small>${esc(conv.to)}</small>`;document.querySelector('#conversion-formula').textContent=`${pretty(v,7)} ${conv.from} = ${pretty(n,7)} ${conv.to}`;const notes={Temperature:'For a temperature rise or drop, select Temperature difference; absolute temperatures include a scale offset.','Temperature difference':'A change of 1 °C equals a change of 1.8 °F. No 32-degree offset is applied.','Power / capacity':'Thermal kW and electrical input kW describe different quantities, even though they use the same unit. Mechanical horsepower is 745.7 W.',Pressure:'Conventional water-column and mercury columns use standard conversions. Gauge-to-absolute pressure needs a reference pressure and is not performed here.','Specific enthalpy':'Unit conversion only. Enthalpy reference datums are not changed; values from different charts may use different zero points.','Humidity ratio':'Moisture mass per dry-air mass, not relative humidity.','Thermal resistance':'Converts area-normalized R-value, not total resistance in K/W.',Force:'lbf is the international pound-force.',Frequency:'rpm is treated as cycles per minute (1 rpm = 1/60 Hz). rps is revolutions per second.',Angle:'Plane angle only.',Time:'A day is exactly 86400 seconds here.','Mass flow':'Mass per unit time, not volume flow.','Absolute humidity':'Moisture mass per moist-air volume, not humidity ratio.','Thermal conductivity':'k-value of a material, not an assembly U-factor.','Kinematic viscosity':'ν = μ/ρ. Enter consistent fluid properties.','Electrical potential':'Unit conversion only; not a circuit analysis.','Electrical current':'Unit conversion only; not a circuit analysis.'};document.querySelector('#conversion-note').textContent=notes[conv.category]||'US liquid gallons and US therm; International Table BTU. Full precision is retained until display.';document.querySelector('#conversion-error').textContent='';}catch(e){document.querySelector('#print').disabled=true;document.querySelector('#conversion-result').textContent='—';document.querySelector('#conversion-formula').textContent='';document.querySelector('#conversion-note').textContent='';document.querySelector('#conversion-error').textContent=e.message;}}
