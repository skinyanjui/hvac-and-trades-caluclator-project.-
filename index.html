</style></head><body><div id="app"></div><noscript>Enable JavaScript to use the HVAC calculators.</noscript><script>const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const BANDS=[[150,5000],[250,6000],[300,7000],[350,8000],[400,9000],[450,10000],[550,12000],[700,14000],[1000,18000],[1200,21000],[1400,23000],[1500,24000],[2000,30000],[2500,34000]];
const sourceLinks={energy:['ENERGY STAR · Room AC sizing','https://www.energystar.gov/products/room_air_conditioners'],calc:['Calculator.net · BTU reference','https://www.calculator.net/btu-calculator.html'],conversion:['Calculator.net · Conversion reference','https://www.calculator.net/conversion-calculator.html'],manual:['ACCA · Manual J','https://www.acca.org/standards/technical-manuals/manual-j'],ashrae:['ASHRAE · Psychrometrics','https://handbook.ashrae.org/Handbooks/F21/SI/F21_Ch01/F21_Ch01_si.aspx'],nist:['NIST · SI conversion reference','https://www.nist.gov/pml/special-publication-811'],imc:['ICC · 2024 IMC','https://codes.iccsafe.org/content/IMC2024V1.0'],ifc:['ICC · 2024 IFC','https://codes.iccsafe.org/content/IFC2024V1.0'],ifgc:['ICC · 2024 IFGC','https://codes.iccsafe.org/content/IFGC2024V1.0'],iecc:['ICC · 2024 IECC','https://codes.iccsafe.org/content/IECC2024V1.0']};
const field=(key,label,unit,value,min=0,max=1e9,step='any')=>({key,label,unit,value,min,max,step});
const choice=(key,label,options,value)=>({key,label,options,value});
const result=(value,unit,rows,formula,note,extra=[])=>({value,unit,rows,formula,note,extra});
const calculators=[
{id:'btu',name:'Room cooling',group:'HEATING & COOLING',icon:'snow',desc:'Estimate room air conditioner capacity.',badge:'Room AC estimate',sources:['energy','calc','manual'],fields:[field('area','Floor area','ft²',500,100,2500),field('height','Ceiling height','ft',8,1,30),field('people','Regular occupants','people',2,0,1000,1),choice('sun','Sun exposure',[['normal','Typical'],['shade','Heavily shaded'],['sunny','Very sunny']],'normal'),choice('room','Room type',[['room','Living space'],['kitchen','Kitchen']],'room')],calculate:v=>{if(v.height!==8)throw Error('This table is based on an 8 ft ceiling. Use a detailed load calculation for other ceiling heights.');const base=BANDS.find(([end],i)=>v.area<end||i===BANDS.length-1)[1];const sun=base*({normal:0,shade:-.1,sunny:.1}[v.sun]);const people=Math.max(0,v.people-2)*600;const kitchen=v.room==='kitchen'?4000:0;const total=base+sun+people+kitchen;return result(total,'BTU/h',[['Floor-area table',base,'BTU/h'],['Sun exposure',sun,'BTU/h'],['Additional occupants',people,'BTU/h'],['Kitchen adjustment',kitchen,'BTU/h']],`${fmt(base)} ${sun<0?'−':'+'} ${fmt(Math.abs(sun))} + ${fmt(people)} + ${fmt(kitchen)} = ${fmt(total)} BTU/h`,'Room AC screening estimate. Insulation, local climate, glazing, humidity, and duct losses are not modeled. Whole-home equipment selection needs a detailed load calculation.',[[total/12000,'tons cooling'],[total/3412.141633,'kW thermal']]);}},
{id:'heat',name:'Heat transfer',group:'HEATING & COOLING',icon:'heat',desc:'Calculate steady-state heat flow through a building assembly.',badge:'Engineering formula',sources:['manual'],fields:[field('u','Assembly U-factor','BTU/(h·ft²·°F)',.06,.000001,1000),field('area','Assembly area','ft²',1000,.001),field('inside','Indoor temperature','°F',70,-459.66,1000),field('outside','Outdoor temperature','°F',20,-459.66,1000)],calculate:v=>{let dt=Math.abs(v.inside-v.outside),q=v.u*v.area*dt;return result(q,'BTU/h',[['Temperature difference',dt,'°F'],['Assembly area',v.area,'ft²']],`Q = U × A × |ΔT| = ${v.u} × ${v.area} × ${fmt(dt)}`,'One assembly only. Use the whole-assembly U-factor, including layers and thermal bridges. Excludes solar gain, internal loads, moisture and air leakage. Heat flows from the warmer side to the cooler side.');}},
{id:'furnace',name:'Furnace efficiency',group:'HEATING & COOLING',icon:'heat',desc:'Compare rated heat output with rated fuel input.',badge:'Nameplate ratio',sources:[],fields:[field('input','Rated input','BTU/h',80000,.001),field('output','Rated output','BTU/h',74000,0)],calculate:v=>{if(v.output>v.input)throw Error('For a fuel-burning furnace, rated output cannot exceed rated input. Check the nameplate values.');return result(v.output/v.input*100,'%', [['Rated fuel input',v.input,'BTU/h'],['Rated heat output',v.output,'BTU/h'],['Input − output',v.input-v.output,'BTU/h']],`Efficiency = output ÷ input × 100 = ${v.output} ÷ ${v.input} × 100`,'This is the nameplate output/input ratio, not a measured seasonal AFUE. Use the manufacturer’s certified AFUE for seasonal comparisons. The difference does not separately identify each type of loss.');}},
{id:'airflow',name:'Sensible airflow',group:'AIR & DUCTS',icon:'air',desc:'Find airflow needed to carry a sensible heating or cooling load.',badge:'Standard-air estimate',sources:['ashrae'],fields:[field('load','Sensible load','BTU/h',24000,.001),field('dt','Air temperature difference','°F',20,.001,300),field('density','Air density','lb/ft³',.075,.001,1),field('cp','Air specific heat','BTU/(lb·°F)',.24,.001,10)],calculate:v=>{let c=60*v.density*v.cp,q=v.load/(c*v.dt);return result(q,'CFM',[['Air coefficient',c,''],['Sensible load',v.load,'BTU/h']],`CFM = Q ÷ (60 × ρ × cₚ × ΔT) = ${v.load} ÷ (${fmt(c,4)} × ${v.dt})`,'Sensible heat only. The default density and specific heat give the familiar 1.08 coefficient. Adjust properties for altitude and air conditions. This does not calculate latent load or outdoor-air code requirements.');}},
{id:'ach',name:'Air changes',group:'AIR & DUCTS',icon:'air',desc:'Convert measured airflow and room volume into air changes per hour.',badge:'Geometric calculation',sources:[],fields:[field('flow','Airflow','CFM',200,0),field('length','Room length','ft',20,.001),field('width','Room width','ft',15,.001),field('height','Ceiling height','ft',8,.001)],calculate:v=>{let vol=v.length*v.width*v.height;return result(v.flow*60/vol,'ACH',[['Room volume',vol,'ft³'],['Airflow',v.flow,'CFM']],`ACH = CFM × 60 ÷ volume = ${v.flow} × 60 ÷ ${fmt(vol)}`,'Counts theoretical volume exchanges. Recirculated airflow is not outdoor ventilation. This calculator does not select a required ACH or certify ventilation compliance.');}},
{id:'duct',name:'Duct velocity',group:'AIR & DUCTS',icon:'duct',desc:'Find velocity from airflow and a duct’s internal dimensions.',badge:'Continuity equation',sources:[],fields:[choice('shape','Duct shape',[['round','Round'],['rect','Rectangular']],'round'),field('flow','Airflow','CFM',400,0),field('diameter','Inside diameter','in',10,.001,1000),field('width','Inside width','in',12,.001,1000),field('height','Inside height','in',8,.001,1000)],calculate:v=>{let area=v.shape==='round'?Math.PI*(v.diameter/12)**2/4:v.width*v.height/144;return result(v.flow/area,'ft/min',[['Cross-sectional area',area,'ft²'],['Airflow',v.flow,'CFM']],`Velocity = CFM ÷ area = ${v.flow} ÷ ${fmt(area,4)}`,'Uses clear internal dimensions. Velocity alone does not size a duct system; pressure loss, fittings, available static pressure, leakage and sound limits must also be evaluated.');}},
{id:'water',name:'Hydronic heat',group:'HEATING & COOLING',icon:'water',desc:'Estimate heat transported by flowing water.',badge:'Water-only estimate',sources:[],fields:[field('flow','Water flow','US gpm',4,0),field('dt','Water temperature difference','°F',20,0,300)],calculate:v=>result(500*v.flow*v.dt,'BTU/h',[['Water flow',v.flow,'US gpm'],['Temperature difference',v.dt,'°F']],`Q ≈ 500 × GPM × ΔT = 500 × ${v.flow} × ${v.dt}`,'Uses approximately 8.33 lb/US gal and 1 BTU/(lb·°F), with 60 min/h. For liquid water only; glycol mixes and other temperatures need corrected density and specific heat.')},
{id:'electric',name:'Electrical power',group:'ENERGY & MATH',icon:'bolt',desc:'Calculate real electrical power from voltage and current.',badge:'Engineering formula',sources:[],fields:[choice('phase','Circuit type',[['dc','DC / resistive'],['single','Single-phase AC'],['three','Balanced three-phase AC']],'single'),field('volts','Voltage (line-to-line for 3φ)','V',240,.001,100000),field('amps','Current (line current for 3φ)','A',20,0,100000),field('pf','Power factor','0–1',1,.001,1)],calculate:v=>{let pf=v.phase==='dc'?1:v.pf,m=v.phase==='three'?Math.sqrt(3):1,p=m*v.volts*v.amps*pf;return result(p/1000,'kW',[['Real power',p,'W'],['Power factor used',pf,'']],`P = ${v.phase==='three'?'√3 × ':''}V × I${v.phase==='dc'?'':' × PF'} = ${fmt(p)} W`,'AC calculations assume sinusoidal voltage/current; three-phase assumes a balanced load. Electrical input is not a heat pump’s thermal output. This does not size wiring, breakers or disconnects.');}},
{id:'cost',name:'Operating cost',group:'ENERGY & MATH',icon:'cost',desc:'Estimate electricity use and cost for a run schedule.',badge:'Budget estimate',sources:[],fields:[field('power','Electrical input','kW',3.5,0,100000),field('hours','Hours per day','h',8,0,24),field('days','Number of days','days',30,1,3660,1),field('rate','Electricity rate','$/kWh',.15,0,100)],calculate:v=>{let e=v.power*v.hours*v.days;return result(e*v.rate,'USD',[['Energy consumed',e,'kWh'],['Operating time',v.hours*v.days,'h']],`Cost = kW × hours/day × days × $/kWh = ${v.power} × ${v.hours} × ${v.days} × ${v.rate}`,'Assumes constant input power during the entered run hours. Excludes demand charges, fixed fees, taxes and variable compressor speed. Enter electrical input kW, not thermal capacity.');}},
{id:'geometry',name:'Area & volume',group:'ENERGY & MATH',icon:'duct',desc:'Calculate rectangular floor area and room volume.',badge:'Geometry',sources:[],fields:[field('length','Length','ft',20,.001),field('width','Width','ft',15,.001),field('height','Height','ft',8,.001)],calculate:v=>result(v.length*v.width,'ft²',[['Room volume',v.length*v.width*v.height,'ft³'],['Floor perimeter',2*(v.length+v.width),'ft']],`Area = L × W; volume = L × W × H`,'For rectangular rooms. Divide irregular spaces into simpler shapes, calculate each, then add their areas or volumes.')}
];
const units={
'Power / capacity':{'BTU/h':.2930710701722222,'W':1,'kW':1000,'tons refrigeration':3516.852842066667},
'Temperature':{'°F':1,'°C':1,'K':1},'Temperature difference':{'Δ°F':5/9,'Δ°C':1,'ΔK':1},
'Airflow':{'CFM':.0004719474432,'L/s':.001,'m³/h':1/3600,'m³/s':1},
'Pressure':{'Pa':1,'kPa':1000,'psi':6894.757293168,'in. w.c. (conventional)':249.08891},
'Length':{'ft':.3048,'in':.0254,'m':1,'cm':.01,'mm':.001},
'Area':{'ft²':.09290304,'in²':.00064516,'m²':1},
'Volume':{'ft³':.028316846592,'m³':1,'L':.001,'US gal':.003785411784},
'Energy':{'BTU (IT)':1055.05585262,'kWh':3600000,'J':1,'therm (US)':105480400},

'Water flow':{'US gpm':.003785411784/60,'L/min':.001/60,'L/s':.001}
};
function convert(category,value,from,to){let x;if(category==='Temperature'){x=from==='°F'?(value-32)*5/9+273.15:from==='°C'?value+273.15:value;if(x<-.00000001)throw Error('Temperature cannot be below absolute zero.');return to==='°F'?(x-273.15)*9/5+32:to==='°C'?x-273.15:x;}return value*units[category][from]/units[category][to];}

// IAPWS saturation relations referenced by ASHRAE Fundamentals (2021), ch. 1, eqs. 5–6.
// Pressure in kPa; liquid water at/above 0 C, ice below 0 C.
function saturationPressure(t) {
  const T=t+273.15;
  if(t<0) { const q=T/273.16; return .611657*Math.exp((-21.2144006*q**.00333333333+27.3203819*q**1.20666667-6.1059813*q**1.70333333)/q); }
  const th=T-.23855557567849/(T-650.17534844798);
  const A=th*th+1167.0521452767*th-724213.16703206;
  const B=-17.073846940092*th*th+12020.82470247*th-3232555.0322333;
  const C=14.91510861353*th*th-4823.2657361591*th+405113.40542057;
  return 1000*(2*C/(-B+Math.sqrt(B*B-4*A*C)))**4;
}
function moistAir(t,rh,p) {
  const pv=saturationPressure(t)*rh/100;
  if(pv>=p) throw Error('Water vapor pressure must be below total pressure. Check temperature, humidity and barometric pressure.');
  const w=.621945*pv/(p-pv), h=1.006*t+w*(2501+1.86*t);
  let lo=-100,hi=t;
  if(pv<saturationPressure(lo))throw Error('Dew/frost point is below this calculator’s supported range.');
  for(let i=0;i<65;i++){const mid=(lo+hi)/2;if(saturationPressure(mid)>pv)hi=mid;else lo=mid;}
  return {pv,w,h,dew:(lo+hi)/2,volume:.287042*(t+273.15)*(1+1.607858*w)/p};
}

const pretty=(n,d=3)=>n!==0&&Math.abs(n)<.0001?n.toExponential(3):fmt(n,d);
const groups=['HEATING & COOLING','AIR & DUCTS','CODE & VENTILATION','REFRIGERATION','HYDRONICS','ENERGY & MATH'];
const groupNames={'HEATING & COOLING':'Heat & cooling','AIR & DUCTS':'Air & ducts','CODE & VENTILATION':'Code & ventilation',REFRIGERATION:'Refrigeration',HYDRONICS:'Hydronics','ENERGY & MATH':'Energy & math'};
const keywords={btu:'btu air conditioner capacity',humidity:'psychrometrics relative humidity rh dewpoint enthalpy moisture',totalheat:'enthalpy air conditioning total cooling',latent:'moisture grains dehumidification',rise:'furnace temperature rise delta t',roundduct:'duct sizing diameter',static:'tesp pressure drop',eer:'coefficient performance efficiency cop',targetach:'ventilation cfm air changes',fan:'rpm affinity speed horsepower',outdoorair:'imc 403 outdoor air vbz voz ventilation occupancy table 403.3.1.1 breathing zone',exhaust:'imc local exhaust toilet locker kitchen parking garage table 403'};
const essentials={btu:'Room AC estimate · 8 ft ceilings · not a Manual J load.',heat:'One assembly only; excludes other building loads.',furnace:'Nameplate output/input ratio; not seasonal AFUE.',airflow:'Sensible heat only; default air coefficient is 1.08.',ach:'Air changes do not establish outdoor ventilation compliance.',duct:'Velocity check; not a complete duct-system design.',water:'Approximate liquid water properties; not glycol.',electric:'Real electrical input; not heat-pump thermal output.',cost:'Constant power during the entered run hours.',geometry:'Rectangular dimensions only.',humidity:'Dew point above freezing; frost point below freezing.',superheat:'Use dew-point saturation temperature for blends.',subcooling:'Use bubble-point saturation temperature for blends.',totalheat:'Positive = cooling; match both enthalpy reference datums.',latent:'Positive = moisture removal; negative = moisture added.',fan:'Same fan, density and similar operating conditions.',targetach:'You supply the target ACH; no code target is selected.',mixed:'Dry-air mass share; equal specific heat; no condensation.',roundduct:'Geometric diameter; verify pressure, fittings and sound.',static:'Use signed readings at manufacturer-specified locations.',waterflow:'Use fluid properties at the actual concentration and temperature.',eer:'Same-condition ratio; not SEER2 or HSPF2.',rvalue:'Use effective assembly resistance, including thermal bridges.',rise:'Use furnace heat output, not rated fuel input.',outdoorair:'2024 IMC model-code rates · screening only · verify AHJ edition.',exhaust:'Exhaust column only · makeup and outdoor air are separate.'};
const values=Object.fromEntries(calculators.map(c=>[c.id,Object.fromEntries(c.fields.map(f=>[f.key,f.value]))]));
let active='btu',search='',currentResult=null,timer,conv={category:'Power / capacity',from:'BTU/h',to:'tons refrigeration',value:12000};
const routeValid=id=>calculators.some(c=>c.id===id)||id==='convert'||id==='references';
function inactiveField(id,key,v){
  if(id==='duct')return key==='diameter'?v.shape!=='round':['width','height'].includes(key)?v.shape==='round':false;
  if(id==='electric')return key==='pf'&&v.phase==='dc';
  if(id==='outdoorair'){
    const occ=imcOccupancies[v.occupancy];
    if(key==='population')return !occ||occ.density==null;
    if(key==='people')return !occ||(occ.density!=null?v.population==='density':occ.rp==null);
    return false;
  }
  if(id==='exhaust'){
    const row=imcExhaust[v.occupancy];
    if(!row)return false;
    if(key==='mode')return row.kind==='area';
    if(key==='area')return row.kind!=='area';
    if(key==='fixtures')return row.kind!=='fixture';
    if(key==='rooms')return row.kind!=='room';
    return false;
  }
  return false;
}
function evaluateCalculator(c,v){
  for(const f of c.fields){if(inactiveField(c.id,f.key,v))continue;if(f.options){if(!f.options.some(([key])=>key===v[f.key]))throw Error(`Choose a valid ${f.label.toLowerCase()}.`);continue;}
    const n=v[f.key];if(n===''||!Number.isFinite(n))throw Error(`Enter ${f.label.toLowerCase()}.`);
    if(n<f.min||n>f.max)throw Error(`${f.label}: enter ${fmt(f.min,6)} to ${fmt(f.max)} ${f.unit}.`);
    if(f.step===1&&!Number.isInteger(n))throw Error(`${f.label}: use a whole number.`);
  }
  const r=c.calculate(v);if(!Number.isFinite(r.value)||r.rows.some(x=>!Number.isFinite(x[1]))||r.extra.some(x=>!Number.isFinite(x[0])))throw Error('These inputs exceed the supported calculation range.');return r;
}
function menuOptions(){return groups.map(g=>`<optgroup label="${groupNames[g]}">${calculators.filter(c=>c.group===g).map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</optgroup>`).join('')+'<optgroup label="Reference"><option value="convert">Unit converter</option><option value="references">Codes & sources</option></optgroup>';}
function shell(){
  document.querySelector('#app').innerHTML=`<a class="skip" href="#main">Skip to calculator</a><header class="app-header"><a class="brand" href="#btu"><span class="brand-mark">${icon('air')}</span>HVAC Workbench</a><div class="header-actions"><button data-route="convert">Units</button><button data-route="references">Sources</button><button id="print" class="print-button" aria-label="Print calculation">${icon('print')}<span>Print</span></button></div></header><div class="layout"><aside class="sidebar"><div class="search-wrap">${icon('search')}<input type="search" id="calculator-search" aria-label="Search calculators" placeholder="Find a calculator" autocomplete="off"></div><nav id="nav" aria-label="Calculators"></nav><div class="sidebar-foot">${calculators.length} calculators · ${Object.keys(units).length} unit groups</div></aside><div class="mobile-tools"><label class="sr-only" for="mobile-calc">Choose calculator</label><select id="mobile-calc">${menuOptions()}</select></div><main id="main" tabindex="-1"></main></div>`;
  document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>navigate(b.dataset.route));
  document.querySelector('#mobile-calc').onchange=e=>navigate(e.target.value);
  const input=document.querySelector('#calculator-search');input.oninput=e=>{search=e.target.value;renderNav();};
  input.onkeydown=e=>{if(e.key==='Escape'){input.value='';search='';renderNav();}if(e.key==='Enter'){const first=document.querySelector('[data-nav]');if(first)navigate(first.dataset.nav);}};
  let openBeforePrint=[];document.querySelector('#print').onclick=()=>{openBeforePrint=[...document.querySelectorAll('main details')].map(el=>[el,el.open]);openBeforePrint.forEach(([el])=>el.open=true);window.print();};
  window.addEventListener('afterprint',()=>openBeforePrint.forEach(([el,open])=>el.open=open));renderNav();
}
function renderNav(){const q=search.trim().toLowerCase();const matches=calculators.filter(c=>(c.name+' '+c.desc+' '+(keywords[c.id]||'')).toLowerCase().includes(q));document.querySelector('#nav').innerHTML=groups.map(g=>{const list=matches.filter(c=>c.group===g);return list.length?`<section class="nav-group"><h2>${groupNames[g]}</h2>${list.map(c=>`<button data-nav="${c.id}" class="nav-item ${c.id===active?'active':''}" ${c.id===active?'aria-current="page"':''}>${c.name}</button>`).join('')}</section>`:'';}).join('')+(!matches.length?'<p class="nav-empty" role="status">No calculators found.</p>':'');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));}
function navigate(id){if(!routeValid(id))return;clearTimeout(timer);active=id;location.hash=id;render();window.scrollTo({top:0,behavior:'instant'});}
function heading(title,desc,tag){return `<div class="page-title"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>${tag?`<span class="tag">${esc(tag)}</span>`:''}</div>`;}
function links(ids){return ids.length?`<div class="source-links">${ids.map(id=>`<a href="${sourceLinks[id][1]}" target="_blank" rel="noopener noreferrer">${esc(sourceLinks[id][0])} ↗</a>`).join('')}</div>`:'<p class="method-note">Derived from the displayed mathematical relationship. No code threshold is applied.</p>';}
function fieldHTML(f,v){return `<div class="field" data-field="${f.key}"><label for="${f.key}">${esc(f.label)}</label>${f.options?`<select id="${f.key}" name="${f.key}">${f.options.map(([k,label])=>`<option value="${k}" ${v===k?'selected':''}>${esc(label)}</option>`).join('')}</select>`:`<div class="input-wrap"><input id="${f.key}" name="${f.key}" type="number" inputmode="${f.min<0?'text':'decimal'}" value="${v}" min="${f.min}" max="${f.max}" step="${f.step}" aria-describedby="${f.key}-unit" required><span id="${f.key}-unit">${esc(f.unit)}</span></div>`}</div>`;}
function render(){renderNav();document.querySelector('#mobile-calc').value=active;const main=document.querySelector('main');if(active==='references'){main.innerHTML=references();currentResult=null;document.querySelector('#print').disabled=false;return;}if(active==='convert'){main.innerHTML=converter();bindConverter();return;}const c=calculators.find(x=>x.id===active),adv=advancedFields[active]||[],normal=c.fields.filter(f=>!adv.includes(f.key));
  main.innerHTML=heading(active==='btu'?'BTU calculator':c.name,c.desc,c.badge)+`<div class="workspace"><section class="panel input-panel"><div class="panel-head"><h2>Inputs</h2><button id="reset" type="button" class="text-button">Reset</button></div><form id="calc-form" novalidate><div class="fields">${normal.map(f=>fieldHTML(f,values[active][f.key])).join('')}</div>${adv.length?`<details class="advanced" ${adv.some(k=>values[active][k]!==c.fields.find(f=>f.key===k).value)?'open':''}><summary>${active==='waterflow'?'Fluid properties':'Air properties'}</summary><div class="fields">${c.fields.filter(f=>adv.includes(f.key)).map(f=>fieldHTML(f,values[active][f.key])).join('')}</div></details>`:''}<div class="form-status">Updates as you type</div><div id="error" role="alert"></div></form></section><section class="panel result-panel" id="result" aria-label="Calculation result"></section></div><div class="workspace-foot"><span>${essentials[active]}</span></div>`;
  const form=document.querySelector('#calc-form');form.onsubmit=e=>{e.preventDefault();clearTimeout(timer);readForm(c);run(c);};
  form.oninput=()=>{readForm(c);conditionalFields(c);clearTimeout(timer);run(c);};
  form.onchange=()=>{readForm(c);conditionalFields(c);clearTimeout(timer);run(c);};
  document.querySelector('#reset').onclick=()=>{values[active]=Object.fromEntries(c.fields.map(f=>[f.key,f.value]));render();};conditionalFields(c);run(c);
}
function readForm(c){for(const f of c.fields){const el=document.getElementById(f.key);values[active][f.key]=f.options?el.value:el.value===''?'':Number(el.value);}}
function conditionalFields(c){for(const f of c.fields){const disabled=inactiveField(active,f.key,values[active]);document.querySelector(`[data-field="${f.key}"]`).hidden=disabled;document.getElementById(f.key).disabled=disabled;}}
function run(c){const previous=document.querySelector('#method')?.open||false;try{const r=evaluateCalculator(c,values[active]);currentResult=r;document.querySelector('#print').disabled=false;document.querySelector('#error').textContent='';document.querySelector('#result').innerHTML=`<div class="result-hero"><div class="result-label">${c.id==='btu'?'Estimated cooling capacity':c.id==='humidity'?'Dew / frost point':c.id==='outdoorair'?'Zone outdoor airflow Voz':c.id==='exhaust'?'Required local exhaust':'Result'}</div><div class="result-number" role="status" aria-live="polite">${pretty(r.value)}<small>${esc(r.unit)}</small></div>${r.extra.length?`<div class="equivalents">${r.extra.map(([n,u])=>`<span><b>${pretty(n)}</b> ${esc(u)}</span>`).join('')}</div>`:''}</div><div class="result-rows">${r.rows.map(([l,n,u])=>`<div class="result-row"><span>${esc(l)}</span><span>${pretty(n,4)} <small>${esc(u)}</small></span></div>`).join('')}</div>${['superheat','subcooling'].includes(active)&&r.value<0?'<p class="negative-note">Negative difference. Verify the readings; no positive '+(active==='superheat'?'superheat':'subcooling')+' is indicated.</p>':''}<details id="method" class="method" ${previous?'open':''}><summary>Formula & assumptions</summary><div class="method-body"><div class="formula">${esc(r.formula)}</div><p class="method-note">${esc(r.note)}</p>${links(c.sources)}</div></details>`;}catch(e){currentResult=null;document.querySelector('#print').disabled=true;document.querySelector('#result').innerHTML='<div class="empty-result"><span>Result</span><strong>—</strong><p>Complete the inputs to calculate.</p></div>';document.querySelector('#error').textContent=e.message;}}
function unitOptions(selected){return Object.keys(units[conv.category]).map(k=>`<option ${k===selected?'selected':''}>${esc(k)}</option>`).join('');}
function converter(){return heading('Unit converter','Convert HVAC measurements without losing the units.','16 measurement groups')+`<div class="workspace"><section class="panel input-panel"><div class="fields"><div class="field full"><label for="category">Measurement</label><select id="category">${Object.keys(units).map(k=>`<option ${conv.category===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div><div class="field full"><label for="convert-value">Value</label><div class="input-wrap"><input type="number" id="convert-value" step="any" inputmode="decimal" value="${conv.value}" required></div></div><div class="field"><label for="from-unit">From</label><select id="from-unit">${unitOptions(conv.from)}</select></div><div class="field"><label for="to-unit">To</label><select id="to-unit">${unitOptions(conv.to)}</select></div></div><div class="converter-foot"><button id="swap" class="text-button">Swap units ⇄</button><span>Updates as you type</span></div><div id="conversion-error" role="alert"></div></section><section class="panel result-panel"><div class="result-hero"><div class="result-label">Converted value</div><div class="result-number" id="conversion-result" role="status" aria-live="polite"></div></div><div class="conversion-equation" id="conversion-formula"></div><p class="method-note converter-note" id="conversion-note"></p><details class="method"><summary>References</summary><div class="method-body">${links(['conversion','nist'])}</div></details></section></div>`;}
function bindConverter(){document.querySelector('#category').onchange=e=>{conv.category=e.target.value;[conv.from,conv.to]=Object.keys(units[conv.category]);render();};document.querySelector('#convert-value').oninput=e=>{conv.value=e.target.value;updateConversion();};document.querySelector('#from-unit').onchange=e=>{conv.from=e.target.value;updateConversion();};document.querySelector('#to-unit').onchange=e=>{conv.to=e.target.value;updateConversion();};document.querySelector('#swap').onclick=()=>{[conv.from,conv.to]=[conv.to,conv.from];document.querySelector('#from-unit').value=conv.from;document.querySelector('#to-unit').value=conv.to;updateConversion();};updateConversion();}
function updateConversion(){try{if(String(conv.value).trim()===''||!Number.isFinite(Number(conv.value)))throw Error('Enter a numeric value.');const v=Number(conv.value),n=convert(conv.category,v,conv.from,conv.to);if(!Number.isFinite(n))throw Error('Value exceeds the supported range.');document.querySelector('#print').disabled=false;document.querySelector('#conversion-result').innerHTML=`${pretty(n,7)}<small>${esc(conv.to)}</small>`;document.querySelector('#conversion-formula').textContent=`${pretty(v,7)} ${conv.from} = ${pretty(n,7)} ${conv.to}`;const notes={Temperature:'For a temperature rise or drop, select Temperature difference; absolute temperatures include a scale offset.','Temperature difference':'A change of 1 °C equals a change of 1.8 °F. No 32-degree offset is applied.','Power / capacity':'Thermal kW and electrical input kW describe different quantities, even though they use the same unit.',Pressure:'Conventional inches of water. Gauge-to-absolute pressure needs a reference pressure and is not performed here.','Specific enthalpy':'Unit conversion only. Enthalpy reference datums are not changed; values from different charts may use different zero points.','Humidity ratio':'Moisture mass per dry-air mass, not relative humidity.','Thermal resistance':'Converts area-normalized R-value, not total resistance in K/W.'};document.querySelector('#conversion-note').textContent=notes[conv.category]||'US liquid gallons and US therm; International Table BTU. Full precision is retained until display.';document.querySelector('#conversion-error').textContent='';}catch(e){document.querySelector('#print').disabled=true;document.querySelector('#conversion-result').textContent='—';document.querySelector('#conversion-formula').textContent='';document.querySelector('#conversion-note').textContent='';document.querySelector('#conversion-error').textContent=e.message;}}
function references(){const entries=[
['Code tools','ICC compliance calculators','Official code-specific tools. This page was access-restricted during research; its rules have not been reproduced.','https://codes.iccsafe.org/compliance-calculators/'],
['Fire safety','2024 IFC','Fire-code reference. The IFC does not supply every HVAC engineering formula.',sourceLinks.ifc[1]],
['Mechanical','2024 IMC','Check the adopted edition, occupancy, exceptions and local amendments for ventilation and mechanical systems.',sourceLinks.imc[1]],
['Ventilation','2024 IMC · §403 / Table 403.3.1.1','Outdoor-air and local-exhaust screening tools use model-code rates (Equations 4-1 and 4-2). Confirm AHJ edition and amendments; not a compliance certificate.',sourceLinks.imc[1]],
['Fuel gas','2024 IFGC','Reference for gas installations, combustion air and venting. No gas sizing or combustion-air compliance tool is implemented.',sourceLinks.ifgc[1]],
['Energy','2024 IECC','Energy-code reference; this app does not certify building energy compliance.',sourceLinks.iecc[1]],
['Room cooling','ENERGY STAR','Floor-area table plus sun, occupancy and kitchen adjustments. 100–2,500 ft², 8 ft ceiling basis; shared boundaries use the higher band.',sourceLinks.energy[1]],
['Detailed loads','ACCA Manual J','Residential load-design reference. Room estimates and single-assembly heat transfer do not implement Manual J.',sourceLinks.manual[1]],
['Duct design','ACCA Manual D','Duct design includes friction, fittings, available static pressure, sound and balancing. Our geometry tools do not implement Manual D.',sourceLinks.manuald[1]],
['Moist air','ASHRAE Fundamentals 2021 · Ch. 1','Humidity ratio, moist-air enthalpy and IAPWS saturation relations. Dew/frost point is obtained by numerical inversion. Ideal moist-air estimates.',sourceLinks.ashrae[1]],
['Refrigeration','Copeland · Refrigerants with glide','Dew-point saturation for superheat and bubble-point saturation for subcooling. Use the correct refrigerant chart and manufacturer targets.',sourceLinks.copeland[1]],
['Units','NIST SP 811','SI unit definitions and conversion conventions. Conversion does not reconcile different enthalpy reference datums.',sourceLinks.nist[1]],
['Product reference','Calculator.net · BTU calculator','Reference for the room-calculation input flow. Our estimate uses the published ENERGY STAR method.',sourceLinks.calc[1]],
['Product reference','Calculator.net · Conversion calculator','Reference for the familiar value/from/to conversion flow.',sourceLinks.conversion[1]]];
return heading('Codes & sources','Open the source behind a calculation.','Reference editions')+`<p class="reference-intro">The 2024 code links are reference editions. Confirm your jurisdiction’s adopted codes and amendments. Calculators are estimates or engineering relationships, not compliance decisions.</p><div class="reference-list">${entries.map(([topic,title,description,url])=>`<article class="reference-row"><div class="ref-topic">${esc(topic)}</div><div><a href="${url}" target="_blank" rel="noopener noreferrer">${esc(title)} ↗</a><p>${esc(description)}</p></div></article>`).join('')}</div><p class="smallprint">Reviewed September 11, 2026. No full code text or proprietary calculator algorithms are reproduced. Fan laws use the standard same-geometry affinity relationships; measurement and geometry tools show their mathematical derivations.</p>`;}
shell();const initial=location.hash.slice(1);if(routeValid(initial))active=initial;render();window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==active&&routeValid(id)){active=id;render();}});
</script></body></html>
