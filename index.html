{id:'btu',name:'Room cooling',group:'HEATING & COOLING',icon:'snow',desc:'Estimate the cooling a room air conditioner needs.',badge:'Room estimate',sources:['energy','calc','manual'],fields:[field('area','Floor area','ft²',500,100,2500),field('height','Ceiling height','ft',8,1,30),field('people','Regular occupants','people',2,0,1000,1),choice('sun','Sun exposure',[['normal','Typical'],['shade','Heavily shaded'],['sunny','Very sunny']],'normal'),choice('room','Room type',[['room','Living space'],['kitchen','Kitchen']],'room')],calculate:v=>{if(v.height!==8)throw Error('This table is based on an 8 ft ceiling. Use a detailed load calculation for other ceiling heights.');const base=BANDS.find(([end],i)=>v.area<end||i===BANDS.length-1)[1];const sun=base*({normal:0,shade:-.1,sunny:.1}[v.sun]);const people=Math.max(0,v.people-2)*600;const kitchen=v.room==='kitchen'?4000:0;const total=base+sun+people+kitchen;return result(total,'BTU/h',[['Floor-area table',base,'BTU/h'],['Sun exposure',sun,'BTU/h'],['Additional occupants',people,'BTU/h'],['Kitchen adjustment',kitchen,'BTU/h']],`${fmt(base)} ${sun<0?'−':'+'} ${fmt(Math.abs(sun))} + ${fmt(people)} + ${fmt(kitchen)} = ${fmt(total)} BTU/h`,'Room AC screening estimate. Insulation, local climate, glazing, humidity, and duct losses are not modeled. Whole-home equipment selection needs a detailed load calculation.',[[total/12000,'tons cooling'],[total/3412.141633,'kW thermal']]);}},
{id:'heat',name:'Heat transfer',group:'HEATING & COOLING',icon:'heat',desc:'Find steady heat flow through one building assembly.',badge:'Assembly heat flow',sources:['manual'],fields:[field('u','Assembly U-factor','BTU/(h·ft²·°F)',.06,.000001,1000),field('area','Assembly area','ft²',1000,.001),field('inside','Indoor temperature','°F',70,-459.66,1000),field('outside','Outdoor temperature','°F',20,-459.66,1000)],calculate:v=>{let dt=Math.abs(v.inside-v.outside),q=v.u*v.area*dt;return result(q,'BTU/h',[['Temperature difference',dt,'°F'],['Assembly area',v.area,'ft²']],`Q = U × A × |ΔT| = ${v.u} × ${v.area} × ${fmt(dt)}`,'One assembly only. Use the whole-assembly U-factor, including layers and thermal bridges. Excludes solar gain, internal loads, moisture and air leakage. Heat flows from the warmer side to the cooler side.');}},
{id:'furnace',name:'Furnace efficiency',group:'HEATING & COOLING',icon:'heat',desc:'Compare rated heat output with rated fuel input.',badge:'Nameplate ratio',sources:[],fields:[field('input','Rated input','BTU/h',80000,.001),field('output','Rated output','BTU/h',74000,0)],calculate:v=>{if(v.output>v.input)throw Error('For a fuel-burning furnace, rated output cannot exceed rated input. Check the nameplate values.');return result(v.output/v.input*100,'%', [['Rated fuel input',v.input,'BTU/h'],['Rated heat output',v.output,'BTU/h'],['Input − output',v.input-v.output,'BTU/h']],`Efficiency = output ÷ input × 100 = ${v.output} ÷ ${v.input} × 100`,'This is the nameplate output/input ratio, not a measured seasonal AFUE. Use the manufacturer’s certified AFUE for seasonal comparisons. The difference does not separately identify each type of loss.');}},

function convert(category,value,from,to){let x;if(category==='Temperature'){x=from==='°F'?(value-32)*5/9+273.15:from==='°C'?value+273.15:value;if(x<-.00000001)throw Error('Temperature cannot be below absolute zero.');return to==='°F'?(x-273.15)*9/5+32:to==='°C'?x-273.15:x;}return value*units[category][from]/units[category][to];}

// IAPWS saturation relations referenced by ASHRAE Fundamentals (2021), ch. 1, eqs. 5–6.
// Pressure in kPa; liquid water at/above 0 C, ice below 0 C.
function saturationPressure(t) {
  const T=t+273.15;
  if(t<0) { const q=T/273.16; return .611657*Math.exp((-21.2144006*q**.00333333333+27.3203819*q**1.20666667-6.1059813*q**1.70333333)/q); }
  const th=T-.23855557567849/(T-650.17534844798);
  const A=th*th+1167.0521452767*th-724213.16703206;
  const B=-17.073846940092*th*th+12020.82470247*th-3232555.0322333;
  const C=14.91510861353*th*th-4823.2657361591*th+405113.40542057;
  return 1000*(2*C/(-B+Math.sqrt(B*B-4*A*C)))**4;
}
function moistAir(t,rh,p) {
  const pv=saturationPressure(t)*rh/100;
  if(pv>=p) throw Error('Water vapor pressure must be below total pressure. Check temperature, humidity and barometric pressure.');
  const w=.621945*pv/(p-pv), h=1.006*t+w*(2501+1.86*t);
  let lo=-100,hi=t;
  if(pv<saturationPressure(lo))throw Error('Dew/frost point is below this calculator’s supported range.');
  for(let i=0;i<65;i++){const mid=(lo+hi)/2;if(saturationPressure(mid)>pv)hi=mid;else lo=mid;}
  return {pv,w,h,dew:(lo+hi)/2,volume:.287042*(t+273.15)*(1+1.607858*w)/p};
}

calculators.push(
{id:'outdoorair',name:'Outdoor air',group:'CODE & VENTILATION',icon:'air',desc:'Screen breathing-zone and zone outdoor airflow from model ventilation rates.',badge:'Ventilation screen',sources:['imc'],fields:[
choice('occupancy','Occupancy classification',occOptions,'office','Occupiable space (IMC 2024 §202): enclosed space intended for human activities; excludes storage, equipment, or similar rooms occupied only briefly.'),
field('area','Zone floor area Az','ft²',2000,.001,1e9,'any','Net occupiable floor area Az (IMC 2024 §202): floor area defined by the inside surfaces of walls; do not deduct furniture, racks, or other temporary or permanent obstructions. Exclude shafts, column enclosures, and inaccessible unoccupiable areas.'),
choice('population','Zone population Pz',[['density','Default from table density × Az / 1000'],['manual','Enter population manually']],'density','Default Pz uses Table 403.3.1.1 occupant density × Az / 1000 unless an approved alternate density applies.'),
field('people','Zone population Pz','people',10,0,100000),
choice('ez','Air distribution effectiveness Ez',ezOptions,'cool','Breathing zone (IMC 2024 §202): 3–72 in. above the floor and more than 2 ft from walls or fixed air-conditioning equipment. Ez (Table 403.3.1.1.1.2) adjusts outdoor air delivered to that zone.'),
choice('ezMode','Ez source',[['table','Use selected air-distribution configuration'],['override','Override Ez manually']],'table'),
field('ezOverride','Ez override','Ez',1,.1,2)
],calculate:v=>{
  const occ=imcOccupancies[v.occupancy];if(!occ)throw Error('Choose a valid occupancy classification.');
  const ezEntry=imcEz[v.ez];if(!ezEntry)throw Error('Choose a valid air distribution effectiveness.');
  const Ez=v.ezMode==='override'?v.ezOverride:ezEntry[1];
  if(v.ezMode==='override'&&(!Number.isFinite(Ez)||Ez<=0))throw Error('Ez override must be greater than zero.');
  const hasPeople=occ.rp!=null,hasArea=occ.ra!=null;
  if(!hasPeople&&!hasArea)throw Error('This occupancy has no outdoor-air rates in the embedded table subset.');
  let Pz=0;
  if(hasPeople){
    if(occ.density!=null&&v.population==='density')Pz=occ.density*v.area/1000;
    else{
      if(v.people===''||!Number.isFinite(v.people))throw Error('Enter zone population Pz.');
      Pz=v.people;
    }
  }
  const Rp=occ.rp??0,Ra=occ.ra??0,peopleOA=Rp*Pz,areaOA=Ra*v.area,Vbz=peopleOA+areaOA,Voz=Vbz/Ez;
  const notes=occ.notes||[],recircBanned=notes.includes('b')||notes.includes('g');

  if(occ.density!=null)rows.push(['Occupant density',occ.density,'#/1000 ft²']);
  if(hasPeople){rows.push(['People outdoor-air rate Rp',Rp,'cfm/person']);rows.push(['Zone population Pz',Pz,'people']);rows.push(['People outdoor air Rp × Pz',peopleOA,'cfm']);}
  if(hasArea){rows.push(['Area outdoor-air rate Ra',Ra,'cfm/ft²']);rows.push(['Area outdoor air Ra × Az',areaOA,'cfm']);}
  rows.push(['Breathing-zone outdoor air Vbz',Vbz,'cfm'],['Air distribution effectiveness Ez',Ez,v.ezMode==='override'?'(override)':'']);
  if(occ.exhaust!=null)rows.push(['Exhaust required (table)',occ.exhaust,'cfm/ft²']);
  if(recircBanned)rows.push(['Recirculation from space banned',1,'yes (Note b/g)']);
  const cite='Citations: 2024 IMC §403.3.1.1 (Table), §403.3.1.1.1.1 Eq. 4-1, §403.3.1.1.1.2 (Ez), §403.3.1.1.1.3 Eq. 4-2. Jurisdiction: IMC §101.1 — confirm your adopted edition and amendments; these are model 2024 IMC values for screening only.';
  return result(Voz,'cfm',rows,
    `Vbz = Rp×Pz + Ra×Az = ${Rp}×${fmt(Pz,4)} + ${Ra}×${fmt(v.area)} = ${fmt(Vbz,4)} cfm; Voz = Vbz/Ez = ${fmt(Vbz,4)}/${Ez} = ${fmt(Voz,4)} cfm`,
    `${cite} Air distribution: ${ezEntry[0]}. Outdoor air (IMC 2024 §202): air from outdoors, not previously circulated through the system. Rates assume no smoking except smoking lounges. Missing Rp or Ra treated as 0. Not a compliance certificate.${occ.exhaustNote?` ${occ.exhaustNote}.`:''}${recircBanned?' Recirculation from this occupancy is restricted by Table notes b/g.':''}`,
    [[Vbz,'cfm Vbz'],[peopleOA,'cfm people OA'],[areaOA,'cfm area OA']]);
}},
{id:'exhaust',name:'Local exhaust',group:'CODE & VENTILATION',icon:'air',desc:'Estimate local exhaust for toilets, kitchens, garages, and similar spaces.',badge:'Exhaust screen',sources:['imc'],fields:[
choice('occupancy','Exhaust occupancy',exhaustOptions,'publictoilet'),
choice('mode','Exhaust operation',[['continuous','Continuous while occupied (lower rate)'],['intermittent','Intermittent (higher rate)']],'continuous'),
field('area','Floor area','ft²',400,.001),
field('fixtures','Water closets / urinals','fixtures',3,1,500,1),
field('rooms','Number of rooms','rooms',1,1,500,1)
],calculate:v=>{

  `Model-code screening from 2024 IMC Table 403.3.1.1 exhaust column (IMC §101.1 — verify your adopted edition). ${row.note||'Verify table notes and amendments.'} Makeup / transfer air and outdoor-air requirements are separate (see Outdoor air calculator). Appendices are not applied unless your AHJ adopts them. Fuel-gas appliances and venting are IFGC scope (IMC §101.2), not this tool. This does not certify code compliance.`);
}}

function freeAreaFraction(v){
  if(v.louver==='metal')return .75;
  if(v.louver==='wood')return .25;
  return v.freeAreaPct/100;
}
function outdoorNetEach(method,total,sumConn){
  if(method==='outdoor_two_vertical')return {netEach:total/4000,netTotal:null,openings:2,location:'One opening within 12 in of the top and one within 12 in of the bottom of the enclosure',minDim:3,cite:'IFGC §304.6.1'};
  if(method==='outdoor_two_horizontal')return {netEach:total/2000,netTotal:null,openings:2,location:'One opening within 12 in of the top and one within 12 in of the bottom of the enclosure',minDim:3,cite:'IFGC §304.6.1'};
  if(method==='outdoor_one')return {netEach:null,netTotal:Math.max(total/3000,sumConn),openings:1,location:'Opening within 12 in of the top of the enclosure; communicate directly outdoors or through vertical / horizontal ducts',minDim:3,cite:'IFGC §304.6.2'};
  return null;
}
calculators.push(
{id:'combustionair',name:'Combustion air',group:'CODE & FUEL GAS',icon:'heat',desc:'Size combustion-air openings and indoor volume for fuel-burning appliances.',badge:'Combustion air',sources:['ifgc'],fields:[
field('inputOther','Draft-hood / other appliance input','Btuh',100000,0),
field('inputFan','Fan-assisted appliance input','Btuh',0,0),
field('sumConnectors','Sum of vent connector areas','in²',0,0,'any','Sum all appliance vent-connector free areas when using the one-opening outdoor method (§304.6.2).'),
choice('method','Combustion-air method',combustionMethods,'outdoor_two_vertical'),
choice('directVent','Direct-vent or manufacturer combustion-air path',[['no','No — apply §304 opening / volume methods'],['yes','Yes — manufacturer instructions (IFGC 304.1)']],'no','If yes, opening tables are not applied (IFGC §304.1).'),
field('volume','Enclosure volume','ft³',5000,.001),
field('ach','Measured ACH','ACH',.35,.001,10,'any','Clamped to ≤0.60 for KAIR (§304.5.2).'),
field('availableVolume','Available indoor volume','ft³',3000,0,'any','For combination method: indoor volume that can be counted toward the required volume.'),
choice('outdoorSub','Outdoor openings for combination',outdoorSubMethods,'outdoor_two_vertical'),
choice('louver','Louver / grille free area',[['metal','Metal louvers · 75% free'],['wood','Wood louvers · 25% free'],['custom','Custom free-area percent']],'metal'),
field('freeAreaPct','Custom free-area','%',75,.1,100)
],calculate:v=>{
  const ahj='Model 2024 IFGC (confirm your adopted edition and amendments). Screening tool only — not a compliance certificate.';
  if(v.directVent==='yes'){
    return result(0,'—',[
      ['Use manufacturer instructions (IFGC 304.1)',1,'yes'],
      ['Opening tables applied',0,'no']
    ],'Direct-vent appliances or manufacturer-specified combustion-air path → do not run §304.5 / §304.6 opening tables.',
    `Use manufacturer instructions (IFGC 304.1). ${ahj}`,[],['IFGC §304.1']);
  }
  const Iother=v.inputOther,Ifan=v.inputFan,total=Iother+Ifan;
  if(total<=0)throw Error('Enter at least one appliance input (Btuh).');
  const sumConn=v.sumConnectors,frac=freeAreaFraction(v);
  if(!(frac>0&&frac<=1))throw Error('Free-area fraction must be greater than 0 and at most 100%.');
  const rows=[['Total appliance input',total,'Btuh'],['Draft-hood / other input',Iother,'Btuh'],['Fan-assisted input',Ifan,'Btuh']];
  let hero=0,unit='in²',formula='',extra=[],requiredV=null,volumeOk=null,net=null,netEach=null,openings=null,location='',minDim=null,cfm=null,gross=null,cites=[];

  if(v.method==='indoor_volume_standard'){
    requiredV=total/1000*50;volumeOk=v.volume>=requiredV?1:0;
    hero=requiredV;unit='ft³ required';
    rows.push(['Required volume V',requiredV,'ft³'],['Enclosure volume',v.volume,'ft³'],['Volume OK',volumeOk,volumeOk?'yes':'no — provide openings or more volume']);
    formula=`V = (I/1000)×50 = (${fmt(total)}/1000)×50 = ${fmt(requiredV)} ft³`;
    cites=['IFGC §304.5.1'];
  }else if(v.method==='indoor_volume_kair'){
    const ACH=Math.min(v.ach,.6);
    const Vother=(21/ACH)*(Iother/1000),Vfan=(15/ACH)*(Ifan/1000);
    requiredV=Vother+Vfan;volumeOk=v.volume>=requiredV?1:0;
    hero=requiredV;unit='ft³ required';
    rows.push(['ACH used (clamped ≤0.60)',ACH,'ACH'],['Required volume · other',Vother,'ft³'],['Required volume · fan-assisted',Vfan,'ft³'],['Required volume V',requiredV,'ft³'],['Enclosure volume',v.volume,'ft³'],['Volume OK',volumeOk,volumeOk?'yes':'no — provide openings or more volume']);
    formula=`ACH=min(${v.ach},0.60)=${fmt(ACH,4)}; Vother=(21/ACH)×(Iother/1000); Vfan=(15/ACH)×(Ifan/1000); V=${fmt(requiredV)} ft³`;
    cites=['IFGC §304.5.2'];
  }else if(v.method==='mechanical'){
    cfm=.35*(total/1000);hero=cfm;unit='cfm';
    rows.push(['Mechanical combustion air',cfm,'cfm']);
    formula=`cfm = 0.35 × (I/1000) = 0.35 × (${fmt(total)}/1000) = ${fmt(cfm)} cfm`;

  }else if(v.method==='indoor_openings_same_story'){
    netEach=Math.max(total/1000,100);net=netEach;openings=2;minDim=3;
    location='Two permanent openings to an adjacent interior space on the same story; one within 12 in of the top and one within 12 in of the bottom';
    hero=netEach;unit='in² each';gross=netEach/frac;
    rows.push(['Net free area each',netEach,'in²'],['Openings',openings,''],['Min dimension',minDim,'in'],['Free-area fraction',frac,''],['Gross opening each',gross,'in²']);
    formula=`net_each = max(I/1000, 100) = max(${fmt(total/1000)}, 100) = ${fmt(netEach)} in²; gross = net / free_area`;
    cites=['IFGC §304.5.3.1'];
  }else if(v.method==='indoor_openings_diff_story'){
    net=total/1000*2;openings=1;minDim=3;
    location='Openings communicating with the outdoors through vertical ducts or to spaces on another story; see IFGC for path details';
    hero=net;unit='in² total';gross=net/frac;
    rows.push(['Net free area total',net,'in²'],['Openings (paths)',openings,''],['Min dimension',minDim,'in'],['Free-area fraction',frac,''],['Gross opening',gross,'in²']);
    formula=`net_total = (I/1000)×2 = (${fmt(total)}/1000)×2 = ${fmt(net)} in²; gross = net / free_area`;
    cites=['IFGC §304.5.3.2'];
  }else if(v.method==='combination'){
    requiredV=total/1000*50;
    const avail=v.availableVolume;
    const factor=Math.min(1,Math.max(0,1-avail/requiredV));
    const full=outdoorNetEach(v.outdoorSub,total,sumConn);if(!full)throw Error('Choose a valid outdoor sub-method.');
    volumeOk=avail>=requiredV?1:0;
    location=full.location;minDim=full.minDim;openings=full.openings;cites=['IFGC §304.7',full.cite];
    rows.push(['Required indoor volume',requiredV,'ft³'],['Available indoor volume',avail,'ft³'],['Outdoor fraction',factor,''],['Volume fully satisfied indoors',volumeOk,volumeOk?'yes':'no']);
    if(full.netEach!=null){
      netEach=full.netEach*factor;net=netEach;hero=netEach;unit='in² each outdoor';gross=factor>0?netEach/frac:0;
      rows.push(['Full outdoor net each',full.netEach,'in²'],['Outdoor net each × factor',netEach,'in²']);
      formula=`Vreq=(I/1000)×50; factor=clamp(1−avail/Vreq,0,1)=${fmt(factor,4)}; outdoor_net_each=full_304_6_net×factor=${fmt(full.netEach)}×${fmt(factor,4)}=${fmt(netEach)} in²`;
    }else{
      net=full.netTotal*factor;hero=net;unit='in² outdoor';gross=factor>0?net/frac:0;
      rows.push(['Full outdoor net',full.netTotal,'in²'],['Outdoor net × factor',net,'in²']);

    }

  }else{
    const full=outdoorNetEach(v.method,total,sumConn);if(!full)throw Error('Choose a valid combustion-air method.');
    location=full.location;minDim=full.minDim;openings=full.openings;cites=[full.cite];
    if(full.netEach!=null){
      netEach=full.netEach;net=netEach;hero=netEach;unit='in² each';gross=netEach/frac;
      rows.push(['Net free area each',netEach,'in²']);
      formula=`net_each = I / ${v.method==='outdoor_two_vertical'?4000:2000} = ${fmt(total)} / ${v.method==='outdoor_two_vertical'?4000:2000} = ${fmt(netEach)} in²; gross = net / free_area`;
    }else{
      net=full.netTotal;hero=net;unit='in²';gross=net/frac;

// Source screen: Phoenix Fuel Gas Code 2024 / IFGC 2024 Table 308.2. All digitized cells are unverified examples.
// Grid: 8 protection types × 5 required-clearance columns (36/18/12/9/6) × 2 orientations (Above Col.1 / Sides&rear Col.2).
// Linear interpolation between listed columns only. No extrapolation below 6 in. tool limit above 36 in.
// Masonry rows 1 & 4: Above = N/A. UL 1618 = listing path only (no invented reduced inches).
const IFGC308_COLS=[36,18,12,9,6];
const IFGC308_ROWS=[
  {id:'1',label:'1. 3½-in masonry wall without ventilated airspace',masonry:true,above:[null,null,null,null,null],sides:[24,12,9,6,5]},
  {id:'2',label:'2. ½-in insulation board over 1-in glass fiber or mineral wool batts',masonry:false,above:[24,12,9,6,4],sides:[18,9,6,5,3]},
  {id:'3',label:'3. 0.024-in (24 ga) sheet metal over 1-in batts, wire-reinforced, ventilated airspace',masonry:false,above:[18,9,6,5,3],sides:[12,6,4,3,3]},
  {id:'4',label:'4. 3½-in masonry wall with ventilated airspace',masonry:true,above:[null,null,null,null,null],sides:[12,6,6,6,6]},
  {id:'5',label:'5. 0.024-in (24 ga) sheet metal with ventilated airspace',masonry:false,above:[18,9,6,5,3],sides:[12,6,4,3,2]},
  {id:'6',label:'6. ½-in insulation board with ventilated airspace',masonry:false,above:[18,9,6,5,3],sides:[12,6,4,3,3]},
  {id:'7',label:'7. 0.024-in sheet metal + ventilated airspace over same (double)',masonry:false,above:[18,9,6,5,3],sides:[12,6,4,3,3]},
  {id:'8',label:'8. 1-in batts between two 0.024-in sheets with ventilated airspace',masonry:false,above:[18,9,6,5,3],sides:[12,6,4,3,3]}
];
function ifgc308Interp(vals, required){
  if(!(required>0)||!Number.isFinite(required))throw Error('Enter a positive required clearance (inches).');
  if(required<6)throw Error('Hard stop: IFGC §308.2 — reduced clearances shall not be derived by extrapolation below the range of Table 308.2 (columns start at 6 in).');
  if(required>36)throw Error('Outside this tool’s range: required clearance > 36 in is outside the digitized Table 308.2 column set (36/18/12/9/6). Verify with the adopted table; this tool does not invent values above 36 in.');
  const cols=IFGC308_COLS;
  for(let i=0;i<cols.length;i++){
    if(Math.abs(required-cols[i])<1e-9){
      const cell=vals[i];
      if(cell==null)throw Error('Hard stop: Table 308.2 marks this masonry/orientation cell N/A (Above Col. 1). Choose Sides and rear, another protection method, or UL 1618 listing path.');
      return {reduced:cell,exact:true,loCol:cols[i],hiCol:cols[i],loVal:cell,hiVal:cell};
    }
  }
  for(let i=0;i<cols.length-1;i++){
    const hi=cols[i],lo=cols[i+1];
    if(required<hi&&required>lo){
      const vHi=vals[i],vLo=vals[i+1];
      if(vHi==null||vLo==null)throw Error('Hard stop: cannot interpolate — one or both bounding Table 308.2 cells are N/A (masonry Above).');
      const reduced=vHi+(vLo-vHi)*((hi-required)/(hi-lo));
      return {reduced,exact:false,loCol:lo,hiCol:hi,loVal:vLo,hiVal:vHi};
    }
  }
  throw Error('Internal Table 308.2 column error.');
}

// Machinery-room ventilation — machinery-room ventilation screening (scholar-aligned).
// Paths:
//   non_2L_sqrtG     → A1/A2/A3/B1/B2/B3 only; Q = 100*sqrt(G) per IMC §1105.6.3.2 Eq 11-2
//                      (same relationship as ASHRAE 15 Addendum q). Do NOT put B2L on √G.
//   a2l_level1_level2 → A2L and B2L; NEVER √G; Level 1 continuous + Level 2 from Addendum q
//                      (P=DP+14.70; Q*=646×P^0.62; G*=21200×P^-0.72; Eq 8-1/8-2/8-3; Q≥Q1;
//                      round up 2 sig figs; multi-refrig → max Q). Cite IMC §1106.4 / §1106.4.3.
// codeFamily default IMC (national US). UMC → verify_manual (different B2L/√G lineage).
// Continuous: IMC §1105.6.3.1 max(0.5×ft², 20×persons) unverified example pending 15-2024 confirm
//             + optional 18°F rise screening note.
const MRVENT_NON_2L=new Set(['A1','A2','A3','B1','B2','B3']);
const MRVENT_A2L_B2L=new Set(['A2L','B2L']);
function mrventPath(safetyGroup){
  if(MRVENT_NON_2L.has(safetyGroup))return 'non_2L_sqrtG';
  if(MRVENT_A2L_B2L.has(safetyGroup))return 'a2l_level1_level2';
  throw Error(`Unsupported refrigerant safety group "${safetyGroup}" for Machinery-room ventilation.`);
}
function mrventRoundUp2Sig(x){
  if(!(x>0)||!Number.isFinite(x))return x;
  const exp=Math.floor(Math.log10(x));
  const factor=Math.pow(10,exp-1);
  return Math.ceil(x/factor-1e-12)*factor;
}
function mrventLevel2({G,DP,Q1}){
  const P=DP+14.70;
  const Qstar=646*Math.pow(P,0.62);
  const Gstar=21200*Math.pow(P,-0.72);
  let Qeq,eqId;
  if(G<0.1*Gstar){Qeq=Qstar*0.102;eqId='8-1';}
  else if(G<=Gstar){Qeq=Qstar*(1+0.39*Math.log(G/Gstar));eqId='8-2';}
  else {Qeq=Qstar;eqId='8-3';}
  const beforeRound=Math.max(Qeq,Q1);
  const Q=mrventRoundUp2Sig(beforeRound);
  return {P,Qstar,Gstar,Qeq,eqId,beforeRound,Q};
}

// Refrigeration path gate — path selection only. NO numeric charge / RCL / mmax.
function ashrae152PathGate(v){
  const reasons=[];
  const citations=[];
  const single=v.serves_single_dwelling_or_sleeping_unit==='yes';
  const listed=v.system_listed==='yes';
  const listedUnknown=v.system_listed==='unknown';
  const multi=v.system_serves_common_or_multiple_units==='yes';
  const bt=v.building_type;
  const residentialFamily=['one_two_family','townhouse'].includes(bt);
  const multifamily=bt==='multifamily';
  const commercial=bt==='commercial';

  let path='blocked_need_ahj';

  // 1) multi-unit OR not single dwelling/sleeping → std15_imc_ch11
  if(multi||!single){
    path='std15_imc_ch11';
    reasons.push(multi?'system_serves_common_or_multiple_units':'not_single_dwelling_or_sleeping_unit');
    citations.push('ASHRAE 15','IMC Ch 11');
  }
  // 2) commercial → std15_imc_ch11 (15.2 residential path is for dwellings / sleeping units, not commercial buildings)
  else if(commercial){
    path='std15_imc_ch11';
    reasons.push(single&&!multi?'commercial_building_not_15_2_residential':'commercial_without_single_unit_system');
    citations.push('ASHRAE 15','IMC Ch 11');
  }
  // 3) not listed → std15_imc_ch11 (or blocked_need_ahj if unknown)
  else if(listedUnknown){
    path='blocked_need_ahj';
    reasons.push('listing_unknown_need_ahj');
    citations.push('AHJ confirm listing');
  }
  else if(!listed){
    path='std15_imc_ch11';
    reasons.push('system_not_listed');
    citations.push('ASHRAE 15','IMC Ch 11');
  }
  // 4) one/two family or townhouse OR multifamily+single-unit + listed → 15_2_residential
  else if((residentialFamily||(multifamily&&single&&!multi))&&listed&&single){
    path='15_2_residential';
    reasons.push(residentialFamily?'one_two_family_or_townhouse_listed_single':'multifamily_single_unit_listed');
    citations.push('ASHRAE 15.2');
    if(v.code_family==='irc'||residentialFamily)citations.push('IRC install path');
  }
  else{
    path='blocked_need_ahj';
    reasons.push('insufficient_path_inputs');
    citations.push('AHJ confirm');
  }

  const flag_irc_install=path==='15_2_residential'&&(v.code_family==='irc'||residentialFamily);
  const flag_ashrae_152_charge=path==='15_2_residential';
  const flag_ashrae_15_charge=path==='std15_imc_ch11';
  const flag_imc_machinery_room=path==='std15_imc_ch11'&&(commercial||multi||v.machinery_room_context==='yes');

  return {path,reasons,citations,flags:{flag_irc_install,flag_ashrae_152_charge,flag_ashrae_15_charge,flag_imc_machinery_room},verified:false};
}

  for(const key of checks){
    const ans=v[key];if(ans==='yes')ok++;else if(ans==='no')fail++;else if(ans==='na')na++;else unk++;
    rows.push([key,ans==='yes'?1:ans==='no'?0:-1,ans]);
  }
  rows.push(['OK',ok,'ea'],['Deficient',fail,'ea'],['Unknown',unk,'ea'],['N/A',na,'ea']);
  return result(fail+unk,'items needing attention',rows,
  `handoff receiver = ${ok} OK / ${fail} deficient / ${unk} unknown / ${na} N/A; conductor size = not calculated`,
  'IFGC §310 remains the fuel-gas checklist source. Electrical bonding must be verified under the adopted NEC, the specific CSST listing, and local amendments by qualified parties. This receiver does not select conductor size, connection hardware, or inspection acceptance.',
  [[ok,'OK'],[fail,'deficient'],[unk,'unknown']],['IFGC §310','Adopted NEC','CSST listing + AHJ']);
}},

{id:'multizoneoa',name:'Multizone outdoor air (IMC 403)',group:'CODE & VENTILATION',icon:'air',desc:'Calculate uncorrected and system outdoor-air intake from aggregate multizone inputs and a source-verified system ventilation efficiency.',badge:'IMC §403 · multizone',sources:['imc'],fields:[
field('systemPopulation','System population Ps','people',80,0,1e6),
field('sumZonePopulation','Sum of zone populations ΣPz','people',100,0.001,1e6),
field('sumPeopleOA','Sum of people outdoor air Σ(Rp×Pz)','cfm',120,0,1e8),
field('sumAreaOA','Sum of area outdoor air Σ(Ra×Az)','cfm',80,0,1e8),
field('ev','System ventilation efficiency Ev','0–1',0.9,0.01,1,'any','Enter a value verified from the adopted IMC table or an approved ASHRAE 62.1 procedure. No Ev table cells are embedded.'),
field('criticalVoz','Critical-zone outdoor airflow Voz','cfm',100,0,1e8),
field('criticalVpz','Critical-zone primary airflow Vpz','cfm',500,0.001,1e8)
],calculate:v=>{
  const D=Math.min(1,v.systemPopulation/v.sumZonePopulation);
  const Zp=v.criticalVoz/v.criticalVpz;
  const Vou=D*v.sumPeopleOA+v.sumAreaOA;
  const Vot=Vou/v.ev;
  return result(Vot,'cfm system intake',[
    ['Population diversity D',D,''],
    ['Critical-zone outdoor-air fraction Zp',Zp,''],
    ['People component after diversity',D*v.sumPeopleOA,'cfm'],
    ['Area component',v.sumAreaOA,'cfm'],
    ['Uncorrected outdoor air Vou',Vou,'cfm'],
    ['Source-verified system efficiency Ev',v.ev,''],
    ['System outdoor-air intake Vot',Vot,'cfm'],
    ['Embedded Ev table cells',0,'none']
  ],`D = min(1, Ps/ΣPz) = ${fmt(D,4)}; Vou = D×Σ(RpPz) + Σ(RaAz) = ${fmt(Vou,4)} cfm; Vot = Vou/Ev = ${fmt(Vot,4)} cfm`,
  'Aggregate multiple-zone recirculating-system screen. Enter zone values from the single-zone outdoor-air tool and use the lowest expected primary airflow for a fully occupied VAV critical zone. Ev must come from the adopted source or approved procedure; this tool does not reproduce the table or perform the full primary/secondary system analysis.',
  [[Vou,'cfm Vou'],[Zp,'critical Zp']],['IMC §403 multiple-zone procedure','Ev user verified','AHJ + mechanical designer']);
}},
{id:'parkinggarage',name:'Parking garage ventilation (IMC 404)',group:'CODE & VENTILATION',icon:'air',desc:'Calculate full-on and standby enclosed-parking-garage airflow and gate automatic operation on CO plus NO₂ detection.',badge:'IMC §404 · operating modes',sources:['imc'],fields:[
field('area','Enclosed garage floor area','ft²',20000,0.001,1e8),
choice('operation','Operating path',[['continuous','Continuous full-on ventilation'],['automatic','Automatic contaminant-controlled ventilation']],'automatic'),
choice('co','CO detection provided?',ircInstallYn,'unk'),
choice('no2','NO₂ detection provided?',ircInstallYn,'unk'),
choice('listed','Detection equipment listed / labeled for the application?',ircInstallYn,'unk'),
choice('sequence','Controls maintain nonzero standby and full-on operation?',ircInstallYn,'unk')
],calculate:v=>{

    ['Standby airflow',standby,'cfm'],

  `${v.operation==='automatic'&&open?'Automatic path is incomplete: resolve every detector/listing/control check. ':''}Model 2024 IMC §404 screening. Do not invent generic CO/NO₂ setpoints; use listed equipment, manufacturer instructions, the adopted code, and approved control sequences. Coordinate fire/life-safety operation and local amendments.`,
  [[full,'cfm full-on'],[standby,'cfm standby'],[open,'open checks']],['IMC §404','CO + NO₂ detection','AHJ + controls designer']);

{id:'condensateoverflow',name:'Condensate overflow protection',group:'CODE & VENTILATION',icon:'water',desc:'Route IMC §307.2.3 auxiliary condensate protection when primary-drain overflow could damage building components.',badge:'IMC §307.2.3 · path gate',sources:['imc'],fields:[
choice('damageRisk','Could primary-drain overflow damage building components?',[['unknown','Unknown — inspect / verify'],['yes','Yes'],['no','No']],'unknown','This is the trigger question for the §307.2.3 auxiliary-protection path. Primary condensate disposal remains required separately.'),
choice('method','Selected auxiliary-protection method',[
['secondary_pan_drain','Auxiliary pan with separate drain'],
['overflow_line','Separate overflow drain from equipment pan'],
['pan_shutoff','Auxiliary pan + listed water-level shutoff'],
['primary_shutoff','Listed water-level shutoff at primary / overflow / equipment pan'],
['internal_monitor','Internal primary-pan monitoring device where external pan / secondary drain is impracticable'],
['none','None selected']
],'none'),
choice('separateTermination','Auxiliary / overflow path is separate and conspicuous?',[['unknown','Unknown / verify'],['yes','Yes'],['no','No'],['na','N/A — shutoff-only method']],'unknown'),
choice('listedShutoff','Water-level device is listed and shuts equipment off before overflow?',[['unknown','Unknown / verify'],['yes','Yes'],['no','No'],['na','N/A — drain method']],'unknown'),
choice('serviceAccess','Protection remains accessible for inspection and service?',[['unknown','Unknown / verify'],['yes','Yes'],['no','No']],'unknown')
],calculate:v=>{
  const ahj='Model 2024 IMC §307.2.3 screening. Confirm the AHJ-adopted edition, amendments, equipment listing, discharge location, pan construction, and device standard. Primary condensate disposal and drain sizing are separate. Not a compliance certificate.';
  if(v.damageRisk==='unknown')throw Error('Determine whether a primary-drain overflow could damage building components before selecting a §307.2.3 path.');
  if(v.damageRisk==='no'){
    return result(0,'auxiliary path not triggered',[
      ['Overflow damage trigger',0,'no'],
      ['Primary condensate disposal',1,'still required'],
      ['AHJ / listing review',1,'required']
    ],'damageRisk = no → §307.2.3 auxiliary-protection trigger not established by this screen',
    `This result does not waive primary drainage, manufacturer instructions, or another adopted-code trigger. ${ahj}`,
    [],['IMC §307.2.3','Primary drain separate','AHJ verify']);
  }
  if(v.method==='none')throw Error('Overflow damage is possible: select one adopted §307.2.3 auxiliary-protection method.');
  const drainMethod=v.method==='secondary_pan_drain'||v.method==='overflow_line';
  const shutoffMethod=v.method==='pan_shutoff'||v.method==='primary_shutoff'||v.method==='internal_monitor';
  const issues=[];
  if(drainMethod&&v.separateTermination!=='yes')issues.push('verify a separate, conspicuous auxiliary / overflow discharge path');
  if(shutoffMethod&&v.listedShutoff!=='yes')issues.push('verify a listed water-level device that shuts equipment off before overflow');
  if(v.serviceAccess!=='yes')issues.push('verify inspection and service access');
  const methodLabels={
    secondary_pan_drain:'auxiliary pan + separate drain',
    overflow_line:'separate equipment-pan overflow line',
    pan_shutoff:'auxiliary pan + water-level shutoff',
    primary_shutoff:'primary / overflow / equipment-pan shutoff',
    internal_monitor:'internal primary-pan monitoring device'
  };
  const ready=issues.length===0;
  return result(ready?1:0,ready?'screen ready':'verification open',[
    ['Overflow damage trigger',1,'yes'],
    ['Selected path',1,methodLabels[v.method]],
    ['Separate / conspicuous discharge',v.separateTermination==='yes'?1:0,v.separateTermination],
    ['Listed shutoff before overflow',v.listedShutoff==='yes'?1:0,v.listedShutoff],
    ['Inspection / service access',v.serviceAccess==='yes'?1:0,v.serviceAccess],
    ['Open verification items',issues.length,'ea']
  ],`damageRisk=yes → ${methodLabels[v.method]}; open verification items = ${issues.length}`,
  `${ready?'Selected path has no open answers in this screen.':'Open: '+issues.join('; ')+'.'} This does not verify pan dimensions, material, termination location, device listing, wiring, or installation. ${ahj}`,
  [[issues.length,'open checks']],['IMC §307.2.3','Auxiliary protection','AHJ + listing verify']);
}},
{id:'ductsmoke',name:'Duct smoke detector gate',group:'CODE & VENTILATION',icon:'air',desc:'Screen IMC §606.2 return-air, common-duct, and multistory-riser airflow triggers without claiming exception approval.',badge:'IMC §606.2 · path gate',sources:['imc'],fields:[
field('systemCfm','Individual return-air system design capacity','cfm',1800,0,1e7),

field('combinedCfm','Combined design capacity at common duct / plenum','cfm',0,0,1e8),
field('riserStories','Stories served by return-air riser','stories',1,1,200,1),
field('riserCfm','Return-air riser design capacity','cfm',0,0,1e8),

],calculate:v=>{

  const manual=v.exceptionPath!=='no';

    ['Return riser ≥2 stories and > 15,000 cfm',riser?1:0,riser?'triggered':'not triggered'],
    ['Trigger categories',triggers,'ea'],

    ['Inspection / maintenance access',1,'required']
  ],`triggers = (systemCFM > 2000) + (shared && combinedCFM > 2000) + (stories ≥ 2 && riserCFM > 15000) = ${triggers}`,

  [[triggers,'trigger categories']],['IMC §606.2','NFPA 72 coordination','AHJ + fire alarm designer']);

{id:'frictionrate',name:'Duct friction rate',group:'AIR & DUCTS',icon:'duct',desc:'Calculate preliminary available-static-pressure friction rate from total effective length.',badge:'Manual D prep · engineering',sources:['manuald'],fields:[
field('externalStatic','Equipment available external static pressure','in. w.c.',0.5,0.001,20),
field('filterDrop','Filter pressure drop','in. w.c.',0.1,0,20),
field('coilDrop','Coil pressure drop outside equipment rating','in. w.c.',0,0,20),
field('accessoryDrop','Grilles, registers, dampers, and accessories','in. w.c.',0.1,0,20),
field('reserve','Design reserve / other losses','in. w.c.',0.05,0,20),
field('tel','Total effective length','ft',200,0.1,10000)
],calculate:v=>{
  const deductions=v.filterDrop+v.coilDrop+v.accessoryDrop+v.reserve;
  const asp=v.externalStatic-deductions;
  if(asp<=0)throw Error('Pressure-drop deductions consume all available external static pressure. Revise the system or equipment selection.');
  const fr=asp*100/v.tel;
  return result(fr,'in. w.c. / 100 ft',[
    ['Equipment external static',v.externalStatic,'in. w.c.'],
    ['Pressure-drop deductions',deductions,'in. w.c.'],
    ['Available static pressure',asp,'in. w.c.'],
    ['Total effective length',v.tel,'ft'],
    ['Preliminary friction rate',fr,'in. w.c. / 100 ft']
  ],`ASP = ESP − Σ component drops = ${fmt(v.externalStatic,4)} − ${fmt(deductions,4)} = ${fmt(asp,4)} in. w.c.; FR = ASP × 100 / TEL = ${fmt(fr,4)}`,
  'Preliminary Manual D preparation only. Confirm which filter, coil, and accessory losses are already included in the equipment rating; do not double-count. Final duct design requires manufacturer blower data, fitting effective lengths, room-by-room airflow, sound, leakage, balancing, and actual installed performance.',
  [[asp,'in. w.c. available']],['ACCA Manual D','Manufacturer blower table','Engineering calculation']);
}},
{id:'makeupbalance',name:'Exhaust / makeup-air balance',group:'CODE & VENTILATION',icon:'air',desc:'Quantify replacement-air deficit for a kitchen or process exhaust system; the AHJ decides what is approximately equal.',badge:'IMC §508 · balance',sources:['imc'],fields:[
field('exhaust','Total mechanical exhaust','cfm',2000,0,1e7),
field('dedicated','Dedicated makeup air delivered','cfm',1600,0,1e7),
field('transfer','Approved transfer air available','cfm',200,0,1e7),
field('hvacCredit','Outdoor / supply air credit approved for replacement','cfm',0,0,1e7,'any','Use only air that is available during exhaust operation and approved by the designer / AHJ.'),
field('netExfiltration','Design net exfiltration','cfm',0,0,1e7,'any','Enter the project-design net exfiltration quantity. This calculator does not select it or an allowable pressure target.')
],calculate:v=>{
  const replacement=v.dedicated+v.transfer+v.hvacCredit;
  const requiredReplacement=v.exhaust+v.netExfiltration;
  const deficit=Math.max(0,requiredReplacement-replacement);
  const surplus=Math.max(0,replacement-requiredReplacement);
  const coverage=v.exhaust>0?replacement/v.exhaust*100:100;
  return result(deficit,'cfm deficit',[
    ['Total exhaust',v.exhaust,'cfm'],
    ['Replacement air credited',replacement,'cfm'],
    ['Design net exfiltration',v.netExfiltration,'cfm'],
    ['Replacement target used',requiredReplacement,'cfm'],
    ['Unfilled replacement-air deficit',deficit,'cfm'],
    ['Replacement surplus',surplus,'cfm'],
    ['Replacement / exhaust ratio',coverage,'%']
  ],`required replacement = total exhaust + net exfiltration = ${fmt(requiredReplacement)} cfm; provided replacement = dedicated + transfer + approved HVAC credit = ${fmt(replacement)} cfm; deficit = max(0, required − provided) = ${fmt(deficit)} cfm`,
  'Air-balance arithmetic only. This tool does not select an allowable building pressure, approve transfer-air sources, or establish code compliance. Verify simultaneous operation, short-circuiting, temperature control, capture and containment, combustion-appliance effects, energy-code controls, and the AHJ-adopted IMC §508 requirements.',
  [[replacement,'cfm replacement'],[coverage,'% of exhaust']],['IMC §508','User-supplied air credits','AHJ + mechanical designer']);
}}
);

{id:'equivduct',name:'Equivalent round duct',group:'AIR & DUCTS',icon:'duct',desc:'Convert a rectangular duct’s inside size to an equivalent round diameter for friction comparison.',badge:'Duct geometry',sources:['manuald','ashrae'],fields:[
field('width','Inside width','in',12,.001,1000),
field('height','Inside height','in',8,.001,1000)
],calculate:v=>{
  const a=Math.max(v.width,v.height),b=Math.min(v.width,v.height);
  const area=v.width*v.height/144;
  const de=1.30*Math.pow(v.width*v.height,0.625)/Math.pow(v.width+v.height,0.25);
  const aspect=a/b;
  return result(de,'in equivalent',[
    ['Rectangular area',area,'ft²'],
    ['Aspect ratio (long ÷ short)',aspect,''],
    ['Equivalent round diameter',de,'in']
  ],`De = 1.30 × (a×b)^0.625 / (a+b)^0.25 = ${fmt(de,4)} in`,
  'Uses the common ASHRAE / Manual D equivalent-diameter relationship for equal friction. This is not a product size, fitting catalog selection, or a complete duct design. Extreme aspect ratios increase friction and noise beyond what diameter alone conveys.',
  [[area,'ft² area'],[aspect,'aspect']],['ASHRAE duct geometry','ACCA Manual D']);
}},
{id:'facevelocity',name:'Face velocity',group:'AIR & DUCTS',icon:'air',desc:'Find air speed across a coil, filter, grille, or other rectangular face.',badge:'Coil / grille check',sources:[],fields:[
field('flow','Airflow','CFM',1200,0),
field('width','Face width','in',30,.001,1000),
field('height','Face height','in',24,.001,1000)
],calculate:v=>{
  const area=v.width*v.height/144;
  if(area<=0)throw Error('Face area must be greater than zero.');
  const vel=v.flow/area;
  return result(vel,'ft/min',[
    ['Face area',area,'ft²'],
    ['Airflow',v.flow,'CFM'],
    ['Face velocity',vel,'ft/min']
  ],`Velocity = CFM ÷ face area = ${v.flow} ÷ ${fmt(area,4)}`,
  'Uses the clear rectangular face only. Manufacturer limits for coils, filters, and grilles differ; this does not check throw, pressure drop, or condensate carryover.');
}},
{id:'cfmton',name:'Airflow per ton',group:'AIR & DUCTS',icon:'air',desc:'Express supply airflow relative to cooling capacity in tons.',badge:'System check',sources:[],fields:[
field('flow','Supply airflow','CFM',1400,0),
field('capacity','Cooling capacity','BTU/h',36000,.001)
],calculate:v=>{
  const tons=v.capacity/12000;
  if(tons<=0)throw Error('Cooling capacity must be greater than zero.');
  const ratio=v.flow/tons;
  return result(ratio,'CFM/ton',[
    ['Cooling capacity',v.capacity,'BTU/h'],
    ['Cooling tons',tons,'tons'],
    ['Supply airflow',v.flow,'CFM'],
    ['Airflow per ton',ratio,'CFM/ton']
  ],`CFM/ton = CFM ÷ (BTU/h ÷ 12,000) = ${v.flow} ÷ ${fmt(tons,4)}`,
  'Common field check only. Design airflow depends on sensible/latent split, coil selection, and climate. Typical “400 CFM/ton” rules of thumb are not a substitute for Manual J/S or manufacturer data.');

{id:'shr',name:'Sensible heat ratio',group:'HEATING & COOLING',icon:'snow',desc:'Compare sensible cooling with total cooling at one condition.',badge:'Coil split',sources:['ashrae'],fields:[
field('sensible','Sensible capacity','BTU/h',28000,0),
field('total','Total capacity','BTU/h',36000,.001)
],calculate:v=>{
  if(v.total<=0)throw Error('Total capacity must be greater than zero.');
  if(v.sensible>v.total)throw Error('Sensible capacity cannot exceed total capacity.');
  const latent=v.total-v.sensible,shr=v.sensible/v.total;
  return result(shr,'SHR',[
    ['Sensible capacity',v.sensible,'BTU/h'],
    ['Latent capacity',latent,'BTU/h'],
    ['Total capacity',v.total,'BTU/h'],
    ['Sensible heat ratio',shr,'']
  ],`SHR = Qsensible ÷ Qtotal = ${v.sensible} ÷ ${v.total}`,
  'Same operating condition and system boundary for both capacities. SHR does not size equipment by itself; match coil and airflow to the building’s sensible and latent loads.');
}},
{id:'tons',name:'Cooling tons',group:'HEATING & COOLING',icon:'snow',desc:'Convert a cooling capacity between BTU/h and tons of refrigeration.',badge:'Capacity convert',sources:['nist'],fields:[
field('capacity','Cooling capacity','BTU/h',36000,0)
],calculate:v=>{

  ],`tons = BTU/h ÷ 12,000 = ${v.capacity} ÷ 12,000`,
  'One ton of refrigeration equals 12,000 BTU/h by definition. This converts capacity only; it does not select equipment or prove a load calculation.',
  [[v.capacity/3412.141633,'kW thermal']]);
}},
{id:'pumplaws',name:'Pump affinity laws',group:'HYDRONICS',icon:'water',desc:'See how a change in pump speed affects flow, head, and power.',badge:'Affinity laws',sources:[],fields:[
field('rpm1','Original speed','rpm',1750,.001,100000),
field('rpm2','New speed','rpm',1450,.001,100000),
field('flow','Original flow','US gpm',40,.001),
field('head','Original head','ft',40,0,10000),
field('power','Original shaft power','hp',1.5,0,100000)
],calculate:v=>{
  const r=v.rpm2/v.rpm1;
  return result(v.flow*r,'US gpm',[
    ['Speed ratio',r,'×'],
    ['New head',v.head*r*r,'ft'],
    ['New shaft power',v.power*r**3,'hp'],
    ['Power change',(r**3-1)*100,'%']
  ],`r = N₂/N₁; Q₂ = Q₁r; H₂ = H₁r²; P₂ = P₁r³`,
  'Same pump geometry, fluid density, and similar operating conditions. Check the pump curve, NPSH, motor capacity, and maximum safe speed. Shaft power is not electrical input.');
}},
{id:'pipevelocity',name:'Pipe velocity',group:'HYDRONICS',icon:'water',desc:'Find liquid speed from flow rate and the pipe’s inside diameter.',badge:'Pipe flow check',sources:[],fields:[
field('flow','Liquid flow','US gpm',20,0),
field('diameter','Inside diameter','in',1.049,.001,100)
],calculate:v=>{
  const area=Math.PI*Math.pow(v.diameter/12,2)/4;
  const cfs=v.flow/(7.48051948*60);
  const fps=cfs/area;
  const fpm=fps*60;
  return result(fps,'ft/s',[
    ['Internal area',area,'ft²'],
    ['Volumetric flow',cfs,'ft³/s'],
    ['Velocity',fps,'ft/s'],
    ['Velocity',fpm,'ft/min']
  ],`V = (GPM ÷ 7.4805 ÷ 60) ÷ (π(d/12)²/4) ≈ 0.4085 × GPM / d²`,
  'Uses clear internal diameter, not nominal pipe size. Velocity alone does not size a hydronic circuit; friction loss, fittings, pump head, and noise limits also matter.',
  [[fpm,'ft/min']]);
}},
{id:'gascost',name:'Fuel-gas operating cost',group:'ENERGY & MATH',icon:'cost',desc:'Estimate natural-gas use and cost from rated input and a run schedule.',badge:'Gas energy cost',sources:[],fields:[
field('input','Rated fuel input','BTU/h',80000,0),
field('hours','Hours per day','h',8,0,24),
field('days','Number of days','days',30,1,3660,1),
field('rate','Gas rate','$/therm',1.2,0,100),
field('heatContent','Heat content','BTU/ft³',1000,1,5000,'any','Local utility heating value. Used only to report approximate cubic feet.')
],calculate:v=>{

function evaluateCalculator(c,v){

    const n=v[f.key];if(n===''||!Number.isFinite(n))throw Error(`Enter ${f.label.toLowerCase()}.`);
    if(n<f.min||n>f.max)throw Error(`${f.label}: enter ${fmt(f.min,6)} to ${fmt(f.max)} ${f.unit}.`);
    if(f.step===1&&!Number.isInteger(n))throw Error(`${f.label}: use a whole number.`);
  }
  const r=c.calculate(v);if(!Number.isFinite(r.value)||r.rows.some(x=>!Number.isFinite(x[1]))||r.extra.some(x=>!Number.isFinite(x[0])))throw Error('These inputs exceed the supported calculation range.');return r;

function workspace(inputBody,resultBody,footHtml=''){return `<div class="workspace"><section class="panel input-panel">${inputBody}</section><section class="panel result-panel" id="result" aria-label="Calculation result">${resultBody||''}</section></div>${footHtml?`<div class="workspace-foot"><span>${footHtml}</span></div>`:''}`;}
function resultHero(label,valueHtml,extrasHtml=''){return `<div class="result-hero"><div class="result-label">${esc(label)}</div><div class="result-number" role="status" aria-live="polite">${valueHtml}</div>${extrasHtml}</div>`;}
function resultExtras(extra){return extra&&extra.length?`<div class="equivalents">${extra.map(([n,u])=>`<span><b>${pretty(n)}</b> ${esc(u)}</span>`).join('')}</div>`:'';}
function resultRows(rows){return `<div class="result-rows">${rows.map(([l,n,u])=>`<div class="result-row"><span>${esc(l)}</span><span>${pretty(n,4)} <small>${esc(u)}</small></span></div>`).join('')}</div>`;}
function citeTags(cites){return cites&&cites.length?`<div class="cite-tags">${cites.map(t=>`<span><b>${esc(t)}</b></span>`).join('')}</div>`:'';}
function emptyResult(){return '<div class="empty-result"><span>Result</span><strong>—</strong><p>Complete the inputs to calculate.</p></div>';}
function chipHTML(chip){
  if(chip.kind==='deeplink'){
    return `<aside class="crosscode-chip" data-chip-id="${esc(chip.id)}"><div class="crosscode-chip-id">${esc(chip.id)}</div><div class="crosscode-chip-title">${esc(chip.label||chip.id)}</div><p>${esc(chip.body||'')}</p><button type="button" class="text-button" data-chip-nav="${esc(chip.route||'')}">${esc(chip.cta||'Open')}</button></aside>`;
  }
  return `<aside class="crosscode-chip" data-chip-id="${esc(chip.id)}"><div class="crosscode-chip-id">${esc(chip.id)}</div><div class="crosscode-chip-title">${esc(chip.label||chip.id)}</div><p>Checklist source stays <strong>${esc(chip.source||'IFGC §310')}</strong>. Hand off electrical bonding to <strong>${esc(chip.target||'NEC')}</strong> / listing — not calculated here.</p>${chip.fields?`<dl>${Object.entries(chip.fields).map(([k,val])=>`<dt>${esc(k)}</dt><dd>${esc(String(val))}</dd>`).join('')}</dl>`:''}</aside>`;
}
function chipsBlock(chips){return chips&&chips.length?`<div class="crosscode-chips">${chips.map(chipHTML).join('')}</div>`:'';}
function methodDetails(formula,note,cites,sources,open){return `<details id="method" class="method" ${open?'open':''}><summary>Method</summary><div class="method-body"><div class="formula">${esc(formula)}</div><p class="method-note">${esc(note)}</p>${citeTags(cites)}${links(sources)}</div></details>`;}

function advancedTitleFor(id){return advancedTitles[id]||'Air properties';}

const IMC_COMMON='Based on model 2024 mechanical-code values. Confirm your adopted edition and amendments. Appendices apply only if adopted. Where ASHRAE is referenced, the mechanical code text governs conflicts. Fuel-gas piping, appliances, and vents belong in the fuel-gas code. Some one- and two-family dwellings may follow the residential code instead, when that path is adopted. Screening only — not a compliance certificate.';
function calculatorDisclaimers(id){
  const blocks=[];

    blocks.push('<strong>Key definitions</strong><br><strong>Net occupiable floor area:</strong> Inside wall-to-wall floor area. Do not deduct furniture or racks. Exclude shafts, column enclosures, and inaccessible unoccupiable areas.<br><strong>Breathing zone:</strong> Roughly 3–72 in. above the floor and more than 2 ft from walls or fixed air equipment.<br><strong>Occupiable space:</strong> An enclosed space meant for people — not storage or equipment rooms used only briefly.<br><strong>Outdoor air:</strong> Fresh outdoor air, not air already circulated through the system.');
  }
  if(['outdoorair','exhaust','condensate','dryerduct','hoodcfm'].includes(id)){
    let extra='';
    if(id==='condensate')extra=' Condensate drain size also follows the parallel plumbing-code rule.';
    if(id==='dryerduct')extra=' Method 1 screens total equivalent length against 35 ft. Fitting lengths here are helpers — verify your adopted table. Exhaust over 200 cfm usually needs makeup air.';
    if(id==='hoodcfm')extra=' Hood rates are screening defaults styled after common Type I / Type II tables. Verify every cell with your adopted edition. Net exhaust subtracts air supplied into the hood. Makeup air is a separate step.';
    blocks.push(IMC_COMMON+extra);
  }
  const byId={
    combustionair:'Based on model fuel-gas combustion-air methods. Confirm your adopted edition. Direct-vent appliances and manufacturer combustion-air paths follow the manufacturer’s instructions — opening tables are not applied there. Screening only — not a compliance certificate.',
    venting:'Routes venting by appliance category. Confirm your adopted edition. Category I prepares material and sizing inputs — capacity tables are not filled in here. A Category I connector into a positive-pressure mechanical-draft vent is not allowed. Categories II–IV, direct-vent, and integral systems follow the manufacturer. Screening only — not a compliance certificate.',
    gaspipesize:'<strong>Gas pipe sizing.</strong> This tool finds the required capacity and developed length, then asks you to pick a size from your adopted sizing table. <strong>It does not invent pipe diameters.</strong> Choose longest-length, branch-length, or hybrid method as adopted. Optional CSST fitting allowance is available. When CSST is present, a bonding checklist and electrician handoff appear — electrical bonding sizes are not calculated here. Confirm your adopted edition. Screening only — not a compliance certificate.',
    mrvent:`<strong>Machinery-room ventilation.</strong> Continuous ventilation uses an unverified example of the larger of 0.5 cfm per ft² or 20 cfm per person. For common (non-2L) refrigerants, emergency airflow follows the square-root charge method. <strong>A2L and B2L never use that method</strong> — they follow the Level 1 / Level 2 path, with Level 2 coefficients treated as unverified examples until confirmed against your adopted text. Detector setpoints are not invented here. If you select UMC, verify manually against that code. Screening pack: ${packLabel()}. Screening only — not a compliance certificate.`,
    clearance308:`<strong>Clearance to combustibles.</strong> Looks up reduced clearances for listed protection methods, with smooth interpolation between the table’s published distances. Digitized cells are unverified examples — confirm every value, footnote, and figure. The tool stops when the listing forbids reduction, protection interferes with combustion air / draft hood / service, the distance is below 6 in, or the required clearance is above 36 in. Masonry “above” rows are not available. UL 1618 stays a listing-only path. Screening pack: ${packLabel()}. Screening only — not a compliance certificate.`,
    tpdischarge:`<strong>T&amp;P discharge.</strong> A practical checklist of typical relief-valve and discharge-piping items. Screening pack: ${packLabel()}. Confirm every clause with your adopted plumbing code. Not a substitute for adopted code, your AHJ, or a PE. Screening only — not a compliance certificate.`,
    ircvent:`<strong>Residential bath, kitchen &amp; whole-house ventilation.</strong> Rates are unverified examples. This tool is for the residential code path only — it will not run under a commercial mechanical-code selection. Continuous kitchen and bath rates differ from the commercial tables (often 25 / 20 cfm here versus higher commercial continuous rates). Whole-house ventilation uses the residential area coefficient. Makeup air may be required when large exhaust shares an air barrier with atmospheric fuel appliances. Screening pack: ${packLabel()}. Confirm your adopted residential code. Screening only — not a compliance certificate.`,
    ashrae152path:`<strong>Refrigeration path.</strong> Chooses among the residential path, the commercial machinery-room path, or “ask your AHJ.” <strong>No refrigerant charge limits are calculated.</strong> Results may recommend the installation checklist or other follow-on tools. Not verified in this tool until your AHJ confirms — this tool never certifies. Screening pack: ${packLabel()}. Not a substitute for adopted code, your AHJ, or a PE.`,
    ircinstall:`<strong>Installation checklist.</strong> Citation-backed screening for condensate, ducts, clearances, access, and related residential install items. Section pointers are unverified examples. <strong>No refrigerant charge fields.</strong> Companion to refrigeration path selection when an install review is recommended. Screening pack: ${packLabel()}. Confirm your adopted residential code and listing. Not a substitute for adopted code, your AHJ, or a PE.`
  };
  if(byId[id])blocks.push(byId[id]);

}
function resultLabelFor(c,r){
  const v=values[c.id]||{};
  switch(c.id){
    case 'btu':return 'Estimated cooling capacity';
    case 'humidity':return 'Dew / frost point';
    case 'outdoorair':return 'Zone outdoor airflow';
    case 'exhaust':return 'Required local exhaust';
    case 'combustionair':
      if(v.directVent==='yes')return 'Follow the manufacturer';
      if(v.method==='mechanical')return 'Mechanical combustion air';
      if(String(v.method||'').startsWith('indoor_volume'))return 'Required enclosure volume';
      return 'Net free area';
    case 'condensate':return 'Minimum drain diameter';
    case 'venting':
      if(v.category==='I')return v.connectorIntoPos==='yes'?'Not allowed':'Category I vent prep';
      return 'Manufacturer vent path';
    case 'dryerduct':return String(r.unit).includes('exceeds')?'Over 35 ft — use the label path':'Remaining Method 1 allowance';
    case 'hoodcfm':return 'Required net exhaust';
    case 'gaspipesize':return 'Required section capacity';
    case 'mrvent':
      if(v.mode==='emergency')return MRVENT_A2L_B2L.has(v.safetyGroup)?'Level 2 emergency airflow':'Emergency purge airflow';
      return 'Continuous airflow';
    case 'clearance308':return v.path==='ul1618'?'Follow the UL 1618 listing':'Reduced clearance';
    case 'tpdischarge':return 'Checklist items marked OK';
    case 'ircvent':return ({local_kitchen:'Kitchen exhaust',local_bath:'Bath exhaust',kitchen_equipment:'Makeup / kitchen equipment',whmv:'Whole-house ventilation',bath_duct_length:'Bath duct length screen'}[v.mode]||'Residential ventilation');
    case 'ashrae152path':return 'Selected path';
    case 'ircinstall':return 'Checklist items marked OK';
    case 'equivduct':return 'Equivalent round diameter';
    case 'facevelocity':return 'Face velocity';
    case 'cfmton':return 'Airflow per ton';
    case 'shr':return 'Sensible heat ratio';
    case 'tons':return 'Cooling tons';
    case 'pumplaws':return 'New pump flow';
    case 'pipevelocity':return 'Pipe velocity';
    case 'gascost':return 'Estimated fuel cost';
    case 'sheave':return 'Driven speed';
    default:return 'Result';
  }
}

function render(){renderNav();const ed=document.querySelector('#code-edition');if(ed&&ed.value!==codeEdition)ed.value=codeEdition;const ahjNote=document.querySelector('.ahj-note');if(ahjNote)ahjNote.innerHTML=`Screening pack: <strong>${esc(codeEditionLabel())}</strong>. ${esc(codeEditionDataNote())} Your adopted code always governs.`;document.querySelector('#mobile-calc').value=active;const main=document.querySelector('main');if(active==='references'){main.innerHTML=references();currentResult=null;document.querySelector('#print').disabled=false;return;}if(active==='changelog'){main.innerHTML=changelog();currentResult=null;document.querySelector('#print').disabled=false;return;}if(active==='convert'){main.innerHTML=converter();bindConverter();return;}const c=calculators.find(x=>x.id===active),adv=advancedFields[active]||[],normal=c.fields.filter(f=>!adv.includes(f.key)),vals=values[active];
  const advOpen=adv.some(k=>vals[k]!==c.fields.find(f=>f.key===k).value);
  const advFields=c.fields.filter(f=>adv.includes(f.key));
  const inputBody=panelHead('Inputs','<button id="reset" type="button" class="text-button">Reset</button>')+`<form id="calc-form" novalidate>${fieldsGrid(normal,vals)}${adv.length?advancedSection(advancedTitleFor(active),advFields,vals,advOpen):''}${calculatorDisclaimers(active)}${formStatus()}</form>`;
  main.innerHTML=heading(active==='btu'?'BTU calculator':c.name,c.desc,c.badge)+workspace(inputBody,'',essentials[active]);
  const form=document.querySelector('#calc-form');form.onsubmit=e=>{e.preventDefault();clearTimeout(timer);readForm(c);run(c);};
  form.oninput=()=>{readForm(c);conditionalFields(c);clearTimeout(timer);run(c);};
  form.onchange=()=>{readForm(c);conditionalFields(c);clearTimeout(timer);run(c);};
  document.querySelector('#reset').onclick=()=>{values[active]=Object.fromEntries(c.fields.map(f=>[f.key,f.value]));render();};conditionalFields(c);run(c);
}
function readForm(c){for(const f of c.fields){const el=document.getElementById(f.key);values[active][f.key]=f.options?el.value:el.value===''?'':Number(el.value);}}
function conditionalFields(c){for(const f of c.fields){const disabled=inactiveField(active,f.key,values[active]);document.querySelector(`[data-field="${f.key}"]`).hidden=disabled;document.getElementById(f.key).disabled=disabled;}}
function run(c){const previous=document.querySelector('#method')?.open||false;try{const r=evaluateCalculator(c,values[active]);currentResult=r;document.querySelector('#print').disabled=false;document.querySelector('#error').textContent='';
  const negative=['superheat','subcooling'].includes(active)&&r.value<0?`<p class="negative-note">Negative difference. Verify the readings; no positive ${active==='superheat'?'superheat':'subcooling'} is indicated.</p>`:'';
  document.querySelector('#result').innerHTML=resultHero(resultLabelFor(c,r),`${pretty(r.value)}<small>${esc(r.unit)}</small>`,resultExtras(r.extra))+resultRows(r.rows)+negative+chipsBlock(r.chips)+methodDetails(r.formula,r.note,r.cites,c.sources,previous);
}catch(e){currentResult=null;document.querySelector('#print').disabled=true;document.querySelector('#result').innerHTML=emptyResult();document.querySelector('#error').textContent=e.message;}}
function unitOptions(selected){return Object.keys(units[conv.category]).map(k=>`<option ${k===selected?'selected':''}>${esc(k)}</option>`).join('');}
function converter(){
  const inputBody=panelHead('Inputs')+`<div class="fields"><div class="field full"><label for="category">Measurement</label><select id="category">${Object.keys(units).map(k=>`<option ${conv.category===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div><div class="field full"><label for="convert-value">Value</label><div class="input-wrap"><input type="number" id="convert-value" step="any" inputmode="decimal" value="${conv.value}" required></div></div><div class="field"><label for="from-unit">From</label><select id="from-unit">${unitOptions(conv.from)}</select></div><div class="field"><label for="to-unit">To</label><select id="to-unit">${unitOptions(conv.to)}</select></div></div><div class="converter-foot"><button id="swap" class="text-button">Swap units ⇄</button><span>Updates as you type</span></div><div id="conversion-error" role="alert"></div>`;
  const resultBody=`<div class="result-hero"><div class="result-label">Converted value</div><div class="result-number" id="conversion-result" role="status" aria-live="polite"></div></div><div class="conversion-equation" id="conversion-formula"></div><p class="method-note converter-note" id="conversion-note"></p><details class="method"><summary>References</summary><div class="method-body">${links(['conversion','nist'])}</div></details>`;

}function bindConverter(){document.querySelector('#category').onchange=e=>{conv.category=e.target.value;[conv.from,conv.to]=Object.keys(units[conv.category]);render();};document.querySelector('#convert-value').oninput=e=>{conv.value=e.target.value;updateConversion();};document.querySelector('#from-unit').onchange=e=>{conv.from=e.target.value;updateConversion();};document.querySelector('#to-unit').onchange=e=>{conv.to=e.target.value;updateConversion();};document.querySelector('#swap').onclick=()=>{[conv.from,conv.to]=[conv.to,conv.from];document.querySelector('#from-unit').value=conv.from;document.querySelector('#to-unit').value=conv.to;updateConversion();};updateConversion();}
function updateConversion(){try{if(String(conv.value).trim()===''||!Number.isFinite(Number(conv.value)))throw Error('Enter a numeric value.');const v=Number(conv.value),n=convert(conv.category,v,conv.from,conv.to);if(!Number.isFinite(n))throw Error('Value exceeds the supported range.');document.querySelector('#print').disabled=false;document.querySelector('#conversion-result').innerHTML=`${pretty(n,7)}<small>${esc(conv.to)}</small>`;document.querySelector('#conversion-formula').textContent=`${pretty(v,7)} ${conv.from} = ${pretty(n,7)} ${conv.to}`;const notes={Temperature:'For a temperature rise or drop, select Temperature difference; absolute temperatures include a scale offset.','Temperature difference':'A change of 1 °C equals a change of 1.8 °F. No 32-degree offset is applied.','Power / capacity':'Thermal kW and electrical input kW describe different quantities, even though they use the same unit.',Pressure:'Conventional inches of water. Gauge-to-absolute pressure needs a reference pressure and is not performed here.','Specific enthalpy':'Unit conversion only. Enthalpy reference datums are not changed; values from different charts may use different zero points.','Humidity ratio':'Moisture mass per dry-air mass, not relative humidity.','Thermal resistance':'Converts area-normalized R-value, not total resistance in K/W.'};document.querySelector('#conversion-note').textContent=notes[conv.category]||'US liquid gallons and US therm; International Table BTU. Full precision is retained until display.';document.querySelector('#conversion-error').textContent='';}catch(e){document.querySelector('#print').disabled=true;document.querySelector('#conversion-result').textContent='—';document.querySelector('#conversion-formula').textContent='';document.querySelector('#conversion-note').textContent='';document.querySelector('#conversion-error').textContent=e.message;}}
